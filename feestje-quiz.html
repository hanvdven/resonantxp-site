<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#101c45" />
  <title>De Kennisproef · de quiz</title>
  <!-- De spelerskant van de quiz: kies je ridder, antwoord op je gsm. De quizmaster stuurt vanuit /feestje-beheer,
       de vraag en de afbeelding staan groot op /feestje-tv. Regels en punten: zie fj_quiz_* in feestje-supabase.sql. -->
  <style>
    @font-face { font-family: "Maximilian"; src: url(feestje-fonts/maximilian.ttf) format("truetype"); }
    @font-face { font-family: "Grenze"; src: url(feestje-fonts/grenze-latin.woff2) format("woff2"); font-weight: 100 900; }
    @font-face { font-family: "Grenze"; src: url(feestje-fonts/grenze-latin-ext.woff2) format("woff2"); font-weight: 100 900; unicode-range: U+0100-024F, U+1E00-1EFF; }
    :root { --ink: #2a1f16; --zacht: #7a5a30; --perk: #f1e3c2; --rood: #a2302a; --goud: #c99a3a; --nacht: #101c45;
      --a: #a2302a; --b: #2f4f86; --c: #4a6b3c; --d: #b8861f; }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body { margin: 0; font-family: "Grenze", Georgia, serif; font-size: 19px; color: var(--ink); background: var(--perk); line-height: 1.35;
      padding: 0 0 calc(24px + env(safe-area-inset-bottom)); min-height: 100vh; }
    header { background: var(--nacht); color: #f1e6cf; padding: calc(12px + env(safe-area-inset-top)) 16px 12px; display: flex; align-items: center; gap: 12px; }
    header svg { width: 34px; height: 41px; flex: none; }
    h1 { font-family: "Maximilian", serif; font-weight: 400; font-size: 28px; margin: 0; color: #e9be52; line-height: 1.1; }
    header p { margin: 0; font-size: 15px; color: #cfc3a6; }
    header .wie { margin-left: auto; text-align: right; font-size: 14px; color: #cfc3a6; background: none; border: 0; cursor: pointer; }
    .demo { background: #7c2d1a; color: #fff3df; padding: 8px 16px; font-size: 15px; }
    main { padding: 14px 16px; max-width: 560px; margin: 0 auto; }
    button, input { font: inherit; color: inherit; }
    .knop { background: var(--rood); color: #fff3df; border: 0; border-radius: 8px; padding: 12px 18px; min-height: 52px; cursor: pointer; font-size: 21px; width: 100%; }
    .knop:disabled { opacity: .5; }
    input[type=text], input[inputmode] { border: 1px solid #b59a64; border-radius: 8px; padding: 12px 14px; min-height: 56px; background: #fffaf0; width: 100%; font-size: 24px; }
    .stil { color: var(--zacht); }
    .groot { font-family: "Maximilian", serif; font-size: 34px; line-height: 1.1; margin: 6px 0 4px; }
    .nr { font-variant-caps: small-caps; letter-spacing: .08em; color: var(--rood); font-weight: 600; }
    .vraag { font-size: 24px; line-height: 1.25; margin: 4px 0 12px; }
    .plaat { display: block; width: 100%; max-height: 32vh; object-fit: contain; margin: 0 0 12px; border-radius: 3px; background: #e6d3a6; }
    .keuzes { display: grid; gap: 10px; }
    .keuzes button { display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: center; text-align: left; min-height: 64px; padding: 8px 14px 8px 8px;
      border: 0; border-radius: 10px; color: #fff8ea; font-size: 21px; line-height: 1.15; cursor: pointer; box-shadow: 0 2px 0 rgba(0,0,0,.25); }
    .keuzes button b { font-family: "Maximilian", serif; font-weight: 400; font-size: 30px; width: 44px; height: 44px; display: grid; place-items: center;
      background: rgba(255,248,234,.18); border-radius: 50%; }
    .keuzes button:nth-child(1) { background: var(--a); } .keuzes button:nth-child(2) { background: var(--b); }
    .keuzes button:nth-child(3) { background: var(--c); } .keuzes button:nth-child(4) { background: var(--d); }
    .keuzes button:disabled { opacity: .35; }
    .keuzes button.gekozen { opacity: 1; outline: 4px solid var(--ink); outline-offset: 2px; }
    .keuzes button.juist { opacity: 1; outline: 4px solid #e9be52; outline-offset: 2px; }
    .tijd { height: 8px; background: #dcc79a; border-radius: 4px; overflow: hidden; margin: 4px 0 14px; }
    .tijd i { display: block; height: 100%; background: var(--rood); width: 100%; transition: width 1s linear; }
    .vrij { display: grid; gap: 10px; }
    .kaart { background: #ead7ab; border-radius: 10px; padding: 14px 16px; margin-top: 14px; }
    .kaart b { font-family: "Maximilian", serif; font-weight: 400; font-size: 28px; }
    .ridders { display: grid; gap: 8px; margin-top: 10px; }
    .ridders button { display: grid; grid-template-columns: 40px 1fr; gap: 12px; align-items: center; text-align: left; padding: 8px 12px; min-height: 58px;
      border: 1px solid #b59a64; background: #fffaf0; border-radius: 10px; cursor: pointer; font-size: 20px; line-height: 1.1; }
    .ridders svg { width: 36px; height: 43px; }
    .ridders small { display: block; color: var(--zacht); font-size: 15px; }
    ol.stand { padding: 0; margin: 10px 0 0; list-style: none; }
    ol.stand li { display: grid; grid-template-columns: 34px 1fr auto; gap: 8px; padding: 6px 0; border-bottom: 1px solid #dcc79a; font-size: 19px; }
    ol.stand li.ik { font-weight: 700; }
    ol.stand li span:first-child { color: var(--rood); font-weight: 600; }
    .fout { color: var(--rood); min-height: 1.3em; font-size: 16px; margin-top: 6px; }
  </style>
</head>
<body>
  <header>
    <svg viewBox="0 0 200 240" aria-hidden="true"><path d="M10,10 H190 V112 C190,176 142,212 100,234 C58,212 10,176 10,112 Z" fill="#a2302a" stroke="#e9be52" stroke-width="10"/><text x="100" y="150" font-size="120" text-anchor="middle" fill="#e9be52" font-family="Maximilian, serif">?</text></svg>
    <div><h1>De Kennisproef</h1><p>De grote Bohemen-quiz</p></div>
    <button type="button" class="wie" id="wie" hidden></button>
  </header>
  <div class="demo" id="demo" hidden>Demomodus: de quiz loopt alleen op dit toestel. Open /feestje-beheer (pincode 1403) in een ander tabblad om hem te sturen.</div>
  <main id="app" aria-live="polite"></main>

  <script src="feestje-config.js"></script>
  <script src="feestje-wapen.js"></script>
  <script src="feestje-quiz-vragen.js"></script>
  <script src="feestje-db.js"></script>
  <script>
  'use strict';
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const romeins = n => { let o = ''; for (const [v, r] of [[1000, 'M'], [900, 'CM'], [500, 'D'], [400, 'CD'], [100, 'C'], [90, 'XC'], [50, 'L'], [40, 'XL'], [10, 'X'], [9, 'IX'], [5, 'V'], [4, 'IV'], [1, 'I']]) while (n >= v) { o += r; n -= v; } return o.toLowerCase(); };
  const LETTERS = ['A', 'B', 'C', 'D'];
  const app = $('#app');
  if (!Db.live) $('#demo').hidden = false;
  const wapenSvg = (w, uid) => {
    const ok = w && TINCT[w.t1] && TINCT[w.t2] && TINCT[w.c] && w.div in DIVS && w.ch in ALLE_STUKKEN;
    return `<svg viewBox="0 0 200 240" aria-hidden="true">${shieldMarkup(ok ? w : { t1: 'argent', t2: 'argent', div: 'plain', ch: 'none', c: 'or' }, uid, false, '', false)}</svg>`;
  };
  const opslag = { get: k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }, zet: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };

  let ridder = opslag.get('feestje.quiz.ridder');          // id van de gekozen ridder
  let stand = null, t = null, getekend = '', bezig = false;
  const naam = id => stand?.ridders.find(r => r.id === id)?.naam || 'Onbekende ridder';
  // wat deze gsm al antwoordde, per vraag (zodat herladen het antwoord niet vergeet)
  const sleutel = () => `${t.nr}|${t.vraag}`;
  const mijnAntwoord = () => (opslag.get('feestje.quiz.antw') || {})[sleutel()];
  const bewaarAntwoord = a => { const m = opslag.get('feestje.quiz.antw') || {}; m[sleutel()] = a; opslag.zet('feestje.quiz.antw', m); };

  /* ---------- een ridder kiezen ---------- */
  function kies() {
    getekend = 'kies';
    const rs = (stand?.ridders || []).slice().sort((a, b) => a.naam.localeCompare(b.naam, 'nl'));
    app.innerHTML = `<p class="groot">Wie bent u?</p><p class="stil">Kies uw ridder. Staat u er niet bij, vraag dan de heraut om u in te schrijven.</p>
      <div class="ridders">${rs.map(r => { const i = r.naam.indexOf(' van ');
        return `<button type="button" data-id="${r.id}">${wapenSvg(r.wapen, 'k' + r.id)}<span>${esc(i > 0 ? r.naam.slice(0, i) : r.naam)}${i > 0 ? `<small>${esc(r.naam.slice(i + 1))}</small>` : ''}</span></button>`; }).join('')
        || '<p class="stil">Nog geen ridders ingeschreven.</p>'}</div>`;
    app.querySelectorAll('[data-id]').forEach(b => b.addEventListener('click', () => { ridder = +b.dataset.id; opslag.zet('feestje.quiz.ridder', ridder); toonWie(); teken(true); }));
  }
  function toonWie() {
    const w = $('#wie'); w.hidden = !ridder; if (!ridder) return;
    w.innerHTML = `${esc(naam(ridder).split(' van ')[0])}<br><u>wisselen</u>`;
  }
  $('#wie').addEventListener('click', () => { ridder = null; opslag.zet('feestje.quiz.ridder', null); toonWie(); kies(); });

  /* ---------- de quiz zelf ---------- */
  function teken(forceer = false) {
    if (!stand) { app.innerHTML = '<p class="stil">De bode is onderweg…</p>'; return; }
    if (!ridder || !stand.ridders.some(r => r.id === ridder)) { if (getekend !== 'kies' || forceer) kies(); return; }
    if (!t) return;
    const mijn = mijnAntwoord();
    // opnieuw tekenen alleen als er iets veranderde (anders verdwijnt wat u aan het typen bent)
    const staat = [t.fase, t.nr, t.vraag, JSON.stringify(mijn), t.fase === 'uitslag' ? JSON.stringify(t.uitslag) : '', t.fase === 'uit' ? JSON.stringify(t.stand) : ''].join('§');
    if (staat === getekend && !forceer) { tijdbalk(); return; }
    getekend = staat;
    const kop = t.nr ? `<div class="nr">Vraag ${romeins(t.nr)} van ${romeins(t.totaal)}</div>` : '';
    const plaat = t.afbeelding ? `<img class="plaat" src="${esc(t.afbeelding)}" alt="">` : '';
    const vraag = `${kop}<p class="vraag">${esc(t.vraag)}</p>${plaat}`;

    if (t.fase === 'uit') {
      if (t.nr > 0 && t.stand?.length) return eindstand();
      app.innerHTML = `<p class="groot">Welkom, ${esc(naam(ridder).split(' van ')[0])}.</p><p class="stil">De quiz begint straks. Houd deze pagina open: de vragen verschijnen vanzelf.</p>
        <div class="kaart"><b>Zo werkt het</b><br>Meerkeuze en woord: 100 punten voor een goed antwoord, plus 1 punt per seconde dat u sneller bent dan 30 seconden.
        Schatting: hoe dichter bij het juiste getal, hoe meer punten (tot 130); wie er een factor drie naast zit, krijgt niets. Meerdere antwoorden: 50 punten per juist antwoord.</div>`;
      return;
    }
    if (t.fase === 'wacht') {
      app.innerHTML = `${vraag}<p class="stil">Kijk naar het scherm. Zodra de quizmaster de vraag opent, kunt u antwoorden.</p>`;
      return;
    }
    if (t.fase === 'open' && !mijn) {
      let invoer = '';
      if (t.soort === 'keuze') invoer = `<div class="keuzes">${(t.antwoorden || []).map((a, i) => `<button type="button" data-k="${i}"><b>${LETTERS[i]}</b><span>${esc(a)}</span></button>`).join('')}</div>`;
      else if (t.soort === 'meer') invoer = `<form class="vrij" id="vrij">${[1, 2, 3, 4].map(i => `<input type="text" class="meer" autocapitalize="off" autocomplete="off" spellcheck="false" placeholder="Antwoord ${i}" maxlength="40" aria-label="Antwoord ${i}">`).join('')}
          <button class="knop">Inzenden</button><p class="stil">50 punten per juist antwoord. Vul in wat u weet; lege vakjes mogen.</p></form>`;
      else invoer = `<form class="vrij" id="vrij"><input ${t.soort === 'getal' ? 'inputmode="decimal" pattern="-?[0-9]+([.,][0-9]+)?"' : 'type="text" autocapitalize="off" autocomplete="off" spellcheck="false"'} id="tekst"
          placeholder="${t.soort === 'getal' ? 'Uw schatting (een getal)' : 'Uw antwoord'}" required maxlength="60"><button class="knop">Inzenden</button></form>`;
      app.innerHTML = `${vraag}<div class="tijd"><i id="balk"></i></div>${invoer}<div class="fout" id="fout"></div>`;
      app.querySelectorAll('[data-k]').forEach(b => b.addEventListener('click', () => zend(+b.dataset.k, null, b)));
      $('#vrij')?.addEventListener('submit', e => {
        e.preventDefault();
        const v = t.soort === 'meer' ? [...app.querySelectorAll('input.meer')].map(x => x.value.replace(/\|/g, ' ').trim()).filter(Boolean).join('|') : $('#tekst').value.trim();
        if (v) zend(null, v);
      });
      tijdbalk();
      return;
    }
    // geantwoord, gesloten of uitslag
    const lijst = x => esc(String(x ?? '').split('|').filter(Boolean).join(', '));
    const mijnTekst = mijn ? (mijn.keuze != null ? `${LETTERS[mijn.keuze]}. ${esc(t.antwoorden?.[mijn.keuze])}` : lijst(mijn.tekst)) : '';
    if (t.fase === 'uitslag') {
      const u = (t.uitslag || []).find(x => x.ridder_id === ridder), tot = (t.stand || []).find(x => x.ridder_id === ridder);
      const plaats = tot ? 1 + (t.stand || []).filter(x => x.punten > tot.punten).length : null;
      const juist = t.soort === 'keuze' ? `${LETTERS[t.juist]}. ${esc(t.antwoorden?.[t.juist])}` : Array.isArray(t.juist) ? t.juist.map(esc).join(', ') : esc(t.juist);
      app.innerHTML = `${vraag}<div class="kaart">Het juiste antwoord: <b>${juist}</b><br>
        ${u ? `Uw antwoord: ${mijnTekst || lijst(u.waarde ?? (u.keuze != null ? LETTERS[u.keuze] : ''))} → <b>${u.punten}</b> punten` : 'U antwoordde niet.'}
        ${tot ? `<br>Samen: ${tot.punten} punten, plaats ${romeins(plaats)}` : ''}</div>`;
      return;
    }
    app.innerHTML = `${vraag}<div class="kaart">${mijn ? `Uw antwoord: <b>${mijnTekst}</b><br>Ontvangen. Wacht op de uitslag.` : 'Deze vraag is gesloten.'}</div>`;
  }
  function eindstand() {
    const rij = t.stand.map((x, i) => `<li class="${x.ridder_id === ridder ? 'ik' : ''}"><span>${romeins(1 + t.stand.filter(y => y.punten > x.punten).length)}</span><span>${esc(naam(x.ridder_id))}</span><span>${x.punten}</span></li>`).join('');
    app.innerHTML = `<p class="groot">De eindstand</p><ol class="stand">${rij}</ol><p class="stil">De punten staan ook in de tussenstand, onder Quiz.</p>`;
  }
  function tijdbalk() {
    const b = $('#balk'); if (!b || t.fase !== 'open') return;
    b.style.width = Math.max(0, 100 - (t.verstreken || 0) / 30 * 100) + '%';
  }
  async function zend(keuze, tekst, knop) {
    if (bezig) return; bezig = true;
    app.querySelectorAll('button, input').forEach(x => x.disabled = true); knop?.classList.add('gekozen');
    try {
      const ok = await Db.quizAntwoord(ridder, keuze, tekst);
      if (ok) bewaarAntwoord({ keuze, tekst });
      else { $('#fout').textContent = t.soort === 'getal' ? 'Dat is geen getal, of de vraag is al dicht.' : 'Te laat: de vraag is al dicht (of u antwoordde al).'; bezig = false; await ververs(); return; }
    } catch (e) { $('#fout').textContent = 'Niet verstuurd: ' + e.message; app.querySelectorAll('button, input').forEach(x => x.disabled = false); bezig = false; return; }
    bezig = false; await ververs(); teken(true);
  }

  /* ---------- volgen: de quiz elke 1,5 s, de namen elke 15 s ---------- */
  async function ververs() {
    try { t = await Db.quizToestand(); if (t.verstreken != null) t.verstreken = Math.max(0, t.verstreken); } catch (e) { /* volgende keer */ }
    if (!bezig) teken();
  }
  async function namen() { try { stand = await Db.stand(); toonWie(); } catch {} teken(); }
  namen(); setInterval(namen, 15000);
  ververs(); setInterval(ververs, 1500);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { namen(); ververs(); } });
  </script>
</body>
</html>
