<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Tussenstand · Oudejaar in Bohemen</title>
  <script>
    // Terug van Spotify op een gsm die via de QR-code koppelt (state "gsm.…"): meteen naar de lichte gsm-pagina,
    // voor de rest van het tv-scherm laadt. (Spotify kent alleen /feestje-tv als Redirect URI.)
    if (/[?&]state=gsm\./.test(location.search)) location.replace('/feestje-spotify' + location.search);
  </script>
  <!--
    Het scherm voor de dag zelf, voor op de tv (Chromecast).
    Vast canvas van 1920 × 1080 dat zich schaalt naar elk scherm. Bewust zuinig voor een Chromecast:
    geen SVG-filters, geen blend-modes, geen doorlopende animaties. Texturen (hout, barstjes, perkament,
    sleet op de letters) zijn vooraf berekend: feestje-img/tv/klok.py en textuur.py.
    Testen op een ander tijdstip: het knopje rechtsonder, of /feestje-tv?nu=2026-12-31T20:15
  -->
  <style>
    @font-face { font-family: "Maximilian"; src: url(feestje-fonts/maximilian.ttf) format("truetype"); font-display: block; }
    @font-face { font-family: "Grenze"; src: url(feestje-fonts/grenze-latin.woff2) format("woff2"); font-weight: 100 900; font-display: block; }
    @font-face { font-family: "Grenze"; src: url(feestje-fonts/grenze-latin-ext.woff2) format("woff2"); font-weight: 100 900; unicode-range: U+0100-024F, U+1E00-1EFF; font-display: block; }
    /* Letters: Maximilian (de letter van KCD) voor koppen en grote getallen, Grenze voor de rest. Niets kleiner dan 24 px op 1080p. */
    :root { --nacht: #101c45; --rood: #7c2d1a; --rubriek: #a2302a; --goud: #e9be52; --inkt: #2a1f16; --inkt-zacht: #4a3622; --perk: #ecdcb6; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #070b1c; overflow: hidden; }
    body.stil { cursor: none; }   /* de muis verdwijnt na 3 s stilstand (zie muis()) */
    #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden;
      background: var(--nacht) url(feestje-img/tv/plafond.webp); font-family: "Grenze", Georgia, serif; color: #f1e6cf; }
    .fries { position: absolute; left: 0; width: 1920px; height: 92px; border-top: 6px solid var(--rood); border-bottom: 6px solid var(--rood); }
    .fries svg { display: block; }
    /* geschilderd op kalk: korrel en vlekken over de band (vooraf berekend, zie feestje-img/textuur) */
    .fries::after { content: ""; position: absolute; inset: 0; pointer-events: none;
      background: url(feestje-img/textuur/vlekken.webp) 0 0 / 600px 600px, url(feestje-img/textuur/korrel.webp) 0 0 / 220px 220px, url(feestje-img/tv/sleet-perk.webp) 0 0 / 256px 256px; opacity: .85; }
    #f-boven { top: 0; } #f-onder { bottom: 0; }
    .label { font-variant-caps: small-caps; letter-spacing: .1em; font-size: 26px; color: #c9a24a; }

    /* ---------- links: de klok, groot ---------- */
    #klok { position: absolute; left: 30px; top: 100px; width: 800px; height: 800px; }
    /* wat er nu gebeurt: één regel op een strook perkament */
    #nu { position: absolute; left: 40px; top: 900px; width: 780px; height: 80px; display: flex; align-items: center; gap: 18px; padding: 0 30px;
      color: var(--inkt); background: url(feestje-img/tv/strook.webp) center / 100% 100% no-repeat; filter: drop-shadow(0 8px 14px rgba(0,0,0,.5)); }
    #nu img { width: 52px; height: 52px; flex: none; }
    #nu .wat { font-variant-caps: small-caps; letter-spacing: .1em; font-size: 26px; color: var(--rubriek); flex: none; }
    #nu b { font-family: "Maximilian", serif; font-weight: 400; font-size: 40px; line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #nu .u { margin-left: auto; font-size: 32px; font-variant-numeric: oldstyle-nums; flex: none; }

    /* ---------- rechts: het perkament met tabbladen ---------- */
    #paneel { position: absolute; left: 860px; top: 112px; width: 1030px; height: 860px; padding: 48px 70px 30px; color: var(--inkt);
      background: url(feestje-img/tv/perkament.webp) -22px -22px / 1074px 904px no-repeat; filter: drop-shadow(0 18px 26px rgba(0,0,0,.6)); }
    #rand { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
    /* sleet: perkamentkleurige spikkels óver de inkt, zodat de letters niet strak en egaal zijn (vooraf berekend, kost niets) */
    .sleet::after { content: ""; position: absolute; inset: 30px; pointer-events: none; z-index: 3;
      background: url(feestje-img/tv/sleet-perk.webp) 0 0 / 256px 256px; opacity: .9; }
    #nu.sleet::after { inset: 10px 18px; }
    .kop { display: flex; justify-content: space-between; align-items: flex-end; padding-bottom: 14px; position: relative; }
    .kop h1 { font-family: "Maximilian", serif; font-weight: 400; font-size: 70px; line-height: 1; margin: 0; display: flex; align-items: flex-end; }
    .kop h1 svg { width: 96px; height: 96px; margin-right: 4px; flex: none; }
    .kop .lijn { position: absolute; left: 0; bottom: 0; width: 100%; height: 8px; overflow: visible; }
    /* de tabbladen: genummerd zoals in een register, het actieve in roodschrift */
    .tabs { display: flex; gap: 18px; margin: 0; padding: 0 0 10px; list-style: none; }
    .tabs li { font-size: 26px; white-space: nowrap; color: #7a5a30; cursor: pointer; padding-bottom: 4px; border-bottom: 3px solid transparent; }
    .tabs li span { font-variant-caps: small-caps; letter-spacing: .06em; }
    .tabs li[aria-selected=true] { color: var(--rubriek); border-bottom-color: var(--rubriek); }
    .blad { position: absolute; left: 70px; right: 70px; top: 182px; bottom: 40px; transition: opacity .5s ease; }
    .blad[hidden] { display: block; opacity: 0; pointer-events: none; }
    #status { position: absolute; right: 74px; bottom: 42px; font-size: 24px; color: var(--rubriek); }

    /* tussenstand */
    table { width: 100%; border-collapse: collapse; }
    th { font-weight: 500; font-variant-caps: small-caps; letter-spacing: .04em; font-size: 26px; color: var(--rubriek); text-align: center; padding: 2px 2px 4px; white-space: nowrap; }
    th img { width: 44px; height: 44px; display: block; margin: 0 auto; }
    th.ic { width: 56px; }
    th.n { text-align: left; }
    td { padding: 0 2px; height: 72px; font-size: 32px; text-align: center; font-variant-numeric: oldstyle-nums tabular-nums; }
    td.p { width: 60px; } td.w { width: 60px; padding: 0; } td.w svg { width: 48px; height: 58px; display: block; margin: 0 auto; }
    td.n { text-align: left; font-size: 34px; line-height: 1; max-width: 330px; padding-left: 6px; }
    td.n b, td.n small { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 400; }
    td.n small { font-size: 24px; color: var(--inkt-zacht); margin-top: 2px; }   /* "van Geboortestad" op een eigen regel */
    td.s { color: var(--inkt-zacht); }
    td.tot { width: 96px; font-family: "Maximilian", serif; font-size: 46px; }
    .plek { display: inline-grid; place-items: center; width: 54px; height: 54px; font-weight: 600; font-size: 26px; color: var(--rubriek); position: relative; }
    .plek svg { position: absolute; inset: 0; width: 54px; height: 54px; overflow: visible; }
    .plek span { position: relative; }
    tr.p1 .plek, tr.p2 .plek, tr.p3 .plek { color: var(--inkt); }
    tr.flits td { animation: flits 2.4s ease-out; }
    @keyframes flits { 0%, 30% { background: rgba(233, 190, 82, .55); } 100% { background: transparent; } }
    .leeg { text-align: center; font-size: 32px; color: var(--inkt-zacht); padding-top: 150px; line-height: 1.5; }
    .leeg b { font-family: "Maximilian", serif; font-weight: 400; font-size: 50px; color: var(--inkt); display: block; }
    .onder { position: absolute; left: 0; bottom: 0; font-size: 24px; color: #7a5a30; }

    /* getijden (het programma) */
    /* Wunderzeichen: een plaat uit het Augsburger Wunderzeichenbuch (ca. 1552) met een Nederlands bijschrift */
    .wonder { margin: 0; height: 100%; display: flex; flex-direction: column; gap: 18px; }
    .wonder img { display: block; width: 100%; height: 400px; object-fit: cover; border-radius: 2px;
      box-shadow: 0 0 0 3px #3a2810, 0 0 0 6px #c9a24a, 0 0 0 8px #3a2810, 0 10px 24px rgba(40, 24, 8, .45); transition: opacity .6s ease; }
    .wonder img.laadt { opacity: 0; }
    .wonder .nav { display: flex; justify-content: flex-end; align-items: center; gap: 14px; margin: -6px 0 -10px; }
    .wonder .blader { width: 48px; height: 44px; padding: 0; border: 0; background: none; cursor: pointer;
      font-family: "Grenze", serif; font-weight: 600; font-size: 52px; line-height: 40px; color: var(--rubriek); }
    #wonder-nr { font-size: 26px; font-weight: 700; letter-spacing: .06em; color: var(--inkt-zacht); min-width: 110px; text-align: center; }
    .wonder figcaption { display: grid; grid-template-columns: auto 1fr; gap: 4px 22px; align-items: baseline; }
    .wonder figcaption b { font-family: "Maximilian", serif; font-weight: 400; font-size: 64px; line-height: 1; color: var(--rubriek); grid-row: span 2; }
    .wonder figcaption span { font-size: 30px; line-height: 1.2; }
    .wonder figcaption small { font-size: 24px; color: var(--inkt-zacht); }
    .uur { display: grid; grid-template-columns: 104px 56px minmax(0, 1fr); gap: 0 18px; align-items: center; height: 76px; padding: 0 10px; }
    .uur .r { text-align: right; line-height: 1; }
    .uur .r b { display: block; font-weight: 700; font-size: 32px; letter-spacing: .04em; color: var(--rubriek); }   /* Romeins in Grenze: in Maximilian lijken X, I, V op E, J, D */
    .uur .r small { font-size: 24px; color: #7a5a30; font-variant-numeric: oldstyle-nums; }
    .uur img { width: 52px; height: 52px; }
    .uur .t { font-family: "Maximilian", serif; font-size: 36px; line-height: 1.05; }
    .uur .s { font-size: 24px; color: var(--inkt-zacht); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .uur.nu { background: rgba(233, 190, 82, .32); border-radius: 4px; }
    .uur.voorbij { opacity: .5; }

    /* spelen (uitleg) */
    .spelen { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 40px; }
    .spel { display: grid; grid-template-columns: 56px 1fr; gap: 2px 16px; align-content: start; }
    .spel img { width: 56px; height: 56px; grid-row: span 2; }
    .spel b { font-family: "Maximilian", serif; font-weight: 400; font-size: 34px; line-height: 1.1; }
    .spel p { margin: 0; font-size: 25px; line-height: 1.2; color: var(--inkt-zacht); }

    /* ---------- meldingen zoals in de game ("JE KREEG …") ---------- */
    #meldingen { position: absolute; right: 100px; bottom: 140px; width: 620px; display: flex; flex-direction: column; justify-content: flex-end; gap: 12px; z-index: 5; }
    .melding { display: grid; grid-template-columns: 64px 1fr; gap: 16px; align-items: center; padding: 22px 32px; color: var(--inkt);
      background: url(feestje-img/tv/briefje.webp) center / 100% 100% no-repeat; filter: drop-shadow(0 10px 16px rgba(0,0,0,.55)); animation: in .5s ease-out both; }
    .melding svg { width: 56px; height: 68px; }
    .melding b { display: block; font-variant-caps: small-caps; letter-spacing: .1em; color: var(--rubriek); font-size: 26px; font-weight: 600; }
    .melding span { font-size: 30px; line-height: 1.2; }
    .melding.weg { animation: uit .5s ease-in both; }
    .melding > img { width: 60px; height: 60px; object-fit: contain; filter: drop-shadow(0 2px 3px rgba(0,0,0,.4)); }
    .melding.muziek img { width: 64px; height: 64px; object-fit: cover; box-shadow: 0 0 0 2px #6e4a24; }
    .melding.muziek .noot { font-size: 48px; text-align: center; color: var(--rubriek); }
    .melding.muziek i { font-style: normal; font-size: 26px; color: var(--inkt-zacht); }
    @keyframes in { from { opacity: 0; transform: translateX(40px); } }
    @keyframes uit { to { opacity: 0; transform: translateX(40px); } }

    /* ---------- de hemel boven Leuven: echte sterren (altijd), en rond middernacht de nacht met de stad ---------- */
    #hemel { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; pointer-events: none; }
    #hemel .nacht { opacity: 0; transition: opacity 1.2s ease; }
    #stage.nacht #hemel .nacht { opacity: 1; }
    .fries { transition: opacity .8s ease; }
    #stage.nacht .fries, #stage.nacht #paneel, #stage.nacht #nu, #stage.nacht #wapenkunde { opacity: 0; pointer-events: none; }

    /* ---------- de laatste minuut en nieuwjaar: de klok in het midden, het aftellen in de klok ---------- */
    #klok { transition: left .9s ease, top .9s ease, width .9s ease, height .9s ease, opacity .8s ease; }
    #stage.nacht #klok { left: 580px; top: 36px; width: 760px; height: 760px; z-index: 3; }
    #stage.nieuwjaar #klok { opacity: 0; pointer-events: none; }        /* na middernacht: alleen hemel, stad en vuurwerk */
    #stage.nieuwjaar #aftel { place-items: center; padding-bottom: 120px; }
    #stage.nieuwjaar #aftel .z { font-size: 170px; }
    #aftel { position: absolute; inset: 0; display: none; place-items: end center; text-align: center; padding-bottom: 96px; z-index: 9; pointer-events: none; }
    #aftel.aan { display: grid; }
    #vuurwerk { position: absolute; inset: 0; width: 1920px; height: 1080px; }
    #aftel .tekst { position: relative; text-shadow: 0 0 24px rgba(7,11,28,.95), 0 4px 12px rgba(0,0,0,.8); }
    #aftel .z { font-family: "Maximilian", serif; font-size: 120px; line-height: 1; color: var(--goud); }
    #aftel p { font-size: 46px; margin: 8px 0 0; color: #f1e6cf; }

    /* ---------- wapenschilderen (16:00–18:00): een volledige pagina wapenkunde, de klok klein rechtsboven ---------- */
    #klok, #nu, #paneel, #wapenkunde { transition: opacity .8s ease; }
    #wapenkunde { position: absolute; left: 34px; top: 112px; width: 1852px; height: 860px; padding: 40px 70px 30px 70px; color: var(--inkt); z-index: 2;
      background: url(feestje-img/tv/perkament.webp) -40px -40px / calc(100% + 80px) calc(100% + 80px) no-repeat; filter: drop-shadow(0 18px 26px rgba(0,0,0,.6)); opacity: 0; pointer-events: none; }
    #stage.wapens #wapenkunde { opacity: 1; }
    #stage.wapens #paneel, #stage.wapens #nu { opacity: 0; pointer-events: none; }
    /* 4× zo klein (800 → 200 px), rechtsboven op het perkament; alleen het uur blijft leesbaar */
    #stage.wapens #klok { left: 1660px; top: 14px; width: 210px; height: 210px; z-index: 3; }
    #stage.wapens #klok .klein-weg { display: none; }
    #stage.wapens #k-tijd { font-size: 74px; transform: translateY(60px); }
    /* ---------- de quiz: een volledig perkament, de klok klein rechtsboven (zoals bij de wapenkunde) ---------- */
    #quizscherm { position: absolute; left: 34px; top: 112px; width: 1852px; height: 860px; padding: 44px 70px 36px; color: var(--inkt); z-index: 2;
      background: url(feestje-img/tv/perkament.webp) -40px -40px / calc(100% + 80px) calc(100% + 80px) no-repeat; filter: drop-shadow(0 18px 26px rgba(0,0,0,.6));
      opacity: 0; pointer-events: none; transition: opacity .8s ease; display: grid; grid-template-rows: auto 1fr auto; }
    #stage.quiz #quizscherm { opacity: 1; pointer-events: auto; }
    #stage.quiz #paneel, #stage.quiz #nu, #stage.quiz #wapenkunde { opacity: 0; pointer-events: none; }
    #stage.quiz #klok { left: 1660px; top: 14px; width: 210px; height: 210px; z-index: 3; }
    #stage.quiz #klok .klein-weg { display: none; }
    #stage.quiz #k-tijd { font-size: 74px; transform: translateY(60px); }
    #quizscherm h1 { font-family: "Maximilian", serif; font-weight: 400; font-size: 60px; line-height: 1; margin: 0; display: flex; align-items: flex-end; gap: 24px; position: relative; }
    #quizscherm h1 small { font-family: "Grenze", serif; font-size: 30px; font-weight: 600; color: var(--rubriek); font-variant-caps: small-caps; letter-spacing: .08em; padding-bottom: 6px; }
    .qz { display: grid; grid-template-columns: 1fr 620px; gap: 0 48px; min-height: 0; margin-top: 18px; position: relative; }
    .qz.zonder { grid-template-columns: 1fr 360px; }
    .qz .vraag { font-size: 48px; line-height: 1.15; margin: 0 0 26px; }
    .qz .keuzes { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 26px; }
    .qz .keuzes div { display: grid; grid-template-columns: 70px 1fr; gap: 18px; align-items: center; font-size: 36px; line-height: 1.1; transition: opacity .6s; }
    .qz .keuzes svg { width: 66px; height: 79px; }
    .qz .keuzes .mis { opacity: .28; }
    .qz .keuzes .goed span { color: var(--rubriek); font-weight: 600; }
    .qz .keuzes .aantal { font-size: 28px; color: var(--inkt-zacht); font-weight: 400; margin-left: 8px; }
    .qz .keuzes div { font-size: 40px; }
    .qz .vrij { font-size: 38px; color: var(--inkt-zacht); }
    .qz .vrij b { display: block; font-family: "Maximilian", serif; font-weight: 400; font-size: 120px; line-height: 1; color: var(--rubriek); margin-top: 6px; }
    .qz .rechts { display: grid; align-content: start; justify-items: center; gap: 14px; min-height: 0; }
    .qz .rechts img.plaat { display: block; max-width: 620px; max-height: 500px; object-fit: contain; box-shadow: 0 0 0 3px #3a2810, 0 0 0 6px #c9a24a, 0 0 0 8px #3a2810, 0 10px 24px rgba(40,24,8,.45); }
    .qz .rechts img.svg { box-shadow: none; max-height: 480px; }
    .qz .qr { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; font-size: 26px; color: var(--inkt-zacht); }
    .qz .qr img { width: 150px; height: 150px; }
    .qz.zonder .qr { grid-template-columns: 1fr; justify-items: center; text-align: center; }
    .qz.zonder .qr img { width: 300px; height: 300px; }
    .qz .qr b { color: var(--inkt); font-weight: 600; }
    .qz .lijst { display: grid; gap: 6px; font-size: 32px; margin-top: 10px; }
    .qz .lijst div { display: grid; grid-template-columns: 60px 1fr auto auto; gap: 18px; align-items: baseline; }
    .qz .lijst i { font-style: normal; color: var(--rubriek); font-weight: 700; }
    .qz .lijst span.w { color: var(--inkt-zacht); }
    .qz .lijst b { font-family: "Maximilian", serif; font-weight: 400; font-size: 40px; }
    .qvoet { display: grid; grid-template-columns: 1fr auto; gap: 30px; align-items: center; font-size: 30px; margin-top: 14px; }
    .qvoet .balk { height: 16px; border-radius: 8px; background: rgba(90, 60, 25, .2); overflow: hidden; }
    .qvoet .balk i { display: block; height: 100%; background: var(--rubriek); width: 100%; }
    .qvoet .balk.op i { background: #8a7a5c; }
    #wapenkunde h1 { font-family: "Maximilian", serif; font-weight: 400; font-size: 70px; line-height: 1; margin: 0; display: flex; align-items: flex-end; }
    #wapenkunde h1 svg { width: 96px; height: 96px; margin-right: 4px; }
    #wapenkunde .sub { font-size: 28px; color: var(--inkt-zacht); margin: 6px 140px 14px 0; }
    #wapenkunde .sub b { color: var(--rubriek); font-weight: 600; }
    .wk { display: grid; grid-template-columns: 1fr 1fr 1.25fr 1fr 1fr; gap: 0 34px; }
    .wk h2 { font-family: "Maximilian", serif; font-weight: 400; font-size: 38px; margin: 0 0 6px; color: var(--rubriek); }
    /* acht rijen per kolom, alle schilden even groot */
    .wr { display: grid; grid-template-columns: 54px 1fr; gap: 0 14px; align-items: center; height: 72px; }
    .wr .sch, .wr > svg { width: 54px; height: 65px; overflow: visible; }
    .wr b { font-family: "Maximilian", serif; font-weight: 400; font-size: 30px; line-height: 1; display: block; }
    .wr small { font-size: 24px; color: var(--inkt-zacht); }
    .stukken { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
    .wr.stuk { grid-template-columns: 50px 1fr; } .wr.stuk > svg { width: 50px; height: 50px; }

    /* ---------- het verborgen menu: een onzichtbare knop op het laatste blok van de onderfries ---------- */
    #test-knop { position: absolute; right: 0; bottom: 0; z-index: 20; width: 124px; height: 80px; padding: 0; border: 0; background: none;
      opacity: 0; cursor: inherit; outline: none; -webkit-tap-highlight-color: transparent; }
    #klok { cursor: inherit; -webkit-tap-highlight-color: transparent; }
    #test .pg button[aria-pressed=true] { background: #6e4a24; color: #fff3d6; }
    #test { position: absolute; right: 18px; bottom: 90px; z-index: 20; width: 540px; padding: 22px 26px; border-radius: 6px; font-size: 24px;
      background: rgba(14, 10, 6, .96); box-shadow: inset 0 0 0 2px #b98a2e, 0 14px 40px rgba(0,0,0,.6); }
    #test[hidden] { display: none; }
    #test h2 { margin: 0 0 6px; font-family: "Maximilian", serif; font-weight: 400; font-size: 36px; color: var(--goud); }
    #test .rij { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    #test a.knop { text-decoration: none; }
    #sp-qr { display: grid; grid-template-columns: 220px 1fr; gap: 16px; align-items: center; margin-top: 12px; }
    #sp-qr[hidden] { display: none; }
    #sp-qr .qrvak svg { width: 220px; height: 220px; display: block; background: #f3e6c4; }
    #sp-qr p { margin: 0; font-size: 22px; }

<script>
'use strict';
const $ = s => document.querySelector(s);
const NS = 'http://www.w3.org/2000/svg';
const svgEl = (tag, attrs, parent) => { const el = document.createElementNS(NS, tag); for (const k in attrs) el.setAttribute(k, attrs[k]); parent?.appendChild(el); return el; };
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const seeded = seed => () => (seed = (seed * 16807) % 2147483647) / 2147483647;
// de tijd van het scherm: de echte tijd, of een testtijd (?nu=… of het knopje rechtsonder)
let OFFSET = (() => { const q = new URLSearchParams(location.search).get('nu'); const t = q ? Date.parse(q) : NaN; return isNaN(t) ? 0 : t - Date.now(); })();
const now = () => new Date(Date.now() + OFFSET);

/* =========================================================
   HAND — de eigen tekenstijl: alles met de hand getrokken, zoals in een handschrift.
   Een lijn wordt in stukjes van ~18 px geknipt; elk punt wijkt een beetje loodrecht af
   (met een vast zaad, dus elke keer dezelfde lijn) en de punten worden glad verbonden.
   Inkt trek ik twee keer, iets verschoven: zoals een ganzenveer die opnieuw inkt neemt.
   ========================================================= */
const Hand = (() => {
  const f = n => n.toFixed(1);
  function lijn(pts, amp, seed, stap = 18) {
    const rnd = seeded(seed * 7919 + 17), out = [];
    for (let i = 0; i < pts.length - 1; i++) {
      const [x1, y1] = pts[i], [x2, y2] = pts[i + 1], L = Math.hypot(x2 - x1, y2 - y1) || 1, n = Math.max(1, Math.round(L / stap));
      const nx = -(y2 - y1) / L, ny = (x2 - x1) / L;
      for (let k = 0; k < n; k++) { const t = k / n, a = (rnd() - .5) * 2 * amp; out.push([x1 + (x2 - x1) * t + nx * a, y1 + (y2 - y1) * t + ny * a]); }
    }
    out.push(pts.at(-1));
    let d = `M${f(out[0][0])},${f(out[0][1])}`;
    for (let i = 1; i < out.length - 1; i++) { const [x, y] = out[i], [x2, y2] = out[i + 1]; d += ` Q${f(x)},${f(y)} ${f((x + x2) / 2)},${f((y + y2) / 2)}`; }
    return d + ` L${f(out.at(-1)[0])},${f(out.at(-1)[1])}`;
  }
  const rechthoek = (x, y, w, h, amp, seed) => lijn([[x, y], [x + w, y], [x + w, y + h], [x, y + h], [x, y + 1]], amp, seed);
  const inkt = (d, kleur, br, op = 1) => `<path d="${d}" fill="none" stroke="${kleur}" stroke-width="${br}" stroke-linecap="round" stroke-linejoin="round" opacity="${op}"/>`;
  const dubbel = (d1, d2, kleur, br) => inkt(d1, kleur, br, .9) + inkt(d2, kleur, br * .55, .45);
  function cirkel(cx, cy, r, amp, seed, n = 28) {
    const rnd = seeded(seed * 104729 + 3), pts = [];
    for (let i = 0; i < n; i++) { const a = i / n * 2 * Math.PI, rr = r + (rnd() - .5) * 2 * amp; pts.push([cx + rr * Math.cos(a), cy + rr * Math.sin(a)]); }
    let d = `M${f((pts[0][0] + pts[1][0]) / 2)},${f((pts[0][1] + pts[1][1]) / 2)}`;
    for (let i = 1; i <= n; i++) { const [x, y] = pts[i % n], [x2, y2] = pts[(i + 1) % n]; d += ` Q${f(x)},${f(y)} ${f((x + x2) / 2)},${f((y + y2) / 2)}`; }
    return d + 'Z';
  }
  // een klimopblad (drielobbig, zoals in de randen van getijdenboeken)
  const blad = (x, y, hoek, g, kleur) => `<path transform="translate(${f(x)},${f(y)}) rotate(${f(hoek)}) scale(${g})"
    d="M0,0 C-3,-2 -9,-1 -11,-6 C-12,-10 -8,-12 -6,-11 C-7,-15 -3,-19 0,-20 C3,-19 7,-15 6,-11 C8,-12 12,-10 11,-6 C9,-1 3,-2 0,0 Z"
    fill="${kleur}" stroke="#2a1f16" stroke-width="${f(.9 / g)}"/><path transform="translate(${f(x)},${f(y)}) rotate(${f(hoek)}) scale(${g})" d="M0,0 L0,-15" stroke="#f1e6cf" stroke-width="${f(.8 / g)}" opacity=".6"/>`;
  const goudstip = (x, y, r = 3.2) => `<circle cx="${f(x)}" cy="${f(y)}" r="${r}" fill="url(#bladgoud)" stroke="#6e4f12" stroke-width=".8"/>`;
  // een rank vanuit een hoek: een slingerende stengel langs de rand, met bladeren en goudstippen
  function rank(x0, y0, dx, dy, lengte, seed) {
    const rnd = seeded(seed), pts = [];
    for (let i = 0; i <= 10; i++) { const t = i / 10, golf = Math.sin(t * Math.PI * 3) * 9 * (1 - t * .5); pts.push([x0 + dx * lengte * t + -dy * golf, y0 + dy * lengte * t + dx * golf]); }
    let d = `M${f(pts[0][0])},${f(pts[0][1])}`;
    for (let i = 1; i < pts.length - 1; i++) d += ` Q${f(pts[i][0])},${f(pts[i][1])} ${f((pts[i][0] + pts[i + 1][0]) / 2)},${f((pts[i][1] + pts[i + 1][1]) / 2)}`;
    let out = inkt(d, '#2a1f16', 2.2) + inkt(d, '#4a6b3c', 1.2, .9);
    const kleuren = ['#2f4f86', '#a2302a', '#2f4f86', '#4a6b3c'];
    for (let i = 2; i < 10; i += 2) {
      const [x, y] = pts[i], kant = i % 4 ? 1 : -1, hoek = Math.atan2(dy, dx) * 180 / Math.PI + 90 * kant + (rnd() - .5) * 30;
      out += blad(x + -dy * kant * 4, y + dx * kant * 4, hoek, .85 + rnd() * .3, kleuren[(i / 2 + seed) % 4]);
      out += goudstip(x - -dy * kant * 9, y - dx * kant * 9, 2.6);
    }
    return out;
  }
  return { lijn, rechthoek, inkt, dubbel, cirkel, blad, goudstip, rank, f };
})();
const GOUD = `<defs><linearGradient id="bladgoud" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbe7a1"/><stop offset=".45" stop-color="#e2b544"/><stop offset="1" stop-color="#9a6c18"/></linearGradient></defs>`;
const romeins = n => { let o = ''; for (const [v, r] of [[1000, 'M'], [900, 'CM'], [500, 'D'], [400, 'CD'], [100, 'C'], [90, 'XC'], [50, 'L'], [40, 'XL'], [10, 'X'], [9, 'IX'], [5, 'V'], [4, 'IV'], [1, 'I']]) while (n >= v) { o += r; n -= v; } return o.toLowerCase(); };

/* ---------- de rand van het perkament: dubbele lijn in rood en blauw, ranken in de hoeken ---------- */
(() => {
  const W = 1030, H = 860, { rechthoek, dubbel, rank, goudstip } = Hand;
  let o = GOUD;
  o += dubbel(rechthoek(18, 18, W - 36, H - 36, 1.6, 1), rechthoek(19, 19.5, W - 38, H - 39, 1.6, 2), '#a2302a', 2.6);
  o += dubbel(rechthoek(27, 27, W - 54, H - 54, 1.4, 3), rechthoek(27.5, 28, W - 55, H - 56, 1.4, 4), '#2f4f86', 1.8);
  o += rank(30, 30, 0, 1, 190, 6);
  o += rank(W - 30, H - 30, -1, 0, 200, 7) + rank(W - 30, H - 30, 0, -1, 150, 8);
  o += rank(30, H - 30, 1, 0, 110, 10);
  for (const [x, y] of [[22.5, 22.5], [W - 22.5, 22.5], [22.5, H - 22.5], [W - 22.5, H - 22.5]]) o += goudstip(x, y, 6);
  $('#rand').setAttribute('viewBox', `0 0 ${W} ${H}`); $('#rand').innerHTML = o;
  $('.kop .lijn').innerHTML = Hand.dubbel(Hand.lijn([[0, 4], [890, 4]], 1.3, 11, 30), Hand.lijn([[2, 5], [888, 5.5]], 1.3, 12, 30), '#a2302a', 2.4);
})();

/* ---------- de verluchte beginletter van het tabblad: goud op blauw, met witte filigraan, in een rood kader ---------- */
function tekenInitiaal(letter) {
  const { rechthoek, inkt } = Hand;
  let o = GOUD + `<rect x="5" y="5" width="82" height="82" fill="#2f4f86"/>`;
  const krul = (x, y, sx, sy) => `<path d="M${x},${y} c${8 * sx},0 ${12 * sx},${6 * sy} ${8 * sx},${10 * sy} c${-3 * sx},${3 * sy} ${-7 * sx},${0} ${-6 * sx},${-3 * sy} c${1 * sx},${-2 * sy} ${3 * sx},${-2 * sy} ${4 * sx},0" fill="none" stroke="#f1e6cf" stroke-width="1.1" opacity=".85"/>`;
  o += krul(11, 13, 1, 1) + krul(81, 13, -1, 1) + krul(11, 79, 1, -1) + krul(81, 79, -1, -1);
  for (const [x, y] of [[46, 12], [12, 46], [80, 46], [46, 82]]) o += `<circle cx="${x}" cy="${y}" r="1.6" fill="#f1e6cf" opacity=".8"/>`;
  o += `<text x="46" y="73" text-anchor="middle" font-family="Maximilian, serif" font-size="78" fill="url(#bladgoud)" stroke="#3a2410" stroke-width="1.4" paint-order="stroke">${letter}</text>`;
  o += inkt(rechthoek(4, 4, 84, 84, 1.1, 21), '#a2302a', 3.2) + inkt(rechthoek(8.5, 8.5, 75, 75, .9, 22), '#c99a3a', 1.2, .9);
  $('#initiaal').innerHTML = o;
}

/* ---------- schalen naar het scherm ---------- */
function schaal() {
  const s = Math.min(innerWidth / 1920, innerHeight / 1080);
  $('#stage').style.transform = `translate(${(innerWidth - 1920 * s) / 2}px, ${(innerHeight - 1080 * s) / 2}px) scale(${s})`;
}
addEventListener('resize', schaal); schaal();

/* ---------- de hemel boven Leuven: de echte sterren van dit ogenblik (feestje-sterren.js), geschilderd als in Malešov:
   achtpuntig, effen, zonder gloed of rand. We kijken naar het zuiden, 120° breed, 16 px per graad (dus niet vertekend);
   de horizon ligt achter de stad. Rond middernacht: de nachtlucht en het silhouet van Leuven, zoals de steden in het
   Wunderzeichenbuch (folio 65). ---------- */
const Hemel = (() => {
  const W = 1920, HOR = 965, PX = 16;
  const ster = (x, y, r) => { let d = ''; for (let i = 0; i < 16; i++) { const rr = i % 2 ? r * .38 : r, a = i * Math.PI / 8 + .2; d += (i ? 'L' : 'M') + (x + rr * Math.sin(a)).toFixed(1) + ',' + (y - rr * Math.cos(a)).toFixed(1); } return d + 'Z'; };
  function sterren() {
    const lagen = { '#efe4c4': '', '#f6dc8e': '' };
    for (const { alt, az, mag } of sterrenBoven(now(), CONFIG.lat, CONFIG.lon)) {
      const dx = ((az - 180 + 540) % 360) - 180, x = W / 2 + dx * PX, y = HOR - alt * PX;
      if (x < -20 || x > W + 20 || y < -20) continue;
      const r = Math.max(4.5, Math.min(22, 18 - 3 * mag));
      lagen[mag < 1.2 ? '#f6dc8e' : '#efe4c4'] += ster(x, y, r);     // de helderste een tikje goud
    }
    $('#h-sterren').innerHTML = Object.entries(lagen).map(([k, d]) => `<path d="${d}" fill="${k}"/>`).join('');
  }
  /* het silhouet van Leuven, vrij naar de stad: Keizersberg op de heuvel, de Sint-Geertruitoren, het stadhuis met zijn

/* =========================================================
   HONGER EN ENERGIE — volgen het programma (LIJF in feestje-config.js), in de klok zoals in het wachtmenu
   ========================================================= */
const feestUur = t => (t - dayStart(new Date(CONFIG.start))) / 3600e3;   // uren sinds middernacht van de feestdag
function lijf(h) {
  h = Math.max(h, CONFIG.partyFrom);
  const ramp = (x, at, dur = .5) => clamp((x - at) / dur, 0, 1);
  const reken = (start, perUur, plussen) => {
    let v = start;
    for (let x = CONFIG.partyFrom; x < h; x += .25) {
      const stap = Math.min(.25, h - x);
      v += perUur * stap;
      for (const [at, , extra] of plussen) v += extra * (ramp(x + stap, at) - ramp(x, at));
      v = clamp(v, 0, 100);
    }
    return v;
  };
  return { voeding: reken(LIJF.voeding.start, LIJF.voeding.perUur, LIJF.maaltijden), energie: reken(LIJF.energie.start, LIJF.energie.perUur, LIJF.oppeppers) };
}
function toonLijf() {
  const { voeding, energie } = lijf(feestUur(now()));
  $('#k-eten').textContent = Math.round(voeding); $('#k-slaap').textContent = Math.round(energie);
  $('#k-eten').setAttribute('fill', voeding < 25 ? '#e0745a' : '#f1e6cf'); $('#k-slaap').setAttribute('fill', energie < 25 ? '#e0745a' : '#f1e6cf');
}

  if ($('#nu').innerHTML !== html) $('#nu').innerHTML = html;
}

  if (!PENNING[p]) return '';
  const [kl, rand] = PENNING[p];
  let stip = ''; for (let k = 0; k < 16; k++) { const a = k / 16 * 2 * Math.PI; stip += `<circle cx="${(27 + 20 * Math.cos(a)).toFixed(1)}" cy="${(27 + 20 * Math.sin(a)).toFixed(1)}" r="1.2" fill="${rand}" opacity=".7"/>`; }
  return `<svg viewBox="0 0 54 54" aria-hidden="true"><path d="${Hand.cirkel(27, 27, 24, 1.3, p)}" fill="${kl}" stroke="${rand}" stroke-width="2"/>${stip}</svg>`;
};

function tekenStand(flits = new Set()) {
  if (!stand) return;
  const rows = ranglijst(stand), spelen = stand.spelen, n = Math.max(1, Math.ceil(rows.length / PER_PAGINA));
  pagina %= n;
  const box = $('#blad-stand');
  if (!rows.length) { box.innerHTML = `<div class="leeg"><b>Nog geen ridders ingeschreven</b>De heraut noteert de deelnemers bij de poort.</div>`; return; }
  const deel = rows.slice(pagina * PER_PAGINA, (pagina + 1) * PER_PAGINA);
  box.innerHTML = `<table><thead><tr><th></th><th></th><th class="n">Ridder</th>${spelen.map(s => kop(s.naam)).join('')}<th>Totaal</th></tr></thead><tbody>${
    deel.map((r, i) => `<tr class="p${r.plaats}${flits.has(r.id) ? ' flits' : ''}" style="background:${REGELS[i % REGELS.length]}"><td class="p"><span class="plek">${penning(r.plaats)}<span>${romeins(r.plaats)}</span></span></td><td class="w">${wapen(r.wapen, 'r' + r.id)}</td><td class="n">${naamHtml(r.naam)}</td>${
      spelen.map(s => { const v = r.per(s.id); return `<td class="s">${v == null ? '·' : v}</td>`; }).join('')}<td class="tot">${r.totaal}</td></tr>`).join('')}</tbody></table>
    <div class="onder">${n > 1 ? `blad ${romeins(pagina + 1)} van ${romeins(n)} · ` : ''}${rows.length} ridders in het strijdperk</div>`;
}
function nieuweStand(s) {
  const flits = new Set(), tot = new Map(ranglijst(s).map(r => [r.id, r.totaal]));
  if (vorigeTotalen) {
    const oud = new Map(stand.punten.map(p => [p.ridder_id + ':' + p.spel_id, p.punten]));
    for (const p of s.punten) {
      const d = p.punten - (oud.get(p.ridder_id + ':' + p.spel_id) ?? 0);
      if (!d) continue;
      const r = s.ridders.find(x => x.id === p.ridder_id), sp = s.spelen.find(x => x.id === p.spel_id);
      if (!r || !sp) continue;
      flits.add(r.id);
      if (sp.naam === 'Quiz') continue;          // de quizpunten staan al op het quizscherm: geen stortvloed aan meldingen
      melding(d > 0 ? 'Je kreeg' : 'Je verloor', `${d > 0 ? '+' : '−'}${Math.abs(d)} · ${esc(sp.naam)}<br>${esc(r.naam)}`, r.wapen, 'm' + r.id + Date.now());
    }
    for (const r of s.ridders) if (!vorigeTotalen.has(r.id)) melding('Nieuwe ridder', esc(r.naam), r.wapen, 'n' + r.id);
  }
  stand = s; vorigeTotalen = tot;
  if (flits.size) {   // nieuwe punten: toon de tussenstand, op het blad met de wijziging
    const i = ranglijst(s).findIndex(r => flits.has(r.id)); if (i >= 0) pagina = Math.floor(i / PER_PAGINA);
    if (TABS[tab].id !== 'stand' && !handmatig) kiesTab(tabNr('stand'), true);
  }
  tekenStand(flits);
}
function melding(kop, tekst, w, uid, { icoon = null, ms = 6000, soort = '' } = {}) {

  const box = $('#meldingen'); box.appendChild(el);
  while (box.children.length > 3) box.firstChild.remove();
  setTimeout(() => { el.classList.add('weg'); setTimeout(() => el.remove(), 500); }, ms);
}

/* ---------- aankondigingen volgens het programma, zoals de meldingen in het spel ----------
   [uur, kop, tekst, icoon]. Elke aankondiging verschijnt één keer, alleen als haar tijdstip net voorbij is
   (niet een hele rij tegelijk na herladen of na het verzetten van de testtijd). */
const AANKONDIGINGEN = (() => {
  const A = [];
  for (const [h, naam, , ic] of CONFIG.program) {
    if (h === 24) continue;                                         // middernacht heeft zijn eigen aftelling en vuurwerk
    if (h !== 18) A.push([h - 1 / 6, 'Nog tien minuten', h === CONFIG.program[0][0] ? 'en de poort gaat open' : `tot ${esc(naam)}`, ic]);   // om 17:50 gaat het over de wapens
    A.push([h, h === CONFIG.program[0][0] ? 'De poort is open' : 'Het is zover', esc(naam), ic]);
  }
  A.push([17 + 50 / 60, 'Nog tien minuten', 'om uw wapenschild af te maken', 'schild']);
  A.push([18 - 1e-4, 'De tijd is om', 'Penselen neer! De wapens worden gekeurd.', 'schild']);
  A.push([23 + 50 / 60, 'Nog tien minuten', 'tot middernacht. Vul de bekers.', 'ster']);
  return A.sort((a, b) => a[0] - b[0]);
})();
const gemeld = new Set();
let vorigUur = null;
function aankondigen() {
  const t = now(), h = feestUur(t);
  if (vorigUur != null && h > vorigUur && h - vorigUur < 90 / 3600)   // de tijd liep gewoon door (geen sprong)
    for (const [u, kop, tekst, ic] of AANKONDIGINGEN) if (u > vorigUur && u <= h && !gemeld.has(u + kop)) {
      gemeld.add(u + kop); melding(kop, tekst, null, '', { icoon: ic, ms: 12000, soort: 'oproep' });
    }
  vorigUur = h;
}

(function testtijd() {
  const knop = $('#test-knop'), paneel = $('#test');
  const lokaal = d => new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 19);
  const toon = () => { const t = now(); $('#test-nu').textContent = `${t.getDate()}/${t.getMonth() + 1} ${fmtH(localHours(t))}:${String(t.getSeconds()).padStart(2, '0')}`; $('#test-in').value = lokaal(t); };
  function zet(t) {
    OFFSET = t == null ? 0 : t - Date.now();
    const u = new URL(location); OFFSET ? u.searchParams.set('nu', lokaal(now())) : u.searchParams.delete('nu'); history.replaceState(null, '', u);
    Klok.opnieuw(); Hemel.opnieuw(); elkeMinuut(); aftellen(); toon();
  }
  knop.addEventListener('click', () => { paneel.hidden = !paneel.hidden; knop.setAttribute('aria-expanded', !paneel.hidden); toon(); knop.blur(); });
  paneel.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.d) zet(new Date(now().getTime() + +b.dataset.d * 60000));
    else if (b.dataset.t) zet(new Date(b.dataset.t));
    else if (b.id === 'test-echt') zet(null);
    else if (b.dataset.p != null) {
      const p = b.dataset.p;
      if (!p) naarHoofdpagina(true);
      else if (p === 'wapens') { handmatig = true; keuze = 'wapens'; wapenModus(); }
      else { handmatig = true; keuze = 'hoofd'; kiesTab(tabNr(p)); wapenModus(); }
      pgStaat();
    }
  });
  const pgStaat = () => paneel.querySelectorAll('.pg button').forEach(b => b.setAttribute('aria-pressed',
    !handmatig ? b.dataset.p === '' : keuze === 'wapens' ? b.dataset.p === 'wapens' : b.dataset.p === TABS[tab].id));
  knop.addEventListener('click', pgStaat); $('#klok').addEventListener('click', pgStaat);
  const spStaat = () => {
    const a = $('#sp-koppel'), aan = Spotify.gekoppeld();
    $('#sp-staat').textContent = !Spotify.aan ? 'nog geen Client ID in feestje-config.js' : aan ? 'gekoppeld ✓' : Spotify.inlog() ? 'niet gekoppeld' : 'even geduld…';
    a.textContent = aan ? 'Spotify ontkoppelen' : 'Inloggen op de tv';
    a.href = !aan && Spotify.inlog() ? Spotify.inlog() : '#';
  };
  $('#sp-gsm').addEventListener('click', () => {
    if (!Spotify.aan) { $('#sp-staat').textContent = 'nog geen Client ID in feestje-config.js'; return; }
    const url = Spotify.viaGsm(ok => {
      $('#sp-qr-staat').textContent = ok ? 'Gekoppeld ✓' : 'Verlopen. Druk opnieuw op de knop.';
      if (ok) { setTimeout(() => { $('#sp-qr').hidden = true; }, 2500); melding('Spotify', 'gekoppeld', null, '', { icoon: 'herberg', ms: 5000 }); }
      spStaat();
    });
    const qr = qrcode(0, 'M'); qr.addData(url); qr.make();
    $('#sp-qr .qrvak').innerHTML = qr.createSvgTag({ cellSize: 6, margin: 2, scalable: true });
    $('#sp-qr-staat').textContent = 'Wachten op je gsm…'; $('#sp-qr').hidden = false;
  });
  $('#sp-koppel').addEventListener('click', async e => {
    if (Spotify.gekoppeld()) { e.preventDefault(); Spotify.ontkoppel(); await Spotify.bereid(); spStaat(); }
    else if (!Spotify.inlog()) e.preventDefault();          // geen Client ID of nog niet klaar: niets doen (geen alert, die blokkeert TV Bro)
  });
  knop.addEventListener('click', spStaat);
  $('#test-in').addEventListener('change', e => { const t = new Date(e.target.value); if (!isNaN(t)) zet(t); });
  setInterval(() => { if (!paneel.hidden) toon(); }, 1000);
})();

/* =========================================================
   SPOTIFY — "Nu speelt" bij elk nieuw nummer. De muziek zelf speelt via de Spotify-app (Spotify Connect);
   dit scherm vraagt alleen om de 5 s wat er speelt. Inloggen: OAuth "Authorization Code met PKCE"
   (geen server, geen geheime sleutel). Tokens blijven alleen op dit toestel (localStorage).
   ========================================================= */
const Spotify = (() => {
  const ID = (typeof SPOTIFY !== 'undefined' && SPOTIFY.clientId) || '';
  const TERUG = location.origin + '/feestje-tv';          // exact zo invullen als Redirect URI bij Spotify
  const SLEUTEL = 'feestje.spotify';
  const lees = () => { try { return JSON.parse(localStorage.getItem(SLEUTEL)) || null; } catch { return null; } };
  const schrijf = v => { try { v ? localStorage.setItem(SLEUTEL, JSON.stringify(v)) : localStorage.removeItem(SLEUTEL); } catch {} };
  const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  /* De inloglink wordt vooraf klaargezet (PKCE-sleutel + hash), zodat de knop een gewone link is. Een doorverwijzing ná een
     await of een alert() telt in strenge browsers (TV Bro) als pop-up en wordt geblokkeerd; een aangeklikte link nooit. */
  let inlog = '';
  async function bereid() {
    if (!ID || !crypto.subtle) return '';
    const verifier = b64url(crypto.getRandomValues(new Uint8Array(48)));
    const challenge = b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)));

  }
  async function token(body) {
    const r = await fetch('https://accounts.spotify.com/api/token', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({ client_id: ID, ...body }) });
    const j = await r.json();
    if (!r.ok) throw Object.assign(new Error(j.error_description || j.error || r.status), { code: j.error });
    const oud = lees() || {};

    schrijf(t); return t;
  }
  async function geldig() {

      catch (e) { if (e.code === 'invalid_grant') schrijf(null); return null; }   // na 6 maanden: opnieuw koppelen
    }
    return t;
  }

  async function kijk() {
    const t = await geldig(); if (!t) return;
    try {
      const r = await fetch('https://api.spotify.com/v1/me/player/currently-playing', { headers: { Authorization: 'Bearer ' + t.access } });
      if (r.status === 401) { schrijf({ ...t, tot: 0 }); return; }
      if (r.status !== 200) return;                       // 204: er speelt niets
      const j = await r.json(), it = j.item;
      if (!it || !j.is_playing || it.id === vorige) return;
      vorige = it.id;
      const hoes = (it.album?.images || []).slice(-1)[0]?.url || '';
      nuSpeelt(it.name, (it.artists || []).map(a => a.name).join(', '), hoes);
    } catch { /* geen verbinding: volgende keer opnieuw */ }
  }
  async function start() {
    if (!ID) return;
    const q = new URLSearchParams(location.search);
    if (q.get('code')) {                                   // terug van Spotify na het inloggen
      let v = ''; try { v = localStorage.getItem('feestje.spotify.v') || ''; } catch {}
      try { await token({ grant_type: 'authorization_code', code: q.get('code'), redirect_uri: TERUG, code_verifier: v }); }
      catch (e) { console.warn('Spotify-koppeling mislukt', e); }

  }
  // koppelen via de gsm: de tv toont een QR-code met een geheime code; de gsm logt in en zet de refresh-token

  let koppelId = null, koppelTot = 0, koppelTimer = null;
  function viaGsm(klaar) {
    koppelId = [...crypto.getRandomValues(new Uint8Array(16))].map(b => b.toString(16).padStart(2, '0')).join('');
    koppelTot = Date.now() + 10 * 60e3; clearInterval(koppelTimer);
    koppelTimer = setInterval(async () => {
      if (Date.now() > koppelTot) { clearInterval(koppelTimer); klaar(false); return; }
      try {
        const r = await Db.spotifyHaal(koppelId);
        if (r) { clearInterval(koppelTimer); schrijf({ access: '', refresh: r, tot: 0 }); vorige = null; await kijk(); klaar(true); }
      } catch { /* volgende keer */ }
    }, 2500);

  }
  return { start, bereid, inlog: () => inlog, gekoppeld: () => !!lees(), ontkoppel: () => schrijf(null), aan: !!ID, viaGsm };

function nuSpeelt(titel, artiest, hoes) {

/* =========================================================
   VUURWERK — om middernacht, vier minuten lang, in middeleeuwse stijl:
   pijlen die openspatten in achtpuntige sterren (goud, keel, azuur, zilver), de grote komeet van 1401 en een zwerm
   van zo'n veertig draken, allebei uitgeknipt uit het Augsburger Wunderzeichenbuch (folio 65 en 127).
   Eén canvas; de sterretjes worden één keer voorgetekend en daarna alleen nog gekopieerd (licht voor een Chromecast).
   ========================================================= */
const Vuurwerk = (() => {
  const cv = $('#vuurwerk'), g = cv.getContext('2d'), W = 1920, H = 1080;
  const KLEUR = ['#f3c84a', '#f7dc8a', '#d8463a', '#5f86d6', '#f2eee4', '#e9a23b'];
  const ster = (kleur, r) => {                               // achtpuntige ster zoals in Malešov: effen verf, geen gloed, geen rand
    const c = document.createElement('canvas'), n = Math.ceil(r * 2 + 4); c.width = c.height = n; const x = c.getContext('2d'), m = n / 2;
    x.beginPath(); for (let i = 0; i < 16; i++) { const rr = i % 2 ? r * .38 : r, a = i * Math.PI / 8; x.lineTo(m + rr * Math.sin(a), m - rr * Math.cos(a)); } x.closePath();
    x.fillStyle = kleur; x.fill();

  };
  const STERREN = KLEUR.map(k => [ster(k, 10), ster(k, 15)]);
  let deeltjes = [], pijlen = [], kometen = [], draken = [], vlam = [], loopt = false, raf = null, vorige = 0, volgendePijl = 0, volgendeKomeet = 0, volgendeDraak = 0;
  const rnd = (a, b) => a + Math.random() * (b - a);

  function pijl() { pijlen.push({ x: rnd(260, W - 260), y: H, vy: rnd(-760, -620), vx: rnd(-60, 60), k: (Math.random() * KLEUR.length) | 0, hoog: rnd(180, 520) }); }
  function spat(x, y, k) {
    const n = 46 + (Math.random() * 24 | 0), ring = Math.random() < .35;
    for (let i = 0; i < n; i++) {
      const a = i / n * 2 * Math.PI + rnd(-.05, .05), v = ring ? 300 : rnd(80, 340);
      deeltjes.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, t: 0, duur: rnd(1.6, 2.6), k: Math.random() < .25 ? (Math.random() * KLEUR.length) | 0 : k, groot: Math.random() < .3, rot: rnd(0, 6) });
    }
  }
  const laad = n => { const i = new Image(); i.src = `feestje-img/wonder/${n}.webp`; return i; };

  /* De komeet van 1401 (folio 65): groot en traag, de kop vooraan, de pauwenstaart schuin omhoog erachter.
     kop = waar in het knipsel de kern zit. Eén tegelijk; zodra hij weg is, komt de volgende. */
  const KOMEET = { img: laad('komeet-1401'), kop: [75, 150], schaal: 1.45 };
  /* speed lines over de staart (zoals in anime): korte, dunne strepen die in een flits van de kop naar achteren schieten
     en meteen weer verdwijnen. In de coördinaten van het knipsel: kop links, staart rechts omhoog. */
  const STREEPKLEUR = ['#fff6dc', '#f6e3a8', '#efc77a', '#e6a24e', '#ffffff'];
  const nieuweStreep = (leeftijd = 0) => {
    const doelY = rnd(20, 280), dx = 690 - 75, dy = doelY - 150, l = Math.hypot(dx, dy);

  };
  function komeet() { kometen.push({ x: W + 60, y: rnd(150, 300), vx: -55, vy: 7, strepen: Array.from({ length: 70 }, () => nieuweStreep(-rnd(0, .4))) }); }

      st.r += st.v * dt;
      if (st.t > st.duur || st.r > st.max) { Object.assign(st, nieuweStreep(-rnd(0, .15))); continue; }
      const f = st.t / st.duur, a = f < .2 ? f / .2 : (1 - f) / .8;       // flits: snel aan, uitdoven

  /* De draken van folio 127 ("vliegende draken boven Bohemen", 1533). kop: aan welke kant van het knipsel de kop zit,
     zodat elke draak met de kop vooruit vliegt. Een zwerm van ~40, zoals op de plaat de meeste naar links. */
  const GROOT = [['groot1', 'L', [3, 158]], ['groot2', 'L', [2, 222]]].map(([n, kop, bek]) => ({ img: laad('draak-' + n), kop, bek, groot: true }));
  const KLEIN = [['klein1', 'L'], ['klein3', 'L'], ['klein6', 'L'], ['klein7', 'L'], ['klein4', 'R'], ['klein5', 'R'], ['klein8', 'R'],
    ['klein9', 'R'], ['klein10', 'R'], ['klein11', 'R']].map(([n, kop]) => ({ img: laad('draak-' + n), kop }));
  const ZWERM = 40;
  function draak(voorsprong = 0) {
    const groot = Math.random() < .12 && draken.filter(d => d.groot).length < 3;
    const soort = groot ? GROOT[(Math.random() * GROOT.length) | 0] : KLEIN[(Math.random() * KLEIN.length) | 0];
    const richting = Math.random() < .72 ? -1 : 1, schaal = groot ? rnd(.55, .85) : rnd(.45, 1);
    const rand = 300 * schaal + voorsprong;                          // net buiten beeld (of verder, om de zwerm te spreiden)
    const d = { ...soort, x: richting < 0 ? W + rand : -rand, y: rnd(110, H - 120), richting, schaal,
      v: groot ? rnd(90, 130) : rnd(110, 190), t: 0, fase: rnd(0, 6), vuur: -rnd(.3, 2) };
    const i = draken.findIndex(x => x.schaal > schaal); i < 0 ? draken.push(d) : draken.splice(i, 0, d);   // kleine (verre) eerst tekenen
  }
  function tekenDraak(d) {
    if (!d.img.complete || !d.img.naturalWidth) return;
    const spiegel = (d.kop === 'L' ? -1 : 1) * d.richting;          // kop vooruit
    g.save(); g.translate(d.x, d.y); g.rotate(Math.cos(d.t * 1.1 + d.fase) * .035 * d.richting); g.scale(spiegel * d.schaal, d.schaal);
    g.drawImage(d.img, -d.img.width / 2, -d.img.height / 2); g.restore();
  }
  function stap(nu) {
    const dt = Math.min(.05, (nu - vorige) / 1000 || .016); vorige = nu;
    g.clearRect(0, 0, W, H);
    const tijd = nu / 1000;
    if (tijd > volgendePijl) { pijl(); if (Math.random() < .4) pijl(); volgendePijl = tijd + rnd(.35, .9); }
    if (!kometen.length && tijd > volgendeKomeet) { komeet(); volgendeKomeet = tijd + 4; }
    if (!volgendeDraak) { for (let i = 0; i < ZWERM; i++) draak(rnd(0, 2200)); volgendeDraak = 1; }   // de zwerm komt binnen
    else while (draken.length < ZWERM) draak(rnd(0, 150));
    // de komeet van 1401, achter al de rest
    kometen = kometen.filter(k => {
      k.x += k.vx * dt; k.y += k.vy * dt;
      const { img, kop, schaal } = KOMEET; if (!img.naturalWidth) return true;
      g.drawImage(img, k.x - kop[0] * schaal, k.y - kop[1] * schaal, img.width * schaal, img.height * schaal);
      strepen(k, dt);
      return k.x + (img.width - kop[0]) * schaal > 0;
    });
    // pijlen met een spoor van vonkjes
    pijlen = pijlen.filter(p => {
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 260 * dt;
      g.drawImage(STERREN[p.k][0], p.x - STERREN[p.k][0].width / 2, p.y - STERREN[p.k][0].height / 2);
      if (Math.random() < .7) deeltjes.push({ x: p.x, y: p.y + 6, vx: rnd(-20, 20), vy: rnd(20, 60), t: 0, duur: .5, k: 5, groot: false, rot: 0, klein: true });
      if (p.y < p.hoog || p.vy > -80) { spat(p.x, p.y, p.k); return false; } return true;
    });
    // draken die vuur spuwen
    draken = draken.filter(d => {
      d.t += dt; d.x += d.richting * d.v * dt; d.y += Math.sin(d.t * 1.1 + d.fase) * 14 * dt;   // zweven, geen vleugelslag
      if (d.groot) {
        d.vuur -= dt; if (d.vuur < -2.2) d.vuur = 1;          // stoten vuur uit de bek
        if (d.vuur > 0 && d.img.naturalWidth) for (let i = 0; i < 2; i++) {
          const mx = d.x + d.richting * d.schaal * (d.img.width / 2 - d.bek[0]), my = d.y + d.schaal * (d.bek[1] - d.img.height / 2);
          vlam.push({ x: mx, y: my, vx: d.richting * rnd(260, 420) * d.schaal / .8, vy: rnd(-30, 70), t: 0, duur: rnd(.5, .85) });
        }
      }
      tekenDraak(d);
      return d.richting > 0 ? d.x < W + 400 : d.x > -400;
    });
    vlam = vlam.filter(v => {
      v.t += dt; v.x += v.vx * dt; v.y += v.vy * dt; v.vx *= .97; v.vy -= 30 * dt;
      const a = v.t / v.duur; if (a >= 1) return false;
      g.fillStyle = a < .3 ? '#fbe7a1' : a < .6 ? '#f0a12c' : '#c0433a'; g.globalAlpha = 1 - a;
      g.beginPath(); g.arc(v.x, v.y, 6 + a * 18, 0, 7); g.fill(); g.globalAlpha = 1;
      return true;
    });
    // de sterretjes van de spatten
    deeltjes = deeltjes.filter(d => {
      d.t += dt; d.x += d.vx * dt; d.y += d.vy * dt; d.vx *= .985; d.vy = d.vy * .985 + 70 * dt;
      const a = d.t / d.duur; if (a >= 1) return false;
      g.globalAlpha = a < .7 ? 1 : (1 - a) / .3;
      const sp = STERREN[d.k][d.groot ? 1 : 0], m = sp.width / 2 * (d.klein ? .5 : 1);
      g.drawImage(sp, d.x - m, d.y - m, m * 2, m * 2); g.globalAlpha = 1;
      return true;
    });
    if (loopt) raf = requestAnimationFrame(stap);
  }
  return {
    start() { if (loopt) return; loopt = true; vorige = performance.now(); volgendePijl = volgendeKomeet = volgendeDraak = 0; raf = requestAnimationFrame(stap); },
    stop() { if (!loopt) return; loopt = false; cancelAnimationFrame(raf); deeltjes = []; pijlen = []; kometen = []; draken = []; vlam = []; g.clearRect(0, 0, W, H); },
  };
})();

/* ---------- de hartslag ---------- */
function tik() { Klok.render(); aftellen(); wapenModus(); aankondigen(); }
function elkeMinuut() { nuStrook(); toonLijf(); if (TABS[tab].id === 'getijden') tekenGetijden(); }
kiesTab(rotatie()[0], true);
Spotify.start();
QuizTV.start();
document.fonts.ready.then(() => { Klok.opnieuw(); elkeMinuut(); });
tik(); elkeMinuut();
setTimeout(() => { tik(); setInterval(tik, 1000); }, 1000 - (now().getTime() % 1000) + 5);   // gelijk met de seconde
setInterval(elkeMinuut, 30000);
// het scherm wakker houden (Wake Lock API), zodat de schermbeveiliging van de Chromecast niet over de stand valt
async function wakker() { try { await navigator.wakeLock?.request('screen'); } catch { /* niet ondersteund of geweigerd */ } }
document.addEventListener('visibilitychange', () => { if (!document.hidden) wakker(); });
wakker();
// een tv die dagen aanstaat: één keer per dag (om 6 uur 's ochtends) herladen tegen geheugenlekken
setTimeout(() => location.reload(), (() => { const t = new Date(), r = new Date(t); r.setHours(30, 0, 0, 0); return r - t; })());
</script>
