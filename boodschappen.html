        if (offOk) { o.allergens.forEach(a => hit.add(a)); (o.traces || []).forEach(a => trace.add(a)); }
      }
      return { hit: [...hit], trace: [...trace].filter(a => !hit.has(a)), unknown };
    }
    const kindOf = r => r.kind === 'week' ? 'week' : 'recept';
    // Schaalfactor van een recept op een lijstje; setjes schalen niet.
    const factorOf = (r, lr) => kindOf(r) === 'week' ? 1 : lr.persons / r.persons;
    const keyOf = g => g.name.trim().toLowerCase() + '|' + g.unit;
    // Eén regel per (naam, eenheid): "ui" uit drie recepten wordt "3 stuk". Dat is de hele
    // meerwaarde van afleiden i.p.v. kopiëren. stock = álle bijdragende recepten zeggen "in huis" en
    // je hebt het niet op "toch kopen" gezet (l.buy).
    function rowsFor(l) {
      const map = new Map();
      for (const lr of l.recipes) {
        const r = recipeById(lr.rid); if (!r) continue;
        const f = factorOf(r, lr);
        for (const g of r.ingredients) {
          const name = g.name.trim(); if (!name) continue;
          const key = keyOf(g);
          let row = map.get(key);
          if (!row) { row = { key, name, unit: g.unit, qty: 0, cat: g.cat, src: [], recipe: true, done: !!l.done[key], canStock: true, gs: [], emoji: g.emoji || emojiFor(name, g.cat) }; map.set(key, row); }
          row.qty += (Number(g.qty) || 0) * f;
          if (!g.stock) row.canStock = false;
          row.gs.push(g);
          if (!row.src.includes(r)) row.src.push(r);
        }
      }
      const rows = [...map.values()].map(r => ({ ...r, qtyText: fmtQty(r.qty, r.unit), stock: r.canStock && !(l.buy || {})[r.key], allergy: allergyOf(r.gs) }));
      for (const it of l.items) rows.push({ key: 'm:' + it.id, id: it.id, name: it.name, qtyText: it.qty, cat: it.cat, src: [], recipe: false, done: it.done, stock: !!it.stock, emoji: it.emoji || emojiFor(it.name, it.cat), allergy: allergyOf([{ name: it.name }]) });
      return rows;
    }
    // Wat er van één recept op dit lijstje staat, met de hoeveelheid van DAT recept; done/stock komen
    // uit de gedeelde regel zodat afvinken in beide weergaven hetzelfde is.
    function recipePartsFor(r, lr, rowMap) {
      const f = factorOf(r, lr), out = new Map();
      for (const g of r.ingredients) {
        if (!g.name.trim()) continue;
        const key = keyOf(g), p = out.get(key) || { key, qty: 0, unit: g.unit };
        p.qty += (Number(g.qty) || 0) * f; out.set(key, p);
      }
      return [...out.values()].map(p => ({ ...rowMap.get(p.key), qtyText: fmtQty(p.qty, p.unit) }));
    }
    // "In huis" telt niet mee voor voortgang: je hoeft het niet te halen.
    const progressOf = rows => { const rs = rows.filter(r => !r.stock); return { d: rs.filter(r => r.done).length, t: rs.length }; };
    const progressText = p => !p.t ? '✓ alles in huis' : p.d === p.t ? '✓ alles binnen' : `${p.d}/${p.t} binnen`;

    /* ---------- voeding (Open Food Facts) ---------- */
    // Gram van één ingrediënt-regel, of null als we het niet kunnen weten (stuk zonder gewicht).
    // ml ≈ g: goed genoeg voor schattingen (olie 0,92 wordt via gpu 14 g/el opgevangen).
    function gramsOf(g) {
      const q = Number(g.qty) || 0;
      switch (g.unit) {
        case 'g': return q; case 'kg': return q * 1000; case 'ml': return q; case 'l': return q * 1000;
        case 'el': return q * (g.gpu || 15); case 'tl': return q * (g.gpu || 5);
        default: { const gpu = g.gpu || ingInfo(g.name)?.gram; return gpu ? q * gpu : null; } // eigen gewicht wint, anders de lijst
      }
    }
    // Voedingsstoffen (sleutels = die van de ingrediëntenlijst). ADVISE = wat het advies toetst.
    const NUTS = [['kcal', 'Energie', 'kcal'], ['eiwit', 'Eiwit', 'g'], ['vet', 'Vet', 'g'], ['kh', 'Koolhydraten', 'g'], ['vezels', 'Vezels', 'g'],
      ['ijzer', 'IJzer', 'mg'], ['calcium', 'Calcium', 'mg'], ['zink', 'Zink', 'mg'], ['omega3', 'Omega-3', 'g'], ['jodium', 'Jodium', 'µg'], ['b12', 'B12', 'µg'], ['vitd', 'Vitamine D', 'µg']];
    const NUT = Object.fromEntries(NUTS.map(([k, label, unit]) => [k, { label, unit }]));
    const ADVISE = ['eiwit', 'vezels', 'ijzer', 'calcium', 'zink', 'omega3', 'jodium', 'b12', 'vitd'];
    // Waarden per 100 g: uit de ingrediëntenlijst; een gekoppeld merkproduct (Open Food Facts) wint voor de macro's.
    function per100(g) {
      const base = ingInfo(g.name)?.nut, o = g.off;
      if (!base && !o) return null;
      const v = { ...(base || {}) };
      if (o) Object.assign(v, { kcal: o.kcal, eiwit: o.p, vet: o.f, kh: o.c, vezels: o.fib });
      return v;
    }
    // Per portie (= totaal / het eigen aantal personen van het recept, dus los van het lijstje).
    function nutri(r) {
      const per = Object.fromEntries(NUTS.map(([k]) => [k, 0])), t = { per, counted: 0, total: 0, missing: [] };
      for (const g of r.ingredients) {
        if (!g.name.trim()) continue;
        t.total++;
        const gr = gramsOf(g), v = per100(g);
        if (gr === null || !v) { t.missing.push(g.name.trim()); continue; }
        const k = gr / 100 / r.persons;
        for (const [n] of NUTS) per[n] += (v[n] || 0) * k;
        t.counted++;
      }
      t.kcal = per.kcal;
      return t;
    }

    /* ---------- voedingsadvies ----------
       Dagbehoefte per eter (afgerond, in de lijn van de Gezondheidsraad). Eiwit in g per kg lichaamsgewicht; bij
       een vegan dieet 10% hoger omdat plantaardig eiwit iets minder goed wordt opgenomen. Een warme maaltijd
       (een recept) hoort ~35% van de dag te leveren. Tweetallen = [man, vrouw]; 'x' = het gemiddelde. */
    const NEED = [
      { tot: 3,   kcal: [1100, 1050], kg: [12, 12], epk: 1.0,  vezels: [15, 15], ijzer: [7, 7],   calcium: [600, 600],   zink: [5, 5],  omega3: [0.7, 0.7], jodium: 50,  b12: 0.8, vitd: 10 },
      { tot: 8,   kcal: [1600, 1500], kg: [22, 22], epk: 0.9,  vezels: [20, 20], ijzer: [7, 7],   calcium: [700, 700],   zink: [6, 6],  omega3: [1.0, 1.0], jodium: 90,  b12: 1.5, vitd: 10 },
      { tot: 13,  kcal: [2200, 2000], kg: [38, 38], epk: 0.9,  vezels: [25, 25], ijzer: [10, 11], calcium: [1100, 1100], zink: [9, 9],  omega3: [1.5, 1.4], jodium: 120, b12: 2.0, vitd: 10 },
      { tot: 17,  kcal: [2900, 2300], kg: [60, 55], epk: 0.9,  vezels: [30, 30], ijzer: [11, 15], calcium: [1150, 1150], zink: [11, 7], omega3: [2.0, 1.6], jodium: 150, b12: 3.5, vitd: 10 },
      { tot: 50,  kcal: [2600, 2100], kg: [75, 65], epk: 0.83, vezels: [40, 30], ijzer: [11, 16], calcium: [1000, 1000], zink: [11, 7], omega3: [2.9, 2.3], jodium: 150, b12: 4.0, vitd: 10 },
      { tot: 69,  kcal: [2500, 2000], kg: [75, 65], epk: 0.83, vezels: [40, 30], ijzer: [11, 11], calcium: [1100, 1100], zink: [11, 7], omega3: [2.8, 2.2], jodium: 150, b12: 4.0, vitd: 10 },
      { tot: 200, kcal: [2300, 1900], kg: [72, 62], epk: 1.0,  vezels: [40, 30], ijzer: [11, 11], calcium: [1200, 1200], zink: [11, 7], omega3: [2.5, 2.1], jodium: 150, b12: 4.0, vitd: 20 },
    ];
    const MEAL_SHARE = 0.35;
    const DIETS = [['vegan', 'Vegan'], ['vegetarisch', 'Vegetarisch'], ['alles', 'Alles']];
    const diet = () => S.diet || 'vegan'; // Han's lijstjes zijn vegan; dat is ook de standaard
    // Wat een dieet uitsluit, uitgedrukt in allergenen uit de lijst (eieren, melk, vis…): zo hoeft de lijst niet ook nog 'vlees: ja/nee' te dragen.
    const DIET_EXCLUDES = { vegan: ['eggs', 'milk', 'fish', 'crustaceans', 'molluscs'], vegetarisch: ['fish', 'crustaceans', 'molluscs'], alles: [] };
    // Activiteit: factor op energie en op eiwit per kg (sporters/zwaar werk hebben duidelijk meer eiwit nodig).
    const ACTS = [['laag', 'Weinig actief'], ['gemiddeld', 'Gemiddeld actief'], ['actief', 'Actief'], ['zeer', 'Zeer actief (sport, zwaar werk)']];
    const ACT_KCAL = { laag: 0.85, gemiddeld: 1, actief: 1.15, zeer: 1.3 }, ACT_EIWIT = { laag: 1, gemiddeld: 1, actief: 1.3, zeer: 1.6 };
    function needOf(e) {
      const age = +e.leeftijd || 40, row = NEED.find(n => age <= n.tot) || NEED[NEED.length - 1];
      const pick = x => !Array.isArray(x) ? x : e.geslacht === 'v' ? x[1] : e.geslacht === 'm' ? x[0] : (x[0] + x[1]) / 2;
      const kg = +e.gewicht || pick(row.kg), act = e.activiteit || 'gemiddeld', vegan = (e.dieet || diet()) === 'vegan';
      const n = { kcal: pick(row.kcal) * ACT_KCAL[act], eiwit: row.epk * ACT_EIWIT[act] * (vegan ? 1.1 : 1) * kg, vezels: pick(row.vezels), ijzer: pick(row.ijzer),
        calcium: pick(row.calcium), zink: pick(row.zink), omega3: pick(row.omega3), jodium: row.jodium, b12: row.b12, vitd: row.vitd };
      // zwanger (2e/3e trimester, afgerond): meer energie, eiwit, ijzer, jodium en B12
      if (e.zwanger && e.geslacht !== 'm') Object.assign(n, { kcal: n.kcal + 300, eiwit: n.eiwit + 10, ijzer: Math.max(n.ijzer, 16), jodium: 200, b12: 4.5, calcium: Math.max(n.calcium, 1000) });
      return n;
    }
    const GUEST = { leeftijd: 40, geslacht: 'x' }; // een gast zonder gegevens telt als gemiddelde volwassene
    // Profiel achter een chip: huisgenoot uit S.eaters, of de gast zelf (gast-gegevens staan op het lijstje).
    const profileOf = w => w.eid ? personOf(w) : { ...GUEST, ...w };
    const peopleFor = (l, lr) => { const ws = (l.who || []).filter(w => !w.off && !(lr?.off || []).includes(w.id)); return ws.length ? ws.map(profileOf).filter(Boolean) : eaters(); };
    // Wat de mensen aan tafel niet (willen) eten: EU-allergenen, vrije-tekst-allergieën, dieet en 'lust geen'.
    const splitTerms = s => String(s || '').split(/[,;/]+/).map(norm).filter(Boolean);
    const termHits = (name, t) => { const n = norm(name); return n === t || n.includes(t) || (n.length > 3 && t.includes(n)); }; // 'paprika' raakt ook 'paprikapoeder'
    function constraintsOf(people) {
      const c = { alg: new Map(), words: [], diet: new Map(), dislike: [] };
      const add = (m, k, v) => m.set(k, [...(m.get(k) || []), v]);
      for (const p of people) {
        const who = p.naam || 'gast', d = p.dieet || diet();
        (p.allergenen || []).forEach(a => add(c.alg, a, who));
        DIET_EXCLUDES[d].forEach(a => add(c.diet, a, `${who}: ${d}`));
        splitTerms(p.allergie).forEach(t => c.words.push({ t, who }));
        splitTerms(p.lustNiet).forEach(t => c.dislike.push({ t, who }));
      }
      return c;
    }
    let CONS = null; // de beperkingen van wie op het open lijstje meeeet; gezet in viewList
    // Meldingen per ingrediënt: allergie rood met naam, dieet rood, 'lust geen' rustig grijs (Han).
    function personTags(r) {
      if (!CONS) return '';
      const algs = new Set([...(ingInfo(r.name)?.allergens || []), ...(r.allergy?.hit || [])]), out = [];
      for (const [a, who] of CONS.alg) if (algs.has(a)) out.push(`<span class="tag warn">LET OP: ${ALG_NAME[a].toUpperCase()} (${esc(who.join(', '))})</span>`);
      for (const { t, who } of CONS.words) if (termHits(r.name, t)) out.push(`<span class="tag warn">LET OP: ${esc(t.toUpperCase())} (${esc(who)})</span>`);
      for (const [a, who] of CONS.diet) if (algs.has(a)) out.push(`<span class="tag warn">niet ${esc(who.map(x => x.split(': ')[1]).filter((x, i, l) => l.indexOf(x) === i).join('/'))} (${esc(who.map(x => x.split(':')[0]).join(', '))})</span>`);
      for (const { t, who } of CONS.dislike) if (termHits(r.name, t)) out.push(`<span class="tag unk">${esc(who)} lust geen ${esc(t)}</span>`);
      return out.join('');
    }
    const eaters = () => S.eaters?.length ? S.eaters : [{ naam: 'volwassene', leeftijd: 40, geslacht: 'x' }];
    function mealTarget(people) {
      people = people || eaters();
      const es = people, t = {};
      for (const k of ['kcal', ...ADVISE]) t[k] = es.reduce((a, e) => a + needOf(e)[k], 0) / es.length * MEAL_SHARE;
      return t;
    }
    const SUGGEST_CATS = new Set(['Groente & fruit', 'Aardappelen, pasta & rijst', 'Houdbaar', 'Zuivelvervangers']);
    // Hoeveel je redelijkerwijs per persoon aan één maaltijd toevoegt: een handje noten/zaden, wat droge granen of
    // peulvruchten, of een flinke schep groente/tofu.
    const maxAdd = v => (v.vet || 0) > 40 || (v.kcal || 0) > 400 ? 20 : (v.kcal || 0) > 300 ? 60 : 120; // zaden/noten: een eetlepel of handje
    function adviceFor(r, people) {
      const ps = people || eaters(), n = nutri(r), tgt = mealTarget(ps);
      const avoid = [...(S.avoid || []), ...ps.flatMap(p => [...(p.allergenen || []), ...DIET_EXCLUDES[p.dieet || diet()]])];
      const terms = ps.flatMap(p => [...splitTerms(p.allergie), ...splitTerms(p.lustNiet)]);
      const pct = Object.fromEntries(ADVISE.map(k => [k, tgt[k] ? n.per[k] / tgt[k] : 1]));
      // B12, vitamine D en jodium los je niet op met een ingrediënt in een recept: die krijgen een advies, geen tip.
      const low = ADVISE.filter(k => pct[k] < 0.6 && !['b12', 'vitd', 'jodium'].includes(k)).sort((a, b) => pct[a] - pct[b]);
      const have = new Set(r.ingredients.map(g => norm(g.name))), seen = new Set(), cands = [];
      for (const info of DB.values()) {
        if (seen.has(info)) continue; seen.add(info);
        if (!info.nut || info.noTip || !SUGGEST_CATS.has(info.cat) || have.has(norm(info.naam))) continue;
        if (info.allergens.some(a => avoid.includes(a)) || terms.some(t => termHits(info.naam, t))) continue; // nooit iets wat iemand aan tafel vermijdt, niet past of niet lust
        cands.push(info);
      }
      const tips = [];
      for (const k of low.slice(0, 2)) {
        const gap = tgt[k] - n.per[k]; let best = null;
        for (const info of cands) {
          if (tips.some(t => t.info === info)) continue;
          const v = info.nut, per1 = (v[k] || 0) / 100; if (per1 <= 0) continue;
          const g = Math.min(maxAdd(v), gap / per1);
          // dekking van dit tekort + bonus als het ook andere tekorten helpt − kleine straf voor veel extra kcal
          const extra = low.filter(x => x !== k).reduce((a, x) => a + Math.min(1, g * (v[x] || 0) / 100 / Math.max(1e-9, tgt[x] - n.per[x])), 0);
          const score = g * per1 / gap + 0.5 * extra - 0.3 * g * (v.kcal || 0) / 100 / tgt.kcal;
          if (!best || score > best.score) best = { info, g, score, k };
        }
        if (best) tips.push(best);
      }
      for (const t of tips) {
        t.grams = t.g >= 10 ? Math.round(t.g / 5) * 5 : Math.max(1, Math.round(t.g));
        // alleen winst die ertoe doet (≥ 10% van wat een maaltijd moet leveren), grootste eerst, hooguit drie
        t.gains = low.map(x => [x, t.grams * (t.info.nut[x] || 0) / 100]).filter(([x, v]) => v / tgt[x] >= 0.1)
          .sort((a, b) => b[1] / tgt[b[0]] - a[1] / tgt[a[0]]).slice(0, 3);
      }
      const notes = [];
      if (pct.b12 < 0.6) notes.push('B12 zit vrijwel niet in plantaardig eten: gebruik verrijkte producten (sojadrink, sojayoghurt) of een supplement.');
      if (pct.vitd < 0.6) notes.push('Vitamine D krijg je nauwelijks uit eten: het advies is een supplement (10 µg per dag), zeker van oktober tot maart.');
      if (pct.jodium < 0.6) notes.push('Jodium komt vooral uit brood met bakkerszout en uit jodiumzout; zeewier kan, met mate.');
      return { n, tgt, pct, low, tips, notes };
    }
    const pctCls = p => p >= 0.8 ? 'ok' : p >= 0.6 ? 'mid' : 'low';
    const fmtN = x => x >= 10 ? String(Math.round(x)) : fmt1(x);
    const tipHtml = r => t => `<div class="tip"><span>💡 + ${t.grams} g ${esc(t.info.naam)} p.p. → ${t.gains.map(([k, v]) => `+${fmtN(v)} ${NUT[k].unit} ${NUT[k].label.toLowerCase()}`).join(', ')}</span>
      <button class="btn small" data-act="addTip" data-rid="${r.id}" data-name="${esc(t.info.naam)}" data-g="${t.grams}">+ toevoegen</button></div>`;
    // Compact, in een opengeklapt recept op het lijstje: de stoffen die je per maaltijd kunt sturen + de tips.
    function adviceMini(r, people) {
      const a = adviceFor(r, people); if (!a.n.counted) return '';
      const show = ['eiwit', 'vezels', 'ijzer', 'calcium', 'zink', 'omega3'];
      return `<div class="adv"><div class="muted">Per portie ≈ ${Math.round(a.n.per.kcal)} kcal · eiwit ${fmtN(a.n.per.eiwit)} g. Van een warme maaltijd:</div>
        <div class="nchips">${show.map(k => `<span class="nchip ${pctCls(a.pct[k])}">${NUT[k].label} ${Math.round(a.pct[k] * 100)}%</span>`).join('')}</div>
        ${a.tips.map(tipHtml(r)).join('')}</div>`;
    }
    const fmt1 = n => String(Math.round(n * 10) / 10).replace('.', ',');
    async function offSearch(q) {
      const url = 'https://world.openfoodfacts.org/cgi/search.pl?' + new URLSearchParams({ search_terms: q, search_simple: 1, action: 'process', json: 1, page_size: 12, fields: 'product_name,brands,nutriments,allergens_tags,traces_tags', lc: 'nl' });
      const res = await fetch(url); if (!res.ok) throw new Error('HTTP ' + res.status);
      const d = await res.json();
      return (d.products || []).map(p => {
        const n = p.nutriments || {}, kcal = n['energy-kcal_100g'];
        if (kcal == null || !p.product_name) return null;
        return { label: [p.product_name, p.brands].filter(Boolean).join(' — '), kcal: +kcal, p: +n.proteins_100g || 0, f: +n.fat_100g || 0, c: +n.carbohydrates_100g || 0, fib: +n.fiber_100g || 0, allergens: mapTags(p.allergens_tags), traces: mapTags(p.traces_tags) };
      }).filter(Boolean);
    }

    function grouped(rows, hideDone) {
      const order = S.categories;
      const by = new Map();
      for (const r of rows) {
        if (hideDone && r.done) continue;
        const c = order.includes(r.cat) ? r.cat : 'Overig';
        if (!by.has(c)) by.set(c, []);
        by.get(c).push(r);
      }
      // Niet-afgevinkt eerst, daarna alfabetisch: wat nog moet staat altijd bovenaan elke categorie.
      for (const arr of by.values()) arr.sort((a, b) => (a.done - b.done) || a.name.localeCompare(b.name, 'nl'));
      return order.filter(c => by.has(c)).map(c => [c, by.get(c)]);
    }
    // Onthoud de categorie van eerder gebruikte namen, zodat "melk" de tweede keer vanzelf goed staat.
    function guessCat(name) {
      const n = name.trim().toLowerCase(); if (!n) return null;
      const info = ingInfo(n); if (info?.cat) return info.cat;
      for (const l of S.lists) for (const it of l.items) if (it.name.toLowerCase() === n) return it.cat;
      for (const r of S.recipes) for (const g of r.ingredients) if (g.name.toLowerCase() === n) return g.cat;
      return null;
    }

    /* ---------- weergave ---------- */
    const catOptions = sel => S.categories.map(c => `<option${c === sel ? ' selected' : ''}>${esc(c)}</option>`).join('')
      + '<option value="__new">+ Nieuwe categorie…</option>';
    const unitOptions = sel => UNITS.map(u => `<option value="${u}"${u === sel ? ' selected' : ''}>${u || '—'}</option>`).join('');
    const stepper = (act, id, n, label) => `<span class="stepper"><button data-act="${act}" data-id="${id}" data-d="-1" aria-label="Minder">−</button><span>${n} ${label}</span><button data-act="${act}" data-id="${id}" data-d="1" aria-label="Meer">+</button></span>`;
    const tabs = on => `<nav class="tabs"><a href="#/" class="${on === 'l' ? 'on' : ''}">Lijstjes</a><a href="#/recepten" class="${on === 'r' ? 'on' : ''}">Recepten</a></nav>`;

    function viewLists() {
      const cards = S.lists.map(l => {
        const p = progressOf(rowsFor(l));
        return `<a href="#/lijst/${l.id}" class="card listcard"><b>${esc(l.name)}</b><div class="muted">${l.persons} personen · ${p.d}/${p.t} binnen</div></a>`;
      }).join('') || '<div class="empty">Nog geen lijstjes.</div>';
      return `<div class="top"><h1>Boodschappen</h1></div>${tabs('l')}${cards}
        <button class="btn primary" data-act="newList">+ Nieuw lijstje</button>
        <div class="rub" style="margin:22px 2px 8px"><span>Wie eten er mee</span></div>
        <div class="field"><label>Standaarddieet (voor wie niets anders heeft)</label><select data-diet>${DIETS.map(([k, t]) => `<option value="${k}"${diet() === k ? ' selected' : ''}>${t}</option>`).join('')}</select></div>
        ${(S.eaters || []).map((e, i) => `<button class="card listcard" data-act="eater" data-i="${i}"><b>${esc(e.naam || 'Persoon')}${personMarks(e)}</b><div class="muted">${esc(personLine(e))}</div></button>`).join('')
          || '<div class="muted" style="margin-bottom:8px">Nog niemand ingesteld: het voedingsadvies rekent nu met één volwassene.</div>'}
        <button class="btn" data-act="eater">+ Persoon</button>
        <footer class="bk"><span class="muted">Back-up (data staat alleen in deze browser):</span>
          <button class="btn small" data-act="export">Exporteer</button>
          <button class="btn small" data-act="import">Importeer</button>
          <input type="file" id="importFile" accept="application/json" hidden></footer>`;
    }

    function algTags(r) {
      const av = S.avoid || []; if (!av.length) return '';
      const h = r.allergy.hit.filter(a => av.includes(a) && !CONS?.alg.has(a)), t = r.allergy.trace.filter(a => av.includes(a)); // persoonlijke melding wint (met naam)
      return h.map(a => `<span class="tag warn">LET OP: ${ALG_NAME[a].toUpperCase()}</span>`).join('') + t.map(a => `<span class="tag trace">sporen ${ALG_NAME[a].toLowerCase()}</span>`).join('')
        + (r.allergy.unknown ? '<span class="tag unk" title="Onbekend ingrediënt: allergenen niet gecontroleerd. Voeg het toe aan boodschappen-ingredienten.json.">?</span>' : '');
    }
    // Het filterblok (onderaan de lijst): kiezen + per allergeen welke ingrediënten het bevatten.
    function algPanel(rows) {
      const av = S.avoid || [];
      const per = av.map(a => [a, rows.filter(r => r.allergy.hit.includes(a))]).filter(([, rs]) => rs.length);
      const hitRows = rows.filter(r => r.allergy.hit.some(a => av.includes(a)));
      const traceRows = rows.filter(r => !hitRows.includes(r) && r.allergy.trace.some(a => av.includes(a)));
      const unk = rows.filter(r => r.allergy.unknown);
      const status = av.length ? `${per.map(([a, rs]) => `<div class="warnline">⚠ LET OP: ${ALG_NAME[a].toUpperCase()} — ${rs.map(r => esc(r.name)).join(', ')}</div>`).join('') || '<div class="muted">Niets gevonden bij de bekende ingrediënten.</div>'}
        ${traceRows.length ? `<div class="muted">Sporen mogelijk: ${traceRows.map(r => esc(r.name)).join(', ')}</div>` : ''}
        ${unk.length ? `<div class="muted">? ${unk.length} onbekend (niet in de ingrediëntenlijst): ${unk.slice(0, 12).map(r => esc(r.name)).join(', ')}${unk.length > 12 ? '…' : ''}</div>` : ''}` : '';
      const sum = av.length ? `: ${av.map(a => ALG_NAME[a].toLowerCase()).join(', ')}${hitRows.length ? ` · <b style="color:#b42318">⚠ ${hitRows.length}</b>` : ''}${unk.length ? ` · ? ${unk.length}` : ''}` : '';
      return `<details class="card alg"${S.ui?.algOpen ? ' open' : ''}><summary>Allergenen vermijden${sum}</summary>
        <div class="achips">${ALLERGENS.map(([id, nl]) => `<label class="achip${av.includes(id) ? ' on' : ''}"><input type="checkbox" data-avoid="${id}"${av.includes(id) ? ' checked' : ''} /> ${nl}</label>`).join('')}</div>
        ${status}
        <div class="muted">Algemene inschatting uit de ingrediëntenlijst, aangevuld met gekoppelde producten. Jouw merk kan afwijken: check bij een echte allergie altijd het etiket.</div></details>`;
    }
    // Eén regel: vinkje · emoji naam [in huis] [LET OP: …] · hoeveelheid. Tags staan achter de naam (Han: scheelt hoogte).
    // rid: als de regel in een open recept staat, opent een tik het bewerken van DAT recept-ingrediënt.
    function itemHtml(r, rid) {
      const stk = r.stock ? `<button class="tag stk" data-act="unstock" data-key="${esc(r.key)}">in huis</button>`
        : (r.canStock ? `<button class="tag stk" data-act="restock" data-key="${esc(r.key)}">toch kopen</button>` : '');
      const name = `<span class="em" aria-hidden="true">${r.emoji}</span>${esc(r.name)}`;
      return `<div class="item${r.done ? ' done' : ''}${r.stock ? ' stock' : ''}${S.ui?.sel === 'k:' + r.key ? ' sel' : ''}" data-key="${esc(r.key)}">
        <button class="check" data-act="toggle" data-key="${esc(r.key)}" aria-label="Afvinken: ${esc(r.name)}" aria-pressed="${r.done}"><span>${r.done ? '✓' : ''}</span></button>
        <div class="txt grow">${r.recipe && rid ? `<button class="nm2" data-act="editIng" data-rid="${rid}" data-key="${esc(r.key)}">${name}</button>` : r.recipe ? `<span class="nm2" data-act="selIng" data-key="${esc(r.key)}">${name}</span>` : `<button class="nm2" data-act="editItem" data-id="${r.id}">${name}</button>`}${stk}${algTags(r)}${personTags(r)}</div>
        <span class="qty">${esc(r.qtyText)}</span>
      </div>`;
    }
    const byName = (a, b) => (a.done - b.done) || a.name.localeCompare(b.name, 'nl');

    function algChip(r) {
      const av = S.avoid || []; if (!av.length) return '';
      const a = allergyOf(r.ingredients.filter(g => g.name.trim())), h = a.hit.filter(x => av.includes(x));
      return (h.length ? ` · <b style="color:#b42318">⚠ LET OP: ${h.map(x => ALG_NAME[x].toUpperCase()).join(', ')}</b>` : '') + (a.unknown ? ' · ? onbekend' : '');
    }
    // Kleuren: rechts per blok (recept/setje), links per categorie. Lijnen krijgen de kleur van het blok aan de
    // DICHTE kant, dus per recept als de categorieën open staan en per categorie als de recepten open staan.
    const REC_COLORS = ['#7b5ea7', '#2f7f9e', '#c2603a', '#4f8a4c', '#b0487a', '#8a7a2e', '#3a7ca5', '#a0522d'];
    const CAT_COLORS = ['#4f8a4c', '#b8862b', '#c2603a', '#2f7f9e', '#7b8aa0', '#8a6d3b', '#b0487a', '#3a7ca5', '#9b59b6', '#7f8c8d'];
    const OV_COLOR = '#8a8f98', LINE_GREY = '#a8a49b';
    const catColor = c => CAT_COLORS[Math.max(0, S.categories.indexOf(c)) % CAT_COLORS.length];
    const RUBS = [['recept', 'Recepten'], ['week', 'Weekboodschappen'], ['ov', 'Overige']];
    // De blokken rechts, vaste volgorde: recepten, setjes, Overige (= de losse items van dit lijstje).
    function rightBlocks(l, rows, rowMap) {
      const out = [];
      for (const [k] of RUBS.slice(0, 2)) for (const lr of l.recipes) {
        const r = recipeById(lr.rid); if (!r || kindOf(r) !== k) continue;
        out.push({ key: 'rec:' + r.id, id: r.id, kind: k, name: r.name, r, lr, parts: recipePartsFor(r, lr, rowMap) });
      }
      out.forEach((b, i) => b.color = REC_COLORS[i % REC_COLORS.length]);
      out.push({ key: 'rec:_ov', id: '_ov', kind: 'ov', name: 'Overige', parts: rows.filter(x => !x.recipe), color: OV_COLOR });
      return out;
    }
    const ptext = parts => parts.length ? progressText(progressOf(parts)) : 'leeg';
    // kort, voor de smalle blokken: "2/5" of "✓"
    const pshort = parts => { if (!parts.length) return 'leeg'; const p = progressOf(parts); return !p.t || p.d === p.t ? '✓' : `${p.d}/${p.t}`; };
    const addForm = t => S.ui?.adding === t ? `<form class="inl" data-t="${esc(t)}" autocomplete="off"><input name="line" placeholder="bv. 300 g pompoen" aria-label="Toevoegen" enterkeyhint="done" /><button class="btn small primary" aria-label="Toevoegen">+</button></form>` : '';

    // Het bord: categorieën | recepten. Eén kant open (l.view 'rec' → rechts), daarbinnen één blok open
    // (S.ui.open.cat / .rec). Elk blok draagt data-b ('cat:<naam>' / 'rec:<id>') en data-color voor de lijntjes.
    function personFields(e) {
      const sel = (id, opts, v) => `<select id="${id}">${opts.map(([k, t]) => `<option value="${k}"${v === k ? ' selected' : ''}>${t}</option>`).join('')}</select>`;
      const algs = e.allergenen || [];
      return `<div class="field"><label>Naam</label><input id="p-naam" value="${esc(e.naam || '')}" /></div>
        <div class="row"><div class="field grow"><label>Geslacht</label>${sel('p-sex', [['m', 'man'], ['v', 'vrouw'], ['x', 'zeg ik liever niet']], e.geslacht || 'x')}</div>
          <div class="field" style="width:78px"><label>Leeftijd</label><input id="p-age" type="number" min="1" max="110" inputmode="numeric" value="${e.leeftijd || 40}" /></div>
          <div class="field" style="width:78px"><label>Kg</label><input id="p-kg" type="number" min="5" max="250" inputmode="decimal" value="${e.gewicht || ''}" /></div></div>
        <div class="row"><div class="field grow"><label>Activiteit</label>${sel('p-act', ACTS, e.activiteit || 'gemiddeld')}</div>
          <div class="field grow"><label>Dieet</label>${sel('p-diet', DIETS, e.dieet || diet())}</div></div>
        <div class="field"><label class="row" style="color:var(--text);font-size:.95rem"><input type="checkbox" id="p-preg"${e.zwanger ? ' checked' : ''} /> Zwanger</label></div>
        <div class="field"><label>Allergieën</label><div class="achips">${ALLERGENS.map(([id, nl]) => `<label class="achip${algs.includes(id) ? ' on' : ''}"><input type="checkbox" data-palg="${id}"${algs.includes(id) ? ' checked' : ''} /> ${nl}</label>`).join('')}</div>
          <input id="p-alg" value="${esc(e.allergie || '')}" placeholder="andere, bv. paprika" /></div>
        <div class="field"><label>Lust geen</label><input id="p-dis" value="${esc(e.lustNiet || '')}" placeholder="bv. champignons, koriander" /></div>`;
    }
    function readPerson(d, base) {
      const n = { ...base, naam: d.querySelector('#p-naam').value.trim(), geslacht: d.querySelector('#p-sex').value,
        leeftijd: Math.max(1, Math.min(110, +d.querySelector('#p-age').value || 40)), activiteit: d.querySelector('#p-act').value, dieet: d.querySelector('#p-diet').value,
        zwanger: d.querySelector('#p-preg').checked, allergenen: [...d.querySelectorAll('[data-palg]:checked')].map(x => x.dataset.palg),
        allergie: d.querySelector('#p-alg').value.trim(), lustNiet: d.querySelector('#p-dis').value.trim() };
      const kg = parseFloat(d.querySelector('#p-kg').value); if (kg > 0) n.gewicht = kg; else delete n.gewicht;
      return n;
    }
    const personMarks = p => (p?.zwanger ? ' 🤰' : '') + (p?.allergenen?.length || p?.allergie ? ' ⚠️' : '');
    const personLine = e => [e.leeftijd + ' jaar', ({ m: 'man', v: 'vrouw' })[e.geslacht], e.gewicht && e.gewicht + ' kg', (ACTS.find(a => a[0] === (e.activiteit || 'gemiddeld')) || [])[1]?.toLowerCase(),
      e.dieet || diet(), e.zwanger && 'zwanger', (e.allergenen?.length || e.allergie) && 'allergie: ' + [...(e.allergenen || []).map(a => ALG_NAME[a].toLowerCase()), e.allergie].filter(Boolean).join(', '),
      e.lustNiet && 'lust geen: ' + e.lustNiet].filter(Boolean).join(' · ');
    function whoChips(l, lr) {
      const ws = (l.who || []).filter(w => !lr || !w.off); // in een recept alleen wie op het lijstje aan staat
      const chip = w => { const off = lr ? (lr.off || []).includes(w.id) : w.off;
        return `<button class="pchip${off ? ' off' : ''}${w.eid ? '' : ' guest'}" data-act="who" data-w="${w.id}"${lr ? ` data-rid="${lr.rid}"` : ''}>${esc(whoName(w))}${personMarks(profileOf(w))}</button>`; };
      return `<span class="who">${ws.map(chip).join('')}${lr ? '' : '<button class="pchip add" data-act="addGuest">+ gast</button>'}</span>`;
    }
    // "+" onder het laatste ingrediënt (Han): knop, of de invoerregel als die open staat.
    const addRow = (t, label) => S.ui?.adding === t ? addForm(t) : `<button class="addrow" data-act="plus" data-t="${esc(t)}">+ ${label}</button>`;

    // Het bord. Eén kant open (l.view 'rec' → rechts), daarbinnen één blok open (S.ui.open.cat / .rec). Elk blok draagt
    // data-b ('cat:<naam>' / 'rec:<id>') en data-color; dezelfde data-b aan beide kanten maakt het omklappen mogelijk.
    function boardHtml(l, rows, rowMap) {
      const rec = l.view === 'rec', u = S.ui || {}, sel = u.sel, open = u.open || {};
      // Smal blok: emoji rechtop bovenaan (Han: "in één oogopslag duidelijk"), naam + voortgang gedraaid eronder.
      const vblock = (key, color, emoji, name, sub, label) => `<button class="card vblock ${key.startsWith('cat:') ? 'ocat' : 'orec'}${sel === 'b:' + key ? ' sel' : ''}" data-b="${esc(key)}" data-color="${color}" data-act="side" style="--cc:${color};--rc:${color}" aria-label="${esc(label)}"><span class="vemo" aria-hidden="true">${emoji}</span><span class="vt${key.startsWith('cat:') ? ' rev' : ''}"><span>${name}</span><span class="muted">${sub}</span></span></button>`;
      const blk = (key, color, cls, emoji, name, sub, body, isOpen) => `<div class="card oblk ${cls}${isOpen ? ' open' : ''}${sel === 'b:' + key ? ' sel' : ''}" data-b="${esc(key)}" data-color="${color}" style="--cc:${color};--rc:${color}">
          <div class="ohead" data-act="acc" role="button" aria-expanded="${isOpen}"><span class="hemo" aria-hidden="true">${emoji}</span><span>${name}<span class="muted osub">${sub}</span></span></div>
          <div class="obody"${isOpen ? '' : ' hidden'}>${body}</div></div>`;
      const grp = (title, inner, labelLeft) => labelLeft
        ? `<div class="vgrp"><div class="vrub"><span class="vt rev">${title}</span></div><div class="vcol">${inner}</div></div>`
        : `<div class="vgrp"><div class="vcol">${inner}</div><div class="vrub"><span class="vt">${title}</span></div></div>`;
      const cats = grouped(rows, rec ? false : l.hideDone);
      const left = rec
        ? grp('Ingrediënten', cats.map(([c, arr]) => vblock('cat:' + c, catColor(c), CAT_EMOJI[c] || '🛒', esc(c), pshort(arr), 'Categorieën openen bij ' + c)).join(''), true)
        : '<div class="rub"><span>Ingrediënten</span></div>' + cats.map(([c, arr]) => {
          const done = progressOf(arr);
          return blk('cat:' + c, catColor(c), 'ocat', CAT_EMOJI[c] || '🛒', esc(c), `<span class="${done.t && done.d === done.t ? 'badge' : ''}">${progressText(done)}</span>`,
            arr.map(x => itemHtml(x)).join('') + addRow('c:' + c, 'Toevoegen'), open.cat === c);
        }).join('');
      const blocks = rightBlocks(l, rows, rowMap);
      const right = RUBS.map(([k, title]) => {
        const bs = blocks.filter(b => b.kind === k), what = k === 'week' ? 'Setje' : 'Recept';
        const emo = b => b.kind === 'ov' ? '🛒' : recipeEmoji(b.r);
        // Smalle kant: label NAAST de groep (scheelt hoogte), aan de buitenkant zodat lijnen er niet doorheen lopen.
        if (!rec) return grp(title, bs.map(b => vblock(b.key, b.color, emo(b), esc(b.name), pshort(b.parts), b.name + ' openen')).join('')
          + (k === 'ov' ? '' : `<button class="vblock vadd vplus" data-act="addRecipe" data-kind="${k}" aria-label="${what} toevoegen">+</button>`), false);
        return `<div class="rub"><span>${title}</span>${k === 'ov' ? '' : `<button class="plus" data-act="addRecipe" data-kind="${k}" aria-label="${what} toevoegen">+</button>`}</div>`
          + bs.map(b => {
            const p = progressOf(b.parts), t = b.kind === 'ov' ? 'o' : 'r:' + b.id, isOpen = open.rec === b.id;
            const shown = b.parts.filter(x => !(l.hideDone && x.done)).sort(byName);
            let sub = '', ctl = '';
            if (b.kind === 'recept') {
              const n = nutri(b.r); sub = (n.counted ? ` · ≈ ${Math.round(n.kcal)} kcal · eiwit ${fmtN(n.per.eiwit)} g p.p.` : '') + algChip(b.r)
                + (b.parts.some(x => personTags(x).includes('tag warn')) ? ' · <b style="color:#b42318">⚠ let op</b>' : '');
              ctl = `${whoChips(l, b.lr)}<button class="btn icon" data-act="rdel" data-id="${b.id}" aria-label="Van lijstje halen">×</button>`;
            } else if (b.kind === 'week') ctl = `<span class="muted grow">vast setje</span><button class="btn icon" data-act="rdel" data-id="${b.id}" aria-label="Van lijstje halen">×</button>`;
            // volgorde in een open recept (Han): wie eet mee · ingrediënten · + toevoegen · voedingsadvies · receptpagina
            const body = (ctl ? `<div class="row rctl">${ctl}</div>` : '') + shown.map(x => itemHtml(x, b.kind === 'ov' ? null : b.id)).join('')
              + addRow(t, b.kind === 'ov' ? 'Toevoegen' : 'Ingrediënt toevoegen')
              + (b.kind === 'recept' && isOpen ? adviceMini(b.r, peopleFor(l, b.lr)) : '')
              + (b.kind !== 'ov' && safeUrl(b.r.bron) ? `<a class="tolink" href="${esc(safeUrl(b.r.bron))}" target="_blank" rel="noopener">Bron: ${esc(new URL(safeUrl(b.r.bron)).hostname.replace(/^www\./, ''))} ↗</a>` : '')
              + (b.kind === 'ov' ? '' : `<a class="tolink" href="#/recept/${b.id}">${b.kind === 'week' ? 'Setje' : 'Recept'}pagina →</a>`);
            return blk(b.key, b.color, 'orec', emo(b), esc(b.name), `<span class="${b.parts.length && p.t === p.d ? 'badge' : ''}">${ptext(b.parts)}</span>${sub}`, body, isOpen);
          }).join('');
      }).join('');
      return `<div class="ov ${rec ? 'rec' : 'cat'}" id="ov"><svg class="ovl" id="ovl" aria-hidden="true"></svg><div class="ovL">${left}</div><div class="ovR">${right}</div></div>`;
    }

    // Lijntjes, getekend NA de render op gemeten posities. Open blok: één lijn per ingrediënt; dicht blok: één lijn
    // per doel vanaf de kop. Doel = recept/setje/Overige (categorieën open) of categorie (recepten open).
    function drawLines() {
      const ov = $('#ov'), svg = $('#ovl'), l = curList(); if (!ov || !svg || !l) return;
      const box = ov.getBoundingClientRect();
      svg.setAttribute('width', box.width); svg.setAttribute('height', box.height);
      const rec = l.view === 'rec', sel = S.ui?.sel, rows = rowsFor(l), rowMap = new Map(rows.map(r => [r.key, r]));
      const catOf = r => S.categories.includes(r.cat) ? r.cat : 'Overig'; // zelfde terugval als grouped()
      const targetsOf = r => rec ? ['cat:' + catOf(r)] : r.recipe ? r.src.map(x => 'rec:' + x.id) : ['rec:_ov'];
      const blockRows = new Map([...grouped(rows, false).map(([c, a]) => ['cat:' + c, a]), ...rightBlocks(l, rows, rowMap).map(b => [b.key, b.parts])]);
      const els = new Map([...ov.querySelectorAll('[data-b]')].map(e => [e.dataset.b, e]));
      const rect = el => { const b = el.getBoundingClientRect(); return { l: b.left - box.left, r: b.right - box.left, t: b.top - box.top, b: b.bottom - box.top }; };
      const out = [];
      for (const blk of ov.querySelectorAll((rec ? '.ovR' : '.ovL') + ' .oblk')) {
        const body = blk.querySelector('.obody');
        const isOpen = !body.hidden; // Han: alleen lijnen uit een opengeklapt blok in kleur, de rest grijs
        const anchors = isOpen ? [...body.querySelectorAll('.item[data-key]')].map(el => ({ el, rs: [rowMap.get(el.dataset.key)] }))
          : [{ el: blk.querySelector('.ohead'), rs: blockRows.get(blk.dataset.b) || [] }];
        for (const a of anchors) {
          const tg = new Map();
          for (const r of a.rs) if (r) for (const k of targetsOf(r)) { if (!tg.has(k)) tg.set(k, []); tg.get(k).push(r); }
          if (!tg.size) continue;
          const ra = rect(a.el), y1 = ra.t + Math.min((ra.b - ra.t) / 2, 18);
          for (const [k, rr] of tg) {
            const te = els.get(k); if (!te) continue;
            const rb = rect(te), y2 = Math.max(rb.t + 12, Math.min(rb.b - 12, y1)); // zo vlak mogelijk landen
            const [x1, x2, c] = rec ? [ra.l, rb.r, -38] : [ra.r, rb.l, 38]; // controlepunten binnen de 44px goot
            out.push({ d: `M${x1},${y1} C${x1 + c},${y1} ${x2 - c},${y2} ${x2},${y2}`, c: isOpen ? te.dataset.color : LINE_GREY,
              active: !!sel && (sel === 'b:' + blk.dataset.b || sel === 'b:' + k || rr.some(r => sel === 'k:' + r.key)), done: rr.every(r => r.done), stock: rr.every(r => r.stock) });
          }
        }
      }
      svg.innerHTML = out.sort((a, b) => a.active - b.active).map(o => {
        const op = sel ? (o.active ? .95 : .1) : (o.done ? .15 : .45);
        return `<path d="${o.d}" fill="none" stroke="${o.c}" stroke-width="${o.active ? 1.8 : 1}" stroke-opacity="${op}" stroke-linecap="round"${o.stock ? ' stroke-dasharray="3 3"' : ''}/>`;
      }).join('');
    }

    // 7. Wat het hele lijstje oplevert: recepten zoals geschaald, setjes, en losse items met een herkenbare hoeveelheid.
    function listNutrition(l) {
      const tot = Object.fromEntries(NUTS.map(([k]) => [k, 0])); let counted = 0, total = 0;
      const add = (g, f) => { total++; const gr = gramsOf(g), v = per100(g); if (gr == null || !v) return; for (const [k] of NUTS) tot[k] += (v[k] || 0) * gr / 100 * f; counted++; };
      for (const lr of l.recipes) { const r = recipeById(lr.rid); if (r) r.ingredients.forEach(g => g.name.trim() && add(g, factorOf(r, lr))); }
      for (const it of l.items) { const q = parseLine(`${it.qty || ''} ${it.name}`.trim()); if (q && q.qty) add({ name: q.name, qty: q.qty, unit: q.unit }, 1); }
      return { tot, counted, total };
    }
    // 9. Plantendiversiteit: verschillende plantensoorten op het lijstje; kruiden en specerijen tellen als ¼
    // (de "30 planten per week"-vuistregel). Dranken, snoep, olie, zout en non-food tellen niet.
    const PLANT_CATS = new Set(['Groente & fruit', 'Aardappelen, pasta & rijst', 'Brood & ontbijt', 'Houdbaar', 'Zuivelvervangers', 'Beleg', 'Kruiden & sauzen']);
    const NOT_PLANT = new Set(['suiker', 'zout', 'water', 'gist', 'bakpoeder', 'maizena', 'beleg', 'groentebouillon', 'azijn', 'ketchup', 'sambal', 'sriracha', 'worcestersaus', 'currypasta', 'jam']);
    function plantCount(rows) {
      const seen = new Map();
      for (const r of rows) {
        const info = ingInfo(r.name); if (!info || !PLANT_CATS.has(info.cat) || NOT_PLANT.has(info.naam) || seen.has(info.naam)) continue;
        if (info.emoji === '🫒' && /olie/.test(info.naam)) continue; // olie is geen plantensoort voor deze telling
        seen.set(info.naam, info.emoji === '🌿' || info.emoji === '🧂' || info.emoji === '🌰' || info.emoji === '🌶️' ? .25 : 1);
      }
      return { n: [...seen.values()].reduce((a, b) => a + b, 0), names: [...seen.keys()] };
    }
    function listNutHtml(l, rows) {
      const ps = peopleFor(l), days = l.days || 3, ln = listNutrition(l);
      const need = Object.fromEntries(['kcal', ...ADVISE].map(k => [k, ps.reduce((a, p) => a + needOf(p)[k], 0) * days]));
      const pct = Object.fromEntries(['kcal', ...ADVISE].map(k => [k, need[k] ? ln.tot[k] / need[k] : 1]));
      const pc = plantCount(rows), goal = Math.round(30 * days / 7);
      const row = k => `<div class="nrow"><span>${NUT[k].label}</span><span class="nval">${fmtN(ln.tot[k] / (ps.length * days))} ${NUT[k].unit}</span>
        <span class="nbar"><i class="${k === 'kcal' ? 'ok' : pctCls(pct[k])}" style="width:${Math.min(100, pct[k] * 100)}%"></i></span><span class="npct">${Math.round(pct[k] * 100)}%</span></div>`;
      // 10. Recepten die de grootste tekorten aanvullen (uit je eigen recepten, niets wat iemand aan tafel niet mag/lust)
      const low = ADVISE.filter(k => pct[k] < 0.8 && !['b12', 'vitd', 'jodium'].includes(k));
      const recs = S.recipes.filter(r => kindOf(r) === 'recept' && !l.recipes.some(x => x.rid === r.id))
        .filter(r => !r.ingredients.some(g => g.name.trim() && personTags({ name: g.name, allergy: allergyOf([g]) }).includes('tag warn')))
        .map(r => { const n = nutri(r); const gains = low.map(k => [k, n.per[k] * l.persons / need[k]]).filter(([, v]) => v >= .03).sort((a, b) => b[1] - a[1]);
          // score: per tekort hoeveel dit recept aanvult, maar nooit meer dan er ontbreekt
          return { r, gains, score: gains.reduce((a, [k, v]) => a + Math.min(v, Math.max(0, 1 - pct[k])), 0) }; })
        .filter(x => x.gains.length).sort((a, b) => b.score - a.score).slice(0, 2);
      const preg = ps.some(p => p.zwanger && p.geslacht !== 'm');
      return `<div class="card nut lnut"><div class="rub" style="margin:0 0 4px"><span>Voeding van dit lijstje</span></div>
        <div class="muted">Wat de boodschappen samen leveren, per persoon per dag, voor ${ps.length} ${ps.length === 1 ? 'persoon' : 'personen'} × ${days} ${days === 1 ? 'dag' : 'dagen'} ${stepper('ldays', l.id, days, 'd.')}</div>
        <div class="ntab">${['kcal', ...ADVISE].map(row).join('')}</div>
        <div class="note">🌱 Variatie: <b>${fmtN(pc.n)}</b> plantensoorten (doel ~${goal} voor ${days} dagen)${pc.n >= goal ? ' ✓' : ''}</div>
        ${recs.map(x => `<div class="tip"><span>🍽️ Aanvulling: <b>${esc(x.r.name)}</b> → ${x.gains.slice(0, 3).map(([k, v]) => `+${Math.round(v * 100)}% ${NUT[k].label.toLowerCase()}`).join(', ')}</span><button class="btn small" data-act="recToList" data-rid="${x.r.id}">+ op lijstje</button></div>`).join('')}
        ${preg ? `<div class="note">🤰 Zwanger en vegan: let extra op <b>foliumzuur</b> (supplement 400 µg tot week 10), <b>vitamine D</b> (10 µg), <b>B12</b>, <b>jodium</b> en <b>DHA</b> (omega-3 uit algenolie). Foliumzuur en DHA volgt deze app niet. Bespreek supplementen met je verloskundige.</div>` : ''}
        <div class="muted" style="margin-top:6px">${ln.counted} van ${ln.total} ingrediënten meegeteld. Eet je ergens buiten de deur, dan ligt het echt hoger; zonder ontbijt-/lunchsetje ligt het lager. Schattingen.</div></div>`;
    }

    function viewList(l) {
      const rows = rowsFor(l), rowMap = new Map(rows.map(r => [r.key, r]));
      const pr = progressOf(rows), pct = pr.t ? Math.round(pr.d / pr.t * 100) : 0;
      return `<div class="top"><a class="btn icon" href="#/" aria-label="Terug">←</a><h1 data-act="renameList" style="cursor:pointer">${esc(l.name)}</h1></div>
        ${whoChips(l)}<div class="muted" style="margin-top:4px">${l.persons} ${l.persons === 1 ? 'persoon' : 'personen'} · schaalt alle recepten mee</div>
        <div class="progress"><i style="width:${pct}%"></i></div><div class="muted">${pr.d} van ${pr.t} binnen</div>
        ${(CONS = constraintsOf(peopleFor(l)), boardHtml(l, rows, rowMap))}
        <div class="toolbar">
          <button class="btn small" data-act="hideDone">${l.hideDone ? 'Toon afgevinkt' : 'Verberg afgevinkt'}</button>
          <button class="btn small" data-act="uncheckAll">Alles uitvinken</button>
          <button class="btn small" data-act="share">Deel / kopieer</button>
          <button class="btn small danger" data-act="delList">Lijstje verwijderen</button>
        </div>
        <div class="algbottom">${listNutHtml(l, rows)}</div>
        <div class="algbottom">${algPanel(rows)}</div>`;
    }

    function viewRecipes() {
      const card = r => `<a href="#/recept/${r.id}" class="card listcard"><b>${esc(r.name)}</b><div class="muted">${kindOf(r) === 'week' ? 'vast setje' : r.persons + ' personen'} · ${r.ingredients.length} ingrediënten</div></a>`;
      const sec = (k, t) => `<div class="rub" style="margin:14px 2px 8px">${t}</div>` + (S.recipes.filter(r => kindOf(r) === k).map(card).join('') || '<div class="muted">Nog niets.</div>');
      return `<div class="top"><h1>Recepten</h1></div>${tabs('r')}${sec('recept', 'Recepten')}${sec('week', 'Weekboodschappen')}
        <div class="toolbar"><button class="btn primary" data-act="newRecipe" data-kind="recept">+ Nieuw recept</button><button class="btn" data-act="newRecipe" data-kind="week">+ Nieuw setje</button></div>
        <div class="toolbar"><button class="btn small" data-act="restoreSeed">Voorbeeldrecepten terugzetten</button></div>`;
    }

    // Allergenen van één recept (ingrediëntenlijst ∪ gekoppelde producten); ⚠ bij wat in jouw filter staat.
    function algHtml(r) {
      const av = S.avoid || [], gs = r.ingredients.filter(g => g.name.trim()), by = new Map(), tr = new Map(), unk = [];
      for (const g of gs) {
        const a = allergyOf([g]); if (a.unknown) { unk.push(g.name.trim()); continue; }
        a.hit.forEach(x => by.set(x, [...(by.get(x) || []), g.name.trim()]));
        a.trace.forEach(x => tr.set(x, [...(tr.get(x) || []), g.name.trim()]));
      }
      const line = (m, pre) => ALLERGENS.filter(([id]) => m.has(id)).map(([id, nl]) => `<div${av.includes(id) ? ' class="warnline"' : ''}>${av.includes(id) ? '⚠ LET OP: ' : ''}${pre}${nl}: ${esc(m.get(id).join(', '))}</div>`).join('');
      return (line(by, '') + line(tr, 'sporen ') || (unk.length === gs.length ? '' : '<div class="muted">Geen allergenen bekend.</div>'))
        + (unk.length ? `<div class="muted">? Onbekend (niet in de ingrediëntenlijst, geen product gekoppeld): ${esc(unk.join(', '))}</div>` : '');
    }
    function nutHtml(r) {
      const a = adviceFor(r), n = a.n;
      if (!n.counted) return '<div class="muted">Nog geen voedingswaarden bekend voor deze ingrediënten.</div>';
      const who = S.eaters?.length ? `${S.eaters.length} eter${S.eaters.length > 1 ? 's' : ''} (gemiddeld), ${diet()}` : `een volwassene, ${diet()} (stel je eters in op de startpagina)`;
      const row = ([k, label, unit]) => {
        const p = k in a.pct ? a.pct[k] : k === 'kcal' ? n.per.kcal / a.tgt.kcal : null;
        return `<div class="nrow"><span>${label}</span><span class="nval">${fmtN(n.per[k])} ${unit}</span>${p == null ? '<span></span><span></span>'
          : `<span class="nbar"><i class="${k === 'kcal' ? 'ok' : pctCls(p)}" style="width:${Math.min(100, p * 100)}%"></i></span><span class="npct">${Math.round(p * 100)}%</span>`}</div>`;
      };
      return `<div class="muted">Per portie, en welk deel dat is van wat een warme maaltijd (35% van de dag) zou moeten leveren voor ${esc(who)}:</div>
        <div class="ntab">${NUTS.map(row).join('')}</div>
        ${a.tips.map(tipHtml(r)).join('')}${a.notes.map(x => `<div class="note">${x}</div>`).join('')}
        <div class="muted" style="margin-top:6px">${n.counted} van ${n.total} ingrediënten meegeteld${n.missing.length ? ' — mist: ' + esc(n.missing.join(', ')) : ''}. Schattingen uit de ingrediëntenlijst.</div>`;
    }

    function viewRecipe(r) {
      const rows = r.ingredients.map((g, i) => {
        const needGpu = g.off && gramsOf(g) === null;
        const nlabel = needGpu ? `⚠ gewicht per ${g.unit} ontbreekt` : g.off ? '✓ ' + g.off.label : 'Voeding koppelen';
        return `
        <div class="card ing">
          <input type="number" step="any" min="0" inputmode="decimal" value="${g.qty || ''}" data-f="qty" data-i="${i}" aria-label="Hoeveelheid" />
          <select data-f="unit" data-i="${i}" aria-label="Eenheid">${unitOptions(g.unit)}</select>
          <div class="nm"><span class="em" aria-hidden="true">${g.name.trim() ? g.emoji || emojiFor(g.name, g.cat) : ''}</span><input value="${esc(g.name)}" data-f="name" data-i="${i}" placeholder="Ingrediënt" aria-label="Ingrediënt" /></div>
          <button class="btn icon" data-act="ingDel" data-i="${i}" aria-label="Verwijder ingrediënt">×</button>
          <select class="catsel" data-f="cat" data-i="${i}" data-prev="${esc(g.cat)}" aria-label="Categorie">${catOptions(g.cat)}</select>
          <label class="stkl"><input type="checkbox" data-f="stock" data-i="${i}"${g.stock ? ' checked' : ''} /> In huis</label>
          <button class="btn nbtn" data-act="nutri" data-i="${i}" title="${esc(g.off ? g.off.label : '')}">${esc(nlabel)}</button>
        </div>`;
      }).join('');
      const wk = kindOf(r) === 'week';
      return `<div class="top"><a class="btn icon" href="#/recepten" aria-label="Terug">←</a><h1>${wk ? 'Setje' : 'Recept'}</h1></div>
        <div class="field"><label>Naam</label><input value="${esc(r.name)}" data-rf="name" /></div>
        <div class="field"><label>Emoji (leeg = automatisch: ${recipeEmoji({ name: r.name })})</label><input value="${esc(r.emoji || '')}" data-rf="emoji" maxlength="4" style="width:90px" /></div>
        <div class="field"><label>Bron (link naar het recept, bv. BBC Good Food)</label><input value="${esc(r.bron || '')}" data-rf="bron" inputmode="url" placeholder="https://…" />${safeUrl(r.bron) ? ` <a class="tolink" style="border:0;padding:6px 0" href="${esc(safeUrl(r.bron))}" target="_blank" rel="noopener">Open bron ↗</a>` : ''}</div>
        <div class="field"><label>Soort</label><select data-rf="kind"><option value="recept"${wk ? '' : ' selected'}>Recept (schaalt per persoon)</option><option value="week"${wk ? ' selected' : ''}>Setje weekboodschappen (vaste hoeveelheden)</option></select></div>
        ${wk ? '' : `<div class="field"><label>Ingrediënten zijn berekend voor</label>${stepper('recPers', r.id, r.persons, 'personen')}</div>`}
        <div class="field"><label>Ingrediënten</label>${rows}<button class="btn small" data-act="ingAdd">+ Ingrediënt</button></div>
        <div class="field"><label>Voeding per portie (schatting)</label>
          <div class="card nut"><div id="nutBox">${nutHtml(r)}</div>
            <div id="autoStatus" class="muted"></div>
            <button class="btn small" data-act="autoNut" style="margin-top:8px">Merkproducten zoeken (optioneel)</button>
            <div class="muted" style="margin-top:6px">Een gekoppeld merkproduct (Open Food Facts, gebruikers-gegevens) vervangt de energie, eiwit, vet, koolhydraten en vezels uit de lijst.</div></div></div>
        <div class="field"><label>Allergenen (ingrediëntenlijst + gekoppelde producten)</label>
          <div class="card nut"><div id="algBox">${algHtml(r)}</div>
            <div class="muted" style="margin-top:6px">Ontbrekend betekent niet afwezig. Controleer bij een echte allergie altijd het etiket.</div></div></div>
        <div class="toolbar"><button class="btn primary" data-act="toList">Op een lijstje zetten</button>
          <button class="btn danger" data-act="delRecipe">Recept verwijderen</button></div>`;
    }

    function render() {
      CONS = null; // alleen geldig binnen een lijstje
      const app = $('#app'), h = location.hash.replace(/^#/, '') || '/';
      const [, kind, id] = h.split('/');
      let html;
      if (kind === 'lijst' && listById(id)) html = viewList(listById(id));
      else if (kind === 'recepten') html = viewRecipes();
      else if (kind === 'recept' && recipeById(id)) html = viewRecipe(recipeById(id));
      else html = viewLists();
      app.innerHTML = html;
      if (!animBusy) drawLines(); // no-op buiten het bord; tijdens een animatie pas aan het eind (scheelt een hapering)
      updateBg();
      document.title = (kind === 'lijst' && listById(id)) ? listById(id).name + ' · Boodschappen' : 'Boodschappen';
    }
    const route = () => { const [, kind, id] = (location.hash.replace(/^#/, '') || '/').split('/'); return { kind, id }; };
    const curList = () => listById(route().id);
    const curRecipe = () => recipeById(route().id);
    const commit = () => { save(); render(); };

    /* ---------- dialoog ---------- */
    const dlg = $('#sheet');
    function sheet(title, body, buttons) {
      dlg.innerHTML = `<h2>${esc(title)}</h2><div>${body}</div><div class="btns">${buttons.map(b => `<button class="btn ${b.cls || ''}" data-s="${b.id}">${b.label}</button>`).join('')}</div>`;
      dlg._h = Object.fromEntries(buttons.map(b => [b.id, b.fn]));
      if (!dlg.open) dlg.showModal();
    }
    dlg.addEventListener('click', e => {
      const b = e.target.closest('[data-s]'); if (!b) return;
      const fn = dlg._h[b.dataset.s]; if (fn && fn(dlg) === false) return;
      dlg.close();
    });
    const cancel = { id: 'x', label: 'Annuleren', fn: () => {} };

    // "+ Nieuwe categorie…" — voor selects in dialogen én op pagina's.
    function handleNewCat(sel) {
      const name = (prompt('Naam van de nieuwe categorie:') || '').trim();
      if (!name) { sel.value = sel.dataset.prev; return null; }
      if (!S.categories.includes(name)) {
        // vóór 'Overig' invoegen zodat de vangnet-categorie onderaan blijft
        const i = S.categories.indexOf('Overig');
        S.categories.splice(i < 0 ? S.categories.length : i, 0, name);
        save();
      }
      const o = document.createElement('option'); o.textContent = name;
      sel.insertBefore(o, sel.querySelector('option[value="__new"]'));
      sel.value = name; sel.dataset.prev = name;
      return name;
    }

    /* ---------- beweging ----------
       Han: "te snel en hakkelig, en de pagina begint keihard te scrollen". Daarom:
       - alleen transform / clip-path / opacity bewegen (FLIP, zie onder) → geen layout per frame;
       - nooit zelf scrollen naar iets toe: het aangetikte blok blijft onder je vinger staan (één onzichtbare
         correctie vóór de eerste frame);
       - rustige curves, ~0,5 s voor in-/uitklappen en ~1,2 s voor omklappen; 'minder beweging' = direct. */
    const EASE_OUT = 'cubic-bezier(.22, 1, .36, 1)', EASE_INOUT = 'cubic-bezier(.65, 0, .35, 1)';
    const calm = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
    const blockEl = key => [...document.querySelectorAll('[data-b]')].find(e => e.dataset.b === key);
    function keepAnchor(key, top) { const el = blockEl(key); if (!el) return; const d = el.getBoundingClientRect().top - top; if (Math.abs(d) > .5) scrollBy(0, d); }
    // FLIP (First-Last-Invert-Play): posities meten, eindstand in één keer neerzetten (één layout), één keer
    // onzichtbaar scrollen zodat het aangetikte blok blijft staan, en dan alleen transform / clip-path /
    // opacity animeren. Die doet de GPU; er wordt per frame niets opnieuw ingedeeld. (De vorige versie
    // animeerde hoogte en scrolde elke frame: in de testbrowser 60 fps, op Han's telefoon hakkelig.)
    const movers = () => [...document.querySelectorAll('#ov .ovL > *, #ov .ovR > *, .toolbar, .algbottom')];
    const slide = (els, before, ms) => els.map((e, i) => { const dy = before[i] - e.getBoundingClientRect().top;
      return Math.abs(dy) > .5 ? e.animate([{ transform: `translateY(${dy}px)` }, { transform: 'none' }], { duration: ms, easing: EASE_OUT }).finished : null; }).filter(Boolean);
    const reveal = (body, ms, delay = 0) => body.animate([{ clipPath: 'inset(0 0 100% 0)', opacity: 0 }, { clipPath: 'inset(0 0 0 0)', opacity: 1 }],
      { duration: ms, delay, easing: EASE_OUT, fill: 'backwards' }).finished;
    const linesIn = ms => { const s = $('#ovl'); if (!s) return; s.style.opacity = ''; s.animate([{ opacity: 0 }, { opacity: 1 }], { duration: ms }); };
    // Het voedingsadvies staat alleen in het open recept (scheelt rekenwerk bij elke render); bij openklappen aanvullen.
    function fillAdvice(b) {
      const l = curList(), id = b.dataset.b.slice(4), lr = l?.recipes.find(x => x.rid === id), r = recipeById(id);
      if (!lr || !r || kindOf(r) !== 'recept' || b.querySelector('.adv')) return;
      const html = adviceMini(r, peopleFor(l, lr)); if (!html) return;
      const at = b.querySelector('.obody .tolink'); at.insertAdjacentHTML('beforebegin', html);
    }
    function setOpen(b, on) {
      if (!b) return;
      b.querySelector('.obody').hidden = !on; b.classList.toggle('open', on);
      b.querySelector('.ohead').setAttribute('aria-expanded', on);
    }

    // Eén blok per kant open: tik een kop → dat blok open, het vorige dicht (of dicht als het al open was).
    async function accordion(blk) {
      if (animBusy || !blk) return;
      const key = blk.dataset.b, side = key.startsWith('cat:') ? 'cat' : 'rec', id = key.slice(4);
      const u = (S.ui ||= {}), open = (u.open ||= {}), wasOpen = open[side] === id;
      const prev = !wasOpen && open[side] != null ? blockEl(side + ':' + open[side]) : null;
      open[side] = wasOpen ? null : id; u.sel = wasOpen ? null : 'b:' + key; save();
      const top = blk.getBoundingClientRect().top;
      if (calm()) { render(); keepAnchor(key, top); return; }
      animBusy = true;
      try {
        const els = movers(), before = els.map(e => e.getBoundingClientRect().top);
        $('#ovl').style.opacity = '0';
        setOpen(prev, false); setOpen(blk, !wasOpen);
        if (!wasOpen) fillAdvice(blk);
        document.querySelectorAll('#ov .sel').forEach(e => e.classList.remove('sel')); if (!wasOpen) blk.classList.add('sel');
        keepAnchor(key, top);          // één keer, vóór de eerste frame: niemand ziet de sprong
        const jobs = slide(els, before, 460);
        if (!wasOpen) jobs.push(reveal(blk.querySelector('.obody'), 460));
        await Promise.all(jobs);
        drawLines(); linesIn(260);     // pas na afloop: houdt de eerste frame na de tik zo licht mogelijk
      } finally { animBusy = false; }
    }

    // Omklappen (Han: "inklappen tot vierkant met enkel de emoji, dan weer uitklappen; het meest clean").
    //  0. open inhoud klapt in (clip-path);
    //  1. nieuwe stand renderen, alles dicht. Per vak (zelfde data-b aan beide kanten) een leeg schaduwvak dat
    //     krimpt tot een vierkantje rond de emoji, naar de nieuwe plek schuift en uitklapt tot de nieuwe vorm;
    //     de emoji reist rechtop mee; de echte inhoud verschijnt pas als het vak staat. Er vervormt nooit tekst.
    //  2. het aangetikte vak schuift uit, wat eronder staat schuift mee (FLIP).
    async function flip(el) {
      if (animBusy) return;
      const l = curList(), key = el.dataset.b, toRec = key.startsWith('rec:'), id = key.slice(4), top = el.getBoundingClientRect().top;
      const go = () => { l.view = toRec ? 'rec' : 'cat'; const u = (S.ui ||= {}); (u.open ||= {})[toRec ? 'rec' : 'cat'] = id; u.sel = 'b:' + key; u.adding = null; commit(); };
      if (calm()) { go(); keepAnchor(key, top); return; }
      animBusy = true;
      try {
        $('#ovl').animate([{ opacity: 1 }, { opacity: 0 }], { duration: 180, fill: 'forwards' });
        // stap 1 (Han: "eerst alles inklappen"): de inhoud veegt weg, daarna sluit het vak zich echt en schuift
        // wat eronder staat vloeiend omhoog (FLIP) — anders sprong het lege witte vak in één keer naar klein.
        const openBlocks = [...document.querySelectorAll('#ov .oblk.open')];
        await Promise.all(openBlocks.map(b => b.querySelector('.obody').animate([{ clipPath: 'inset(0 0 0 0)', opacity: 1 }, { clipPath: 'inset(0 0 100% 0)', opacity: 0 }],
          { duration: 240, easing: EASE_INOUT, fill: 'forwards' }).finished));
        if (openBlocks.length) {
          const els = movers(), before = els.map(x => x.getBoundingClientRect().top);
          openBlocks.forEach(b => setOpen(b, false)); keepAnchor(key, top);
          await Promise.all(slide(els, before, 360));
        }
        // van een breed vak telt alleen de kop (= zo groot als het dicht is); plus waar zijn emoji staat
        const snap = e => { const em = e.querySelector('.hemo, .vemo'), box = (e.querySelector(':scope > .ohead') || e).getBoundingClientRect(); return { box, em: em ? em.getBoundingClientRect() : box, emEl: em }; };
        const from = new Map([...document.querySelectorAll('#ov [data-b]')].map(e => [e.dataset.b, snap(e)]));

        go();
        const t = blockEl(key); if (t) setOpen(t, false); // eerst dicht naar zijn plek, daarna uitschuiven
        keepAnchor(key, top);
        const ov = $('#ov'), jobs = [], ghosts = []; $('#ovl').style.opacity = '0';
        const pairs = [...ov.querySelectorAll('[data-b]')].map(e => ({ e, o: from.get(e.dataset.b), n: snap(e) })).filter(x => x.o); // eerst alles meten
        const cx = r => r.left + r.width / 2, cy = r => r.top + r.height / 2;
        pairs.forEach(({ e, o, n }, i) => {
          const N = n.box, side = Math.min(o.box.width, o.box.height, N.width, N.height); // het vierkantje
          const sq = em => ({ left: cx(em) - side / 2, top: cy(em) - side / 2, width: side, height: side });
          const K = r => `translate(${cx(r) - cx(N)}px, ${cy(r) - cy(N)}px) scale(${r.width / N.width}, ${r.height / N.height})`;
          const opts = { duration: 1100, delay: Math.min(i * 10, 80), easing: 'ease-in-out', fill: 'backwards' }; // weinig verspringing: de stappen blijven herkenbaar
          // 1) leeg schaduwvak: oude vorm → vierkantje (35%) → verhuisd (65%) → nieuwe vorm
          const g = e.cloneNode(false); g.removeAttribute('data-b'); g.removeAttribute('data-act'); g.classList.remove('sel'); g.classList.add('ghost');
          Object.assign(g.style, { left: N.left + 'px', top: N.top + 'px', width: N.width + 'px', height: N.height + 'px' });
          document.body.appendChild(g); ghosts.push(g);
          jobs.push(g.animate([{ transform: K(o.box) }, { transform: K(sq(o.em)), offset: .3 }, { transform: K(sq(o.em)), offset: .4 }, { transform: K(sq(n.em)), offset: .7 }, { transform: 'none' }], opts).finished);
          // 2) de emoji reist rechtop mee, midden in het vierkantje
          if (n.emEl) {
            const eg = document.createElement('span'); eg.className = 'ghost gemo'; eg.textContent = n.emEl.textContent;
            Object.assign(eg.style, { left: n.em.left + 'px', top: n.em.top + 'px', width: n.em.width + 'px', height: n.em.height + 'px', fontSize: getComputedStyle(n.emEl).fontSize });
            document.body.appendChild(eg); ghosts.push(eg);
            const T = r => `translate(${cx(r) - cx(n.em)}px, ${cy(r) - cy(n.em)}px)`;
            jobs.push(eg.animate([{ transform: T(o.em) }, { transform: T(o.em), offset: .4 }, { transform: 'none', offset: .7 }, { transform: 'none' }], opts).finished);
          }
          // 3) de echte inhoud (tekst) pas tonen als het vak zijn nieuwe vorm heeft
          e.classList.add('morphing');
          jobs.push(e.animate([{ opacity: 0 }, { opacity: 0, offset: .85 }, { opacity: 1 }], opts).finished);
        });
        ov.querySelectorAll('.rub, .vrub, .vplus').forEach(x => jobs.push(x.animate([{ opacity: 0 }, { opacity: 0, offset: .7 }, { opacity: 1 }], { duration: 1100, fill: 'backwards' }).finished));
        await Promise.all(jobs);
        ghosts.forEach(g => g.remove()); ov.querySelectorAll('.morphing').forEach(e => e.classList.remove('morphing'));

        if (t) {
          const els = movers(), before = els.map(x => x.getBoundingClientRect().top);
          setOpen(t, true); fillAdvice(t); keepAnchor(key, top);
          await Promise.all([...slide(els, before, 460), reveal(t.querySelector('.obody'), 460)]);
        }
        drawLines(); linesIn(320);
      } finally { animBusy = false; }
    }

    // Ongedaan maken (Han: "per ongeluk pompoensoep verwijderd"): vóór een verwijdering een momentopname van
    // alle data; de balk onderaan zet die 10 s lang met één tik terug, inclusief de pagina waar je was.
    let toastTimer = 0;
    function withUndo(label, fn) {
      const snap = JSON.stringify(S), hash = location.hash;
      fn();
      const t = $('#toast');
      t.innerHTML = `<span>${esc(label)}</span><button type="button">Ongedaan maken</button>`; t.hidden = false;
      t.querySelector('button').onclick = () => {
        S = JSON.parse(snap); save(); t.hidden = true; clearTimeout(toastTimer);
        if (location.hash !== hash) location.hash = hash; else render();
      };
      clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 10000);
    }

    /* ---------- acties ---------- */
    const clamp = n => Math.max(1, Math.min(99, n));
    const actions = {
      newList() {
        sheet('Nieuw lijstje', `<div class="field"><label>Naam</label><input id="f-name" value="Boodschappen" /></div>
          <div class="field"><label>Aantal personen</label><input id="f-pers" type="number" min="1" max="99" value="4" /></div>`,
          [cancel, { id: 's', label: 'Maken', cls: 'primary', fn: d => {
            const l = { id: uid(), name: d.querySelector('#f-name').value.trim() || 'Boodschappen', persons: clamp(+d.querySelector('#f-pers').value || 4), recipes: [], items: [], done: {}, hideDone: false };
            initWho(l);
            S.lists.unshift(l); save(); location.hash = '#/lijst/' + l.id;
          } }]);
      },
      renameList() {
        const l = curList();
        sheet('Naam wijzigen', `<div class="field"><input id="f-name" value="${esc(l.name)}" /></div>`,
          [cancel, { id: 's', label: 'Opslaan', cls: 'primary', fn: d => { l.name = d.querySelector('#f-name').value.trim() || l.name; commit(); } }]);
      },
      delList() {
        const l = curList();
        sheet('Lijstje verwijderen?', `<p>“${esc(l.name)}” wordt verwijderd. Je recepten blijven bewaard.</p>`,
          [cancel, { id: 's', label: 'Verwijderen', cls: 'danger', fn: () => withUndo(`“${l.name}” verwijderd`, () => { S.lists = S.lists.filter(x => x !== l); save(); location.hash = '#/'; }) }]);
      },

      async share() {

      // Voeding koppelen: gewicht per eenheid + zoeken in Open Food Facts.
      nutri(el) {
        const r = curRecipe(), g = r.ingredients[+el.dataset.i];
        const weighed = ['g', 'kg', 'ml', 'l'].includes(g.unit);
        const q = g.name.trim();
        sheet('Voeding: ' + (q || 'ingrediënt'),
          `<div class="muted">Nu: ${g.off ? esc(g.off.label) + ` (${Math.round(g.off.kcal)} kcal/100 g)` : 'niets gekoppeld'}</div>
           ${weighed ? '' : `<div class="field"><label>Gewicht van 1 ${esc(g.unit || 'stuk')} in gram${g.unit === 'el' || g.unit === 'tl' ? ' (leeg = standaard)' : ''}</label><input id="n-gpu" type="number" step="any" min="0" inputmode="decimal" value="${g.gpu || ''}" /></div>`}
           <div class="field"><label>Emoji (leeg = automatisch)</label><input id="n-em" value="${esc(g.emoji || '')}" maxlength="4" style="width:90px" /></div>
           <div class="field"><label>Zoek in Open Food Facts</label><div class="row"><input id="n-q" value="${esc(q)}" /><button class="btn primary" data-s="search">Zoek</button></div></div>

          const em = d.querySelector('#n-em'); if (em) { const e = em.value.trim(); if (e) g.emoji = e; else delete g.emoji; } };
        const doSearch = async () => {
          const res = dlg.querySelector('#n-res'); res.textContent = 'Zoeken…';

            if (!hits.length) { res.textContent = 'Niets gevonden. Probeer een andere zoekterm.'; return; }
            res.innerHTML = hits.map((h, i) => `<button class="btn" data-s="pick-${i}">${esc(h.label)}<div class="muted">${Math.round(h.kcal)} kcal · eiwit ${fmt1(h.p)} · vet ${fmt1(h.f)} · kh ${fmt1(h.c)} (per 100 g)</div></button>`).join('');
            hits.forEach((h, i) => { dlg._h['pick-' + i] = d => { saveGpu(d); g.off = h; S.nutCache[q.toLowerCase()] = h;
            // Zelfde naam in andere recepten (ui, knoflook, olijfolie…) krijgt hetzelfde product, tenzij daar al gekozen is.

            commit(); }; });
          } catch (e) { res.textContent = 'Open Food Facts is nu niet bereikbaar (' + e.message + '). Probeer het later nog eens.'; }
        };

      // Alle ingrediënten zonder koppeling doen: eerst de cache (zelfde naam in een ander recept), anders het

    document.addEventListener('click', e => {
      const el = e.target.closest('[data-act]'); if (!el || dlg.contains(el)) return;
      const a = e.target.closest('a'); if (a && el.contains(a)) return; // link in een kop: navigeren, niet in-/uitklappen
