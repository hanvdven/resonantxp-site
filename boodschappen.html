    });

    // Invoer per regel (de "+" in een kop). Categorie-+ en Overige-+ maken een los item; recept/setje-+ voegt een
    // ingrediënt aan het recept zelf toe (Han: "aan het recept toevoegen"), zodat het meeschaalt en blijft.
    function addLine(t, txt) {
      const p = parseLine(txt); if (!p) return;
      const l = curList(), cat = t.startsWith('c:') ? t.slice(2) : (guessCat(p.name) || 'Overig');
      if (t.startsWith('r:')) {
        const r = recipeById(t.slice(2)), lr = l.recipes.find(x => x.rid === r.id);
        // je typt de hoeveelheid voor DIT lijstje; het recept bewaart hem voor zijn eigen aantal personen
        r.ingredients.push(ing(p.name, p.qty / factorOf(r, lr), p.qty ? p.unit : '', cat));
      } else l.items.push({ id: uid(), name: p.name, qty: p.qtyText, cat, done: false });
      commit(); $('form.inl input')?.focus({ preventScroll: true });
    }
    document.addEventListener('submit', e => {
      const f = e.target; if (!f.classList.contains('inl')) return;
      e.preventDefault(); addLine(f.dataset.t, f.line.value);
    });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && e.target.closest?.('form.inl')) { S.ui.adding = null; render(); } });

    document.addEventListener('change', e => {
      const t = e.target;
      if (t.id === 'importFile') {
        const file = t.files[0]; if (!file) return;
        file.text().then(txt => {
          const d = JSON.parse(txt);
          if (!Array.isArray(d.lists) || !Array.isArray(d.recipes)) throw new Error('geen back-up');
          if (confirm('Alles in deze browser vervangen door de back-up?')) { S = d; delete S._anim; delete S._busy; commit(); }
        }).catch(() => alert('Dit bestand is geen geldige back-up.'));
        return;
      }
      if (t.dataset.diet !== undefined && t.matches('[data-diet]')) { S.diet = t.value; commit(); return; }
      if (t.dataset.palg !== undefined) { t.closest('.achip').classList.toggle('on', t.checked); return; } // chip-kleur in het profiel
      if (t.dataset.avoid) {
        const a = (S.avoid ||= []), i = a.indexOf(t.dataset.avoid);
        if (i < 0) a.push(t.dataset.avoid); else a.splice(i, 1);
        (S.ui ||= {}).algOpen = true; commit(); return; // paneel blijft open na de re-render
      }
      // categorie-select met "+ Nieuwe categorie…" (op pagina of in dialoog)
      if (t.tagName === 'SELECT' && t.value === '__new') {
        const name = handleNewCat(t);
        if (!name) return;
      }
      if (t.tagName === 'SELECT') t.dataset.prev = t.value;
      // recept-velden: in-place bijwerken, geen volledige render (anders verlies je focus bij typen)
      if (t.dataset.f) {
        const g = curRecipe().ingredients[+t.dataset.i];
        g[t.dataset.f] = t.dataset.f === 'qty' ? (parseFloat(t.value) || 0) : t.dataset.f === 'stock' ? t.checked : t.value;
        save();
        const nb = $('#nutBox'); if (nb) nb.innerHTML = nutHtml(curRecipe());
        const ab = $('#algBox'); if (ab) ab.innerHTML = algHtml(curRecipe());
      }
    });
    document.addEventListener('input', e => {
      const t = e.target;
      if (t.dataset.rf) { curRecipe()[t.dataset.rf] = t.value; save(); if (t.dataset.rf === 'kind') render(); }
      else if (t.dataset.f === 'name') { curRecipe().ingredients[+t.dataset.i].name = t.value; save(); }
    });

    // Aapjesdag: emoji-regen. Web Animations API i.p.v. CSS-klassen, zodat elk deeltje zijn eigen
    // baan krijgt en zichzelf opruimt (geen blijvende DOM-nodes). Bij 'minder beweging' alleen een korte fade.
    const CONF = ['🐵', '🙈', '🙉', '🙊', '🐒', '❤️', '💕', '💖'];
    $('#aap').addEventListener('click', () => {
      const calm = matchMedia('(prefers-reduced-motion: reduce)').matches, n = calm ? 12 : 48;
      for (let i = 0; i < n; i++) {
        const el = document.createElement('span');
        el.className = 'conf'; el.textContent = CONF[Math.floor(Math.random() * CONF.length)];
        el.style.left = Math.random() * 94 + 'vw'; el.style.fontSize = 22 + Math.random() * 26 + 'px';
        el.style.top = calm ? Math.random() * 70 + 10 + 'vh' : '100vh';
        document.body.appendChild(el);
        const rise = calm ? [{ opacity: 0 }, { opacity: 1 }, { opacity: 0 }]
          : [{ transform: 'translateY(0) rotate(0deg)', opacity: 1 }, { transform: `translateY(-${95 + Math.random() * 20}vh) rotate(${(Math.random() - .5) * 90}deg)`, opacity: 0 }];
        el.animate(rise, { duration: calm ? 1400 : 2200 + Math.random() * 1800, delay: Math.random() * 600, easing: 'ease-out', fill: 'backwards' }).onfinish = () => el.remove();
      }
    });

    // Achtergrond: aapjes en hartjes + de emoji's van wat je nu bekijkt, tien keer zoveel (Han: "ver-10-voudig").
    // Eén canvas i.p.v. honderden elementen: elke emoji wordt één keer als plaatje gerenderd (sprite) en per frame
    // alleen gestempeld. Gemeten: 280 losse <span>s gaven in rust 14 trage frames per 1,5 s, dit kost ~niets.
    let bgSig = '', bgParts = [], bgRaf = 0;
    const bgCanvas = document.createElement('canvas'); $('#aapbg').appendChild(bgCanvas);
    const bgCtx = bgCanvas.getContext('2d'), sprites = new Map();
    function sprite(ch, px) { // emoji als klein plaatje, per (teken, maat) één keer
      const k = ch + px; if (sprites.has(k)) return sprites.get(k);
      const c = document.createElement('canvas'), d = 1, w = Math.ceil(px * 1.4 * d);
      c.width = c.height = w; const x = c.getContext('2d');
      x.font = `${px * d}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`; x.textAlign = 'center'; x.textBaseline = 'middle';
      x.fillText(ch, w / 2, w / 2); sprites.set(k, c); return c;
    }
    // Achtergrond op 1× resolutie: hij is maar 17% zichtbaar, scherpte ziet niemand, rekenwerk wel (4× minder pixels op een 2×-scherm).
    function bgSize() { bgCanvas.width = innerWidth; bgCanvas.height = innerHeight; }
    function updateBg() {
      const l = curList(), set = new Set();
      if (l) { rowsFor(l).forEach(r => set.add(r.emoji)); l.recipes.forEach(lr => { const r = recipeById(lr.rid); if (r) set.add(recipeEmoji(r)); }); }
      else S.recipes.forEach(r => set.add(recipeEmoji(r)));
      const list = [...set].filter(Boolean).slice(0, 18), sig = list.join('');
      if (sig === bgSig && bgParts.length) return;
      bgSig = sig;
      const all = [...CONF, ...list], n = Math.min(280, (10 + list.length) * 10), r = () => Math.random();
      bgParts = Array.from({ length: n }, (_, i) => {
        const px = Math.round(16 + r() * 22);
        // zweven langs drie eigen punten (in % van het scherm + pixels), eigen tempo en startmoment
        return { spr: sprite(i % 4 === 0 ? CONF[i % CONF.length] : all[i % all.length], px), px, x: r(), y: r(),
          pts: [0, 1, 2].map(() => [(r() - .5) * 180, (r() - .5) * 180, (r() - .5) * 14]), per: 18000 + r() * 16000, ph: r() };
      });
      if (!bgRaf) { bgSize(); bgRaf = requestAnimationFrame(bgFrame); }
    }
    const smooth = t => t * t * (3 - 2 * t); // zacht in en uit tussen twee punten
    // Zelfregelend: haalt dit toestel geen ~20 beelden/s, dan steeds de helft minder emoji's (minimaal 28, de oude hoeveelheid).
    // Een snelle telefoon houdt er 280; een trage blijft vloeiend. Tijdens in-/uitklappen en omklappen even pauze.
    let bgLast = 0, bgGaps = [];
    function bgFrame(now) {
      bgRaf = requestAnimationFrame(bgFrame);
      if (document.hidden || animBusy) { bgLast = now; bgGaps = []; return; }
      if (now - bgLast < 32) return; // ~30 beelden/s: zweven is traag genoeg, scheelt de helft
      bgGaps.push(now - bgLast); bgLast = now;
      if (bgGaps.length >= 12) {
        const avg = bgGaps.reduce((a, b) => a + b, 0) / bgGaps.length; bgGaps = [];
        if (avg > 50 && bgParts.length > 28) bgParts = bgParts.slice(0, Math.max(28, Math.round(bgParts.length * 0.5)));
      }
      const W = innerWidth, H = innerHeight, still = calm();
      bgCtx.setTransform(1, 0, 0, 1, 0, 0); bgCtx.clearRect(0, 0, W, H); bgCtx.globalAlpha = .17;
      for (const p of bgParts) {
        let dx = 0, dy = 0, rot = 0;
        if (!still) {
          const t = ((now / p.per + p.ph) % 1) * 3, i = Math.floor(t), f = smooth(t - i), a = p.pts[i], b = p.pts[(i + 1) % 3];
          dx = a[0] + (b[0] - a[0]) * f; dy = a[1] + (b[1] - a[1]) * f; rot = (a[2] + (b[2] - a[2]) * f) * Math.PI / 180;
        }
        const s = p.px * 1.4, c = Math.cos(rot), n = Math.sin(rot);
        bgCtx.setTransform(c, n, -n, c, p.x * W + dx, p.y * H + dy); bgCtx.drawImage(p.spr, -s / 2, -s / 2); // één matrix per emoji, geen save/restore
      }
      bgCtx.setTransform(1, 0, 0, 1, 0, 0);
    }
    addEventListener('resize', () => { if (bgRaf) bgSize(); });

    // <details> meldt open/dicht via 'toggle' (borrelt niet op, dus capture); onthouden zodat een re-render het paneel niet sluit.
    document.addEventListener('toggle', e => { if (e.target.matches?.('details.alg')) (S.ui ||= {}).algOpen = e.target.open; }, true);

    window.addEventListener('hashchange', () => { if (dlg.open) dlg.close(); render(); window.scrollTo(0, 0); });
    // Lijntjes opnieuw meten bij draaien/resizen en zodra de webfonts er zijn (tekstbreedte verandert dan).
    let rz = 0; window.addEventListener('resize', () => { cancelAnimationFrame(rz); rz = requestAnimationFrame(drawLines); });
    document.fonts?.ready.then(drawLines);
    // Ingrediëntenlijst: eerst de bewaarde kopie (direct, ook offline), dan de verse versie uit de repo.
    async function loadDB() {
      try {
        const res = await fetch('boodschappen-ingredienten.json', { cache: 'no-cache' }); if (!res.ok) throw new Error('HTTP ' + res.status);
        const txt = await res.text(); setDB(JSON.parse(txt));
        try { localStorage.setItem(DBKEY, txt); } catch (e) { /* vol: dan alleen deze sessie */ }
        if (!animBusy && !document.querySelector('form.inl input:focus')) render();
      } catch (e) { /* offline of lokaal geopend: bewaarde kopie of emoji-regels blijven gelden */ }
    }
    load();
    try { const c = localStorage.getItem(DBKEY); if (c) setDB(JSON.parse(c)); } catch (e) { /* kapotte kopie: negeren */ }
    render(); loadDB();
  })();
  </script>
</body>
</html>
