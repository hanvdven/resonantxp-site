<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boodschappen</title>
  <meta name="description" content="Boodschappenlijstjes met categorieën, recepten en aantal personen." />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#f5f4f0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Linden+Hill:ital@0;1&family=Martel+Sans:wght@300;400;600;800&display=swap" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <style>
    /* Zelfstandige pagina: bewust NIET style.css/nav.js/header.js — dit is een gereedschap, geen
       onderdeel van de XP-beleving. Alleen kleuren en lettertypen volgen de site. */
    :root {
      --bg: #f5f4f0; --card: #fff; --text: #2c3140; --muted: #64748b; --line: #e5e2db;
      --accent: #2563eb; --done: #3f7d5a; --danger: #b42318; --radius: 12px;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 400 16px/1.45 'Martel Sans', system-ui, sans-serif; }
    .wrap { max-width: 640px; margin: 0 auto; padding: 16px 16px 96px; }
    h1, h2 { font-family: 'Linden Hill', Georgia, serif; font-weight: 400; margin: 0; }
    h1 { font-size: 1.9rem; } h2 { font-size: 1.25rem; }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    .top { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
    .top h1 { flex: 1; min-width: 0; overflow-wrap: anywhere; }
    .btn { min-height: 44px; padding: 0 16px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--card); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
    .btn.danger { color: var(--danger); }
    .btn.small { min-height: 36px; padding: 0 12px; font-size: .9rem; }
    .icon { width: 44px; min-height: 44px; padding: 0; text-align: center; font-size: 1.2rem; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); }
    .muted { color: var(--muted); font-size: .85rem; }
    .row { display: flex; align-items: center; gap: 8px; }
    .grow { flex: 1; min-width: 0; }
    .tabs { display: flex; gap: 6px; margin-bottom: 14px; }
    .tabs a { flex: 1; text-align: center; padding: 10px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--card); }
    .tabs a.on { background: var(--text); color: #fff; border-color: var(--text); }
    .listcard { display: block; width: 100%; text-align: left; padding: 14px 16px; margin-bottom: 10px; }
    .listcard b { font-weight: 600; }
    /* stepper */
    .stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); overflow: hidden; }
    .stepper button { width: 40px; min-height: 40px; border: 0; background: none; font-size: 1.2rem; }
    .stepper span { min-width: 78px; text-align: center; font-size: .92rem; }
    /* voortgang */
    .progress { height: 8px; border-radius: 8px; background: var(--line); overflow: hidden; margin: 6px 0 4px; }
    .progress i { display: block; height: 100%; background: var(--done); transition: width .25s; }
    /* recepten-strip op een lijstje */
    /* toevoegen */
    input, select, textarea { width: 100%; min-height: 44px; padding: 8px 12px; border: 1px solid var(--line); border-radius: var(--radius); background: #fff; }
    /* categorieën + items */
    .item { display: flex; align-items: center; gap: 12px; padding: 4px 8px 4px 4px; border-bottom: 1px solid var(--line); background: var(--card); }
    .item:first-of-type { border-top-left-radius: var(--radius); border-top-right-radius: var(--radius); }
    .item:last-of-type { border-bottom-left-radius: var(--radius); border-bottom-right-radius: var(--radius); border-bottom: 0; }
    .check { width: 44px; height: 44px; flex: none; display: grid; place-items: center; border: 0; background: none; }
    .check span { width: 24px; height: 24px; border: 2px solid #b8b3a7; border-radius: 7px; display: grid; place-items: center; color: #fff; font-size: 15px; line-height: 1; }
    .item.done .check span { background: var(--done); border-color: var(--done); }
    .item .txt { flex: 1; min-width: 0; text-align: left; border: 0; background: none; padding: 6px 0; }
    .item.done .txt { text-decoration: line-through; color: var(--muted); }
    .qty { color: var(--muted); font-size: .9rem; white-space: nowrap; }
    .tag { display: inline-block; font-size: .72rem; padding: 0 8px; margin: 2px 4px 0 0; border-radius: 99px; background: #eef2fb; color: var(--accent); border: 0; min-height: 22px; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 22px; }
    /* recept bewerken */
    .ing { display: grid; grid-template-columns: 86px 84px 1fr 44px; gap: 6px; margin-bottom: 6px; padding: 8px; }
    .ing .catsel { grid-column: 1 / 5; }
    .ing .stkl { grid-column: 1 / 3; display: flex; align-items: center; gap: 8px; font-size: .9rem; }
    .ing .nbtn { grid-column: 3 / 5; min-height: 36px; font-size: .85rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    input[type=checkbox] { width: 20px; min-height: 20px; padding: 0; accent-color: var(--done); }
    /* "In huis": gedimd, maar nog steeds leesbaar en aanklikbaar */
    .item.stock .nm2, .item.stock .qty { opacity: .42; }
    .item.stock .check span { border-color: #d6d2c8; }
    .tag.stk { background: #efede7; color: var(--muted); cursor: pointer; }
    .badge { color: var(--done); font-weight: 600; }
    .nut { padding: 12px 14px; }
    .nut .big { font-family: 'Linden Hill', Georgia, serif; font-size: 1.7rem; line-height: 1.2; }
    .res { margin-top: 10px; max-height: 40vh; overflow: auto; }
    .res .btn { display: block; width: 100%; text-align: left; margin-bottom: 6px; height: auto; padding: 8px 12px; }
    .field { margin: 12px 0; } .field label { display: block; font-size: .8rem; color: var(--muted); margin-bottom: 4px; }
    /* dialog */
    dialog { border: 0; border-radius: 16px; padding: 18px; width: min(92vw, 460px); max-height: 86vh; background: var(--bg); color: var(--text); }
    dialog::backdrop { background: rgba(26, 31, 46, .45); }
    dialog .btns { display: flex; gap: 8px; margin-top: 16px; justify-content: flex-end; }
    .pick { display: block; width: 100%; text-align: left; margin-bottom: 8px; }
    .pick[disabled] { opacity: .45; }
    .empty { text-align: center; color: var(--muted); padding: 28px 8px; }
    footer.bk { margin-top: 28px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .aap { display: block; width: 100%; min-height: 48px; margin-bottom: 14px; padding: 10px 14px; border: 1px solid #f0c9d4; border-radius: var(--radius); background: #fff0f4; color: #8a2846; text-align: center; font-weight: 600; }
    .aap span { font-weight: 400; opacity: .75; }
    .conf { position: fixed; z-index: 99; pointer-events: none; user-select: none; will-change: transform, opacity; }
    .em { margin-right: 6px; }
    .nm { position: relative; }
    .nm .em { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); margin: 0; pointer-events: none; }
    .nm input { padding-left: 36px; }
    .tag.warn { background: #fde8e8; color: #b42318; }
    .tag.trace { background: #fff4e0; color: #9a5b00; }
    .tag.unk { background: #efede7; color: var(--muted); }
    .alg { padding: 4px 14px 10px; margin: 12px 0; }
    .alg summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .achips { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 10px; }
    .achip { display: flex; align-items: center; gap: 6px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 99px; background: #fff; font-size: .9rem; }
    .achip.on { background: #fde8e8; border-color: #f1b9b3; }
    .warnline { color: #b42318; font-weight: 600; margin: 4px 0; }
    /* Bord: categorieën | recepten. Eén kant open (breed, ingrediënten afvinkbaar), de andere dicht
       (smalle verticale blokken met gedraaide tekst). SVG-lijntjes in de tussenruimte van 44px. */
    .ov { position: relative; display: grid; column-gap: 44px; margin-top: 18px; align-items: start; }
    .ov.cat { grid-template-columns: minmax(0, 1fr) 74px; }
    .ov.rec { grid-template-columns: 74px minmax(0, 1fr); }
    .ovl { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; }
    .ovL, .ovR { position: relative; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
    .ocat, .orec { overflow: hidden; }
    .ohead { display: flex; justify-content: space-between; align-items: center; gap: 6px; width: 100%; min-height: 44px; padding: 8px 10px; }
    /* naam (na de emoji-tegel) neemt de ruimte en breekt netjes af; de tegel zelf krimpt nooit */
    .ohead > .hemo + span { flex: 1; min-width: 0; overflow-wrap: break-word; hyphens: auto; }
    .ocat .item, .orec .item { border-radius: 0 !important; border-top: 1px solid var(--line); border-bottom: 0; padding-right: 8px; gap: 4px; }
    .ocat .check, .orec .check { width: 38px; }
    .orec { border-left: 4px solid var(--rc); }
    .orec > .ohead { font-size: .95rem; line-height: 1.25; }
    .orec > .ohead a { color: inherit; font-weight: 600; }
    .osub { display: block; font-weight: 400; font-size: .76rem; margin-top: 2px; }
    .rctl { padding: 0 10px 10px; }
    /* dichte kant */
    .vblock { display: flex; justify-content: center; width: 100%; min-height: 96px; padding: 12px 0; cursor: pointer; }
    .vt { writing-mode: vertical-rl; white-space: nowrap; font-size: .82rem; line-height: 1.2; display: flex; gap: 8px; align-items: center; }
    .vt .muted { font-size: .72rem; }
    .vadd { color: var(--accent); border: 1px dashed var(--accent); background: none; min-height: 110px; }
    .item.sel { background: #f3effa; }
    .orec.sel { box-shadow: 0 0 0 2px var(--rc); }
    [data-act=selIng] { cursor: pointer; }
    /* Compact (Han 2026-11-02: "veel padding, enorm ver scrollen op gsm"). Tikdoelen blijven ≥ 32px. */
    .wrap { padding: 10px 12px 64px; }
    h1 { font-size: 1.5rem; }
    .top { margin-bottom: 8px; }
    .btn, .icon { min-height: 38px; } .icon { width: 38px; }
    input, select, textarea { min-height: 38px; padding: 5px 10px; }
    .stepper button { width: 34px; min-height: 34px; } .stepper span { min-width: 64px; }
    .aap { min-height: 0; padding: 6px 12px; margin-bottom: 8px; font-size: .88rem; }
    .progress { margin: 4px 0 2px; height: 6px; }
    .alg { padding: 0 12px 6px; margin: 0 0 8px; }
    .alg summary { min-height: 36px; font-size: .9rem; }
    .achips { gap: 5px; margin: 2px 0 6px; }
    .achip { position: relative; padding: 2px 10px; font-size: .8rem; cursor: pointer; }
    .achip input { position: absolute; opacity: 0; width: 1px; height: 1px; } /* de chip zelf is het vinkje */
    .achip.on { font-weight: 600; color: #b42318; }
    .achip:focus-within { outline: 3px solid rgba(37, 99, 235, .45); }
    .alg .muted, .alg .warnline { font-size: .78rem; margin: 2px 0; }
    .ov { margin-top: 10px; }
    .ovL, .ovR { gap: 12px; }
    .ohead { min-height: 34px; padding: 5px 10px; }
    .ocat .item, .orec .item { padding: 0 8px 0 0; overflow: hidden; }
    .ocat .check, .orec .check { width: 34px; height: 36px; }
    .check span { width: 20px; height: 20px; border-radius: 6px; font-size: 13px; }
    .item .txt { padding: 3px 0; }
    .rctl { padding: 0 10px 6px; }
    .rctl .stepper button, .rctl .btn.icon { width: 30px; min-height: 30px; }
    .rctl .stepper span { min-width: 52px; font-size: .82rem; }
    .toolbar { margin-top: 16px; }
    /* Accordeon (Han 2026-11-02): één blok per kant open, + in elke kop, allergenen achter het ingrediënt. */
    .oblk > .ohead { cursor: pointer; user-select: none; gap: 4px; transform-origin: 16px 50%; }
    .ohead .cnt { color: var(--muted); font-size: .76rem; white-space: nowrap; }
    .plus { flex: none; width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); color: var(--accent); font-size: 1.1rem; line-height: 1; padding: 0; }
    .obody { overflow: hidden; }
    .obody[hidden] { display: none; }
    .ocat { border-left: 4px solid var(--cc, var(--line)); }
    .rub { display: flex; align-items: center; justify-content: space-between; font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin: 6px 2px -4px; }
    .rub:first-child { margin-top: 0; }
    .vrub { display: flex; justify-content: center; color: var(--muted); font-size: .64rem; letter-spacing: .1em; text-transform: uppercase; font-weight: 600; }
    /* Lange namen lopen over meerdere smalle kolommen i.p.v. één lange verticale regel (scheelt ~75% hoogte). */
    .vt { white-space: normal; max-height: 124px; flex-direction: column; gap: 3px; overflow-wrap: break-word; }
    .vblock .vt > span:first-child { font-size: .76rem; line-height: 1.15; }
    .vrub .vt { white-space: nowrap; max-height: none; }
    .vblock { min-height: 64px; padding: 10px 2px; }
    /* Smalle categorieblokken staan links: tekst van onder naar boven gedraaid en de kleur rechts, zodat de
       "onderkant" van de tekst en de gekleurde rand naar de recepten wijzen (Han: voelt intuïtiever). */
    .ocat.vblock { border-left: 1px solid var(--line); border-right: 4px solid var(--cc); }
    .vt.rev { transform: rotate(180deg); }
    .vgrp { display: flex; gap: 3px; }
    .vcol { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
    .vgrp > .vrub { width: 13px; flex: none; align-items: flex-start; }
    .vblock:not(.vplus) { flex-direction: column; justify-content: flex-start; align-items: center; gap: 6px; }
    .vemo { font-size: 1.45rem; line-height: 1; }
    .vplus { min-height: 40px; align-items: center; font-size: 1.1rem; }
    .inl { display: flex; gap: 6px; padding: 6px 8px 8px; border-top: 1px solid var(--line); }
    .inl input { min-height: 34px; }
    .inl .btn { min-height: 34px; padding: 0 14px; }
    .item .txt { display: flex; flex-wrap: wrap; align-items: center; column-gap: 6px; }
    .nm2 { border: 0; background: none; padding: 0; text-align: left; color: inherit; font: inherit; cursor: pointer; }
    .item.done .txt { text-decoration: none; }
    .item.done .nm2 { text-decoration: line-through; color: var(--muted); }
    .item .tag { margin: 0; }
    .tag.warn { font-weight: 700; letter-spacing: .02em; }
    .algbottom { margin-top: 20px; }
    .lnut .stepper button { width: 28px; min-height: 28px; } .lnut .stepper span { min-width: 34px; font-size: .8rem; }
    .tolink { display: block; padding: 8px 10px; border-top: 1px solid var(--line); color: var(--accent); font-size: .85rem; }
    .toast { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 50; display: flex; align-items: center; gap: 10px; max-width: calc(100vw - 24px);
      padding: 6px 6px 6px 14px; border-radius: 12px; background: var(--text); color: #fff; font-size: .9rem; box-shadow: 0 6px 24px rgba(26, 31, 46, .25); }
    .toast[hidden] { display: none; }
    .toast button { border: 0; background: none; color: #9cc2ff; font-weight: 700; min-height: 36px; padding: 0 10px; white-space: nowrap; }
    /* Voedingsadvies */
    .adv { padding: 6px 10px 8px; border-top: 1px solid var(--line); font-size: .8rem; }
    .nchips { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0; }
    .nchip { padding: 0 7px; border-radius: 99px; font-size: .74rem; }
    .nchip.ok { background: #e6f2ea; color: #2f6b45; } .nchip.mid { background: #fff4e0; color: #8a5a00; } .nchip.low { background: #fde8e8; color: #b42318; }
    .tip { display: flex; align-items: center; gap: 8px; justify-content: space-between; margin-top: 6px; font-size: .82rem; }
    .tip .btn { flex: none; }
    .ntab { display: grid; gap: 5px; margin: 8px 0; }
    .nrow { display: grid; grid-template-columns: minmax(0, 1fr) 68px minmax(0, 1fr) 40px; gap: 8px; align-items: center; font-size: .85rem; }
    .nval, .npct { text-align: right; color: var(--muted); }
    .npct { font-size: .78rem; }
    .nbar { height: 6px; background: var(--line); border-radius: 6px; overflow: hidden; }
    .nbar i { display: block; height: 100%; }
    .nbar i.ok { background: #3f7d5a; } .nbar i.mid { background: #d29a2a; } .nbar i.low { background: #c0473b; }
    .note { margin-top: 6px; font-size: .8rem; padding: 6px 8px; background: #f3effa; border-radius: 8px; }
    /* Aapjesdag-achtergrond: vaste laag achter alles, licht doorschijnend, alleen transform-animatie (licht voor de GPU). */
    .aapbg { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
    /* De achtergrond is één canvas (zie updateBg): 280 losse elementen maakten de hele pagina traag. */
    .aapbg canvas { width: 100%; height: 100%; display: block; }
    .wrap { position: relative; z-index: 1; }
    /* Koppen gelijk voor categorieën en recepten (Han: hoofdletters/lettertype waren niet consistent):
       grote emoji als tegel links, naam vet, voortgang eronder. */
    .oblk > .ohead { font-size: .95rem; font-weight: 600; color: var(--text); text-transform: none; letter-spacing: 0; line-height: 1.25; }
    .hemo { flex: none; width: 34px; align-self: stretch; display: flex; align-items: center; justify-content: center; font-size: 1.65rem; line-height: 1; }
    .addrow { display: block; width: 100%; text-align: left; border: 0; border-top: 1px solid var(--line); background: none; color: var(--accent); padding: 8px 10px; font-size: .85rem; }
    .who { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .pchip { border: 1px solid var(--line); background: var(--card); border-radius: 99px; padding: 2px 11px; font-size: .82rem; min-height: 30px; }
    .pchip.off { opacity: .45; text-decoration: line-through; }
    .pchip.guest { border-style: dashed; }
    .pchip.add { color: var(--accent); }
    .rctl .who { flex: 1; }
    /* Omklappen: een leeg schaduwvak rekt uit en draait; de echte inhoud draait mee zonder vervorming. */
    .ghost { position: fixed; margin: 0; z-index: 0; pointer-events: none; box-sizing: border-box; }
    .gemo { z-index: 2; display: flex; align-items: center; justify-content: center; line-height: 1; }
    .morphing { background: transparent !important; border-color: transparent !important; box-shadow: none !important; }
    :focus-visible { outline: 3px solid rgba(37, 99, 235, .45); outline-offset: 1px; }
  </style>
</head>
<body>
  <div class="aapbg" id="aapbg" aria-hidden="true"></div>
  <div class="wrap">
    <button class="aap" id="aap" type="button">🐒 Reminder: het is vandaag aapjesdag! <span>Tik hier 🙈</span></button>
    <div id="app"></div>
  </div>
  <dialog id="sheet"></dialog>
  <div class="toast" id="toast" role="status" hidden></div>

  <script>
  (() => {
    'use strict';
    /* ============================================================
       Boodschappen — data in de browser (localStorage), geen server.
       Model:
         recipes[]  {id, name, persons, ingredients[{name, qty, unit, cat}]}
         lists[]    {id, name, persons, recipes[{rid, persons}], items[], done{}}
       Kernidee: de ingrediënten van een recept worden NIET naar het lijstje gekopieerd maar bij elke
       render afgeleid uit (recept × personen). Daardoor schaalt "aantal personen" vanzelf mee, en
       kloppen de hoeveelheden nog als je het recept later aanpast. Los toegevoegde dingen (items[])
       zijn vrije tekst. Afvinken van een receptingrediënt staat in list.done[sleutel].
       ============================================================ */
    const KEY = 'boodschappen.v1';
    const UNITS = ['', 'g', 'kg', 'ml', 'l', 'el', 'tl', 'stuk', 'teen', 'bos', 'blik', 'pak', 'fles', 'potje'];
    // Telbare eenheden worden naar boven afgerond: 0,75 ui koop je niet.
    const COUNT_UNITS = new Set(['stuk', 'teen', 'bos', 'blik', 'pak', 'fles', 'potje']);
    // Gram per stuk/teen/blik/… voor het uitrekenen van voeding (bewerkbaar per ingrediënt). Alleen een
    // startwaarde: wat in een recept staat wint. Zelfde tabel voor seed én migratie (geen tweede kopie).
    const GPU = { ui: 110, knoflook: 4, tomaat: 120, komkommer: 400, avocado: 150, citroen: 80, stokbrood: 250,
      groentebouillonblokje: 10, kikkererwten: 240, tomatenpassata: 500, basilicum: 30, rozemarijn: 30, olijfolie: 14 };
    const STOCK = new Set(['olijfolie', 'nootmuskaat']); // basis die je normaal in huis hebt
    // De 14 EU-allergenen. Ids zijn de onze; OFF_ALLERGEN vertaalt de tags van Open Food Facts ernaartoe.
    const ALLERGENS = [['gluten', 'Gluten'], ['crustaceans', 'Schaaldieren'], ['eggs', 'Eieren'], ['fish', 'Vis'], ['peanuts', 'Pinda’s'],
      ['soy', 'Soja'], ['milk', 'Melk'], ['nuts', 'Noten'], ['celery', 'Selderij'], ['mustard', 'Mosterd'], ['sesame', 'Sesam'],
      ['sulphites', 'Sulfiet'], ['lupin', 'Lupine'], ['molluscs', 'Weekdieren']];
    const ALG_NAME = Object.fromEntries(ALLERGENS);
    const OFF_ALLERGEN = { 'en:gluten': 'gluten', 'en:crustaceans': 'crustaceans', 'en:eggs': 'eggs', 'en:fish': 'fish', 'en:peanuts': 'peanuts',

    const EMOJI = [[/nootmuskaat/, '🌰'], [/bouillon/, '🍲'], [/\bui(en)?\b|sjalot/, '🧅'], [/knoflook/, '🧄'], [/pompoen/, '🎃'], [/toma+t|passata/, '🍅'],

      [/wortel|pastinaak|peen/, '🥕'], [/aardappel|krieltjes|friet/, '🥔'], [/paprika/, '🫑'], [/champignon|paddenstoel/, '🍄'], [/mais/, '🌽'],
      [/basilicum|rozemarijn|peterselie|koriander|tijm|munt|bieslook|dille|kruid/, '🌿'], [/pasta|spaghetti|penne|macaroni|noodle/, '🍝'],

    const CAT_EMOJI = { 'Groente & fruit': '🥬', 'Aardappelen, pasta & rijst': '🍝', 'Brood & ontbijt': '🍞', 'Houdbaar': '🥫',
      'Zuivelvervangers': '🥛', 'Kruiden & sauzen': '🧂', 'Beleg': '🥪', 'Dranken': '🥤', 'Lekkers & snacks': '🍬' };
    const emojiFor = (name, cat) => { const info = ingInfo(name); if (info?.emoji) return info.emoji; const n = name.toLowerCase(); const hit = EMOJI.find(([re]) => re.test(n)); return hit ? hit[1] : (CAT_EMOJI[cat] || '🛒'); };
    /* ---------- ingrediëntenlijst (boodschappen-ingredienten.json in de repo) ----------
       Han bewerkt dat bestand op GitHub. De pagina haalt het bij het starten op en bewaart een kopie
       voor offline gebruik. Het levert per ingrediënt emoji, categorie en allergenen; zonder bestand valt

    const DBKEY = 'boodschappen.ingredienten';
    const NL_ALG = { gluten: 'gluten', schaaldieren: 'crustaceans', eieren: 'eggs', vis: 'fish', pinda: 'peanuts', soja: 'soy', melk: 'milk',

    const norm = s => String(s || '').toLowerCase().replace(/\(.*?\)/g, ' ').replace(/\s+/g, ' ').trim(); // "aardappel (kruimig)" → "aardappel"
    let DB = new Map(), DB_KEYS = [];
    const infoCache = new Map();
    function setDB(json) {
      DB = new Map();
      for (const x of json.ingredienten || []) {
        const info = { naam: x.naam, noTip: !!x.geen_tip, nut: x.voeding || null, gram: x.gram || null, emoji: x.emoji, cat: x.categorie, allergens: (x.allergenen || []).map(a => NL_ALG[a]).filter(Boolean), traces: (x.sporen || []).map(a => NL_ALG[a]).filter(Boolean) };
        for (const n of [x.naam, ...(x.ook || [])]) DB.set(norm(n), info);

    // Alleen http(s)-links tonen (geen javascript:-links uit een geïmporteerd of ingetypt recept)
    const safeUrl = u => { try { const x = new URL(String(u || '').trim()); return /^https?:$/.test(x.protocol) ? x.href : ''; } catch (e) { return ''; } };
    const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    // Exacte naam of alias; anders het langste lijst-woord dat als heel woord in de naam staat ("gemengde sla" → sla).
    function ingInfo(name) {
      const n = norm(name); if (!n) return null;
      if (infoCache.has(n)) return infoCache.get(n);
      let hit = DB.get(n);
      if (!hit) { const k = DB_KEYS.find(k => new RegExp(`(^|[\\s-])${escRe(k)}($|[\\s-])`).test(n)); hit = k ? DB.get(k) : null; }
      infoCache.set(n, hit || null);

    }
    // Snel invoeren per regel: "300 g pompoen", "2 avocado", "pompoen 1 kg" of alleen "pompoen".
    const UNIT_ALIAS = { gram: 'g', gr: 'g', kilo: 'kg', liter: 'l', stuks: 'stuk', st: 'stuk', tenen: 'teen', bossen: 'bos', bosje: 'bos', blikken: 'blik', blikje: 'blik',
      pakken: 'pak', pakje: 'pak', flessen: 'fles', potjes: 'potje', eetlepel: 'el', eetlepels: 'el', theelepel: 'tl', theelepels: 'tl' };
    function parseLine(txt) {
      const s = txt.trim().replace(/\s+/g, ' '); if (!s) return null;
      const NUM = '(\\d+(?:[.,]\\d+)?)';
      let m = s.match(new RegExp(`^${NUM}\\s*([a-zA-Z]+)?\\s+(.+)$`)), qty, unit, name;
      if (m) [, qty, unit, name] = m;
      else if ((m = s.match(new RegExp(`^(.+?)\\s+${NUM}\\s*([a-zA-Z]+)?$`)))) [, name, qty, unit] = m;
      else return { name: s, qty: 0, unit: '', qtyText: '' };
      let u = (unit || '').toLowerCase(); u = UNIT_ALIAS[u] || u;
      if (u && !UNITS.includes(u)) { name = unit + ' ' + name; u = ''; } // "2 rode uien": 'rode' is geen eenheid
      if (!u) u = 'stuk';
      const q = parseFloat(qty.replace(',', '.'));

    }
    // Emoji voor een recept/setje: op het soort gerecht (eigen keuze r.emoji wint).
    const DISH_EMOJI = [[/soep/, '🍲'], [/salade/, '🥗'], [/pasta|spaghetti|lasagne|macaroni/, '🍝'], [/curry|dahl|\bdal\b/, '🍛'], [/stoof|stamppot|chili/, '🍲'],

      [/aardappel|krieltjes|friet/, '🥔'], [/rijst|risotto|paella/, '🍚'], [/noedel|\bmie\b|ramen|wok/, '🍜'], [/voorraad|kast/, '🫙']];
    const recipeEmoji = r => r.emoji || (DISH_EMOJI.find(([re]) => re.test(r.name.toLowerCase())) || [])[1] || '🍽️';
    const DEFAULT_CATS = ['Groente & fruit', 'Aardappelen, pasta & rijst', 'Brood & ontbijt', 'Houdbaar',
      'Zuivelvervangers', 'Kruiden & sauzen', 'Beleg', 'Dranken', 'Lekkers & snacks', 'Overig'];

    const uid = () => Math.random().toString(36).slice(2, 9);
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    /* ---------- seed: de eerste keer dat de pagina opent ---------- */
    const ing = (name, qty, unit, cat) => ({ name, qty, unit, cat, ...(GPU[name] ? { gpu: GPU[name] } : {}), ...(STOCK.has(name) ? { stock: true } : {}) });
    // Weekboodschappen: vaste setjes (kind 'week') die niet per persoon schalen. Ook gebruikt door de v3-migratie.
    const seedSets = () => [
      { id: uid(), kind: 'week', name: 'Ontbijt', persons: 4, ingredients: [ing('havermout', 600, 'g', 'Brood & ontbijt'), ing('haverdrink', 2, 'l', 'Zuivelvervangers'), ing('fruit', 12, 'stuk', 'Groente & fruit')] },
      { id: uid(), kind: 'week', name: 'Lunch', persons: 4, ingredients: [ing('brood', 2, 'stuk', 'Brood & ontbijt'), ing('beleg', 0, '', 'Beleg'), ing('sap', 2, 'pak', 'Dranken')] },
    ];
    function seed() {
      const recipes = [
        { id: uid(), name: 'Pompoensoep', persons: 4, ingredients: [

    let S;

    function load() {

    function migrate() {

    /* Wie eet er mee: per lijstje een rij mensen, l.who = [{ id, eid } (iemand uit het huishouden) | { id, naam } (gast)].

    const personOf = w => w.eid ? (S.eaters || []).find(e => e.id === w.eid) : null;

    function syncPersons(l) {

    function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* vol/geblokkeerd: app blijft werken, alleen niet bewaard */ } }

    /* ---------- afgeleide data ---------- */
    function fmtQty(q, u) {
      if (!q) return '';

    // Allergenen van een groep ingrediënten: ingrediëntenlijst ∪ gekoppeld product (Han: "optellen, voorzichtigste
    // wint"). 'unknown' = minstens één ingrediënt staat niet in de lijst én heeft geen product: dan is leeg NIET veilig.
    function allergyOf(gs) {
      const hit = new Set(), trace = new Set(); let unknown = false;
      for (const g of gs) {
        const info = ingInfo(g.name), o = g.off, offOk = !!o && Array.isArray(o.allergens);
        if (!info && !offOk) { unknown = true; continue; }
