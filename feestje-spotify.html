<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#101c45" />
  <title>Spotify koppelen · het scherm in de zaal</title>
  <!-- Spotify koppelen aan /feestje-tv zonder te typen op de tv. De tv toont een QR-code naar deze pagina met een
       geheime code (?id=…). Hier logt u in bij Spotify (OAuth met PKCE, zoals op de tv); Spotify stuurt terug naar
       /feestje-tv, dat meteen hierheen doorverwijst (state "gsm.<id>"). Deze pagina wisselt de code in voor een
       token en zet de refresh-token in de database onder de geheime code (fj_spotify_zet). De tv haalt hem één keer
       op. Deze gsm bewaart de token zelf niet. -->
  <style>
    @font-face { font-family: "Maximilian"; src: url(feestje-fonts/maximilian.ttf) format("truetype"); }
    @font-face { font-family: "Grenze"; src: url(feestje-fonts/grenze-latin.woff2) format("woff2"); font-weight: 100 900; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Grenze", Georgia, serif; font-size: 20px; color: #2a1f16; background: #f1e3c2; line-height: 1.35; }
    header { background: #101c45; color: #f1e6cf; padding: calc(14px + env(safe-area-inset-top)) 16px 14px; }
    h1 { font-family: "Maximilian", serif; font-weight: 400; font-size: 30px; margin: 0; color: #e9be52; }
    main { padding: 18px 16px; max-width: 520px; margin: 0 auto; }
    .knop { display: block; text-align: center; background: #1f7a45; color: #fff; text-decoration: none; border-radius: 30px; padding: 14px 18px; font-size: 22px; margin: 18px 0; }
    .stil { color: #7a5a30; font-size: 17px; }
    .goed { font-family: "Maximilian", serif; font-size: 34px; color: #1f6a3c; }
    .fout { color: #a2302a; }
  </style>
</head>
<body>
  <header><h1>Spotify koppelen</h1></header>
  <main id="app"><p>Even geduld…</p></main>
  <script src="feestje-config.js"></script>
  <script src="feestje-db.js"></script>
  <script>
  'use strict';
  const app = document.getElementById('app');
  const ID = (typeof SPOTIFY !== 'undefined' && SPOTIFY.clientId) || '';
  const TERUG = (typeof SPOTIFY !== 'undefined' && SPOTIFY.terug) || location.origin + '/feestje-tv';   // dezelfde Redirect URI als op de tv
  const q = new URLSearchParams(location.search);
  const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const geldigId = id => /^[0-9a-f]{32,64}$/.test(id || '');

  async function begin(id) {
    // de inloglink vooraf klaarzetten: een gewone link, geen doorverwijzing na een await (pop-upblokkers)
    const verifier = b64url(crypto.getRandomValues(new Uint8Array(48)));
    const challenge = b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)));
    try { localStorage.setItem('feestje.spotify.gsm.' + id, verifier); } catch {}   // localStorage: de login kan in een ander tabblad terugkomen
    const url = 'https://accounts.spotify.com/authorize?' + new URLSearchParams({ client_id: ID, response_type: 'code', redirect_uri: TERUG,
      code_challenge_method: 'S256', code_challenge: challenge, scope: SPOTIFY.scope, state: 'gsm.' + id });
    app.innerHTML = `<p>Hiermee ziet het scherm in de zaal welk nummer er speelt. Log in met het Spotify-account dat de muziek afspeelt.</p>
      <a class="knop" href="${esc(url)}">Inloggen bij Spotify</a>
      <p class="stil">Alleen "wat speelt er nu" wordt gedeeld, niet uw wachtwoord. De koppeling blijft op de tv; deze gsm bewaart niets.</p>`;
  }
  async function terug(id) {
    if (q.get('error')) { app.innerHTML = `<p class="fout">Spotify meldde: ${esc(q.get('error'))}. Scan de QR-code op de tv opnieuw.</p>`; return; }
    let v = ''; try { v = localStorage.getItem('feestje.spotify.gsm.' + id) || ''; localStorage.removeItem('feestje.spotify.gsm.' + id); } catch {}
    history.replaceState(null, '', location.pathname);   // de code uit de adresbalk
    try {
      const r = await fetch('https://accounts.spotify.com/api/token', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({ client_id: ID, grant_type: 'authorization_code', code: q.get('code'), redirect_uri: TERUG, code_verifier: v }) });
      const j = await r.json();
      if (!r.ok || !j.refresh_token) throw new Error(j.error_description || j.error || r.status);
      const ok = await Db.spotifyZet(id, j.refresh_token);
      if (!ok) throw new Error('de database weigerde de code');
      app.innerHTML = `<p class="goed">Gekoppeld ✓</p><p>Het scherm in de zaal neemt het binnen enkele seconden over. U mag deze pagina sluiten.</p>`;
    } catch (e) {
      app.innerHTML = `<p class="fout">Koppelen mislukt: ${esc(e.message)}.</p><p>Druk op de tv opnieuw op "Spotify koppelen via gsm" en scan de nieuwe QR-code.</p>`;
    }
  }

  const state = q.get('state') || '';
  if (!ID) app.innerHTML = '<p class="fout">Er staat nog geen Spotify Client ID in feestje-config.js.</p>';
  else if (state.startsWith('gsm.') && geldigId(state.slice(4)) && (q.get('code') || q.get('error'))) terug(state.slice(4));
  else if (geldigId(q.get('id'))) begin(q.get('id'));
  else app.innerHTML = '<p>Open deze pagina door de QR-code op de tv te scannen (verborgen menu → Spotify koppelen via gsm).</p>';
  </script>
</body>
</html>
