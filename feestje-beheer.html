<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#1a130b" />
  <title>Heraut · tussenstand bijhouden</title>
  <!-- De gsm-kant van /feestje-tv: ridders inschrijven en punten geven per spel. Beveiligd met de pincode (zie feestje-supabase.sql). -->
  <style>
    @font-face { font-family: "Maximilian"; src: url(feestje-fonts/maximilian.ttf) format("truetype"); }
    @font-face { font-family: "Grenze"; src: url(feestje-fonts/grenze-latin.woff2) format("woff2"); font-weight: 100 900; }
    @font-face { font-family: "Grenze"; src: url(feestje-fonts/grenze-latin-ext.woff2) format("woff2"); font-weight: 100 900; unicode-range: U+0100-024F, U+1E00-1EFF; }
    :root { --ink: #2a1f16; --perk: #f1e3c2; --rood: #a2302a; --goud: #c99a3a; --nacht: #101c45; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Grenze", Georgia, serif; font-size: 19px; color: var(--ink); background: var(--perk); line-height: 1.35;
      padding: 0 0 calc(24px + env(safe-area-inset-bottom)); }
    header { background: var(--nacht); color: #f1e6cf; padding: 14px 16px 12px; }
    h1 { font-family: "Maximilian", serif; font-weight: 400; font-size: 30px; margin: 0; color: #e9be52; line-height: 1.1; }
    header p { margin: 2px 0 0; font-size: 15px; color: #cfc3a6; }
    .demo { background: #7c2d1a; color: #fff3df; padding: 8px 16px; font-size: 15px; }
    main { padding: 12px 16px; max-width: 640px; margin: 0 auto; }
    button, input, select { font: inherit; color: inherit; }
    .knop { background: var(--rood); color: #fff3df; border: 0; border-radius: 6px; padding: 10px 16px; min-height: 44px; cursor: pointer; }
    .knop.licht { background: #e3cf9f; color: var(--ink); }
    .knop:disabled { opacity: .5; }
    input[type=text], input[type=password], input[inputmode], select { border: 1px solid #b59a64; border-radius: 6px; padding: 10px 12px; min-height: 44px; background: #fffaf0; width: 100%; }
    .pin { display: grid; gap: 10px; margin-top: 30px; }
    .fout { color: var(--rood); min-height: 1.3em; font-size: 16px; }
    .spelen { display: flex; gap: 6px; overflow-x: auto; padding: 10px 16px; margin: 0 -16px; position: sticky; top: 0; background: var(--perk); z-index: 2; border-bottom: 1px solid #d6c08f; scrollbar-width: none; }
    .spelen button { flex: none; border: 1px solid #b59a64; background: #fffaf0; border-radius: 20px; padding: 8px 14px; min-height: 40px; cursor: pointer; }
    .spelen button[aria-pressed=true] { background: var(--ink); color: #f1e3c2; border-color: var(--ink); }
    .rij { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid #dcc79a; }
    .rij svg { width: 32px; height: 39px; display: block; }
    .rij .bew { position: relative; padding: 0; border: 0; background: none; cursor: pointer; }
    .rij .bew span { position: absolute; right: -6px; bottom: -4px; font-size: 13px; background: #fbf3e0; border-radius: 50%; width: 18px; height: 18px; line-height: 18px; color: #7a5a30; box-shadow: 0 0 0 1px #c9a24a; }
    dialog.bewerk { width: min(440px, calc(100vw - 24px)); border: 0; border-radius: 10px; padding: 18px; background: #f3e6c4; color: #2a1f16; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
    dialog.bewerk::backdrop { background: rgba(10, 6, 2, .6); }
    dialog.bewerk h2 { margin: 0; font-family: "Maximilian", serif; font-weight: 400; font-size: 26px; }
    dialog.bewerk .knoppen { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .rij .naam { font-size: 19px; line-height: 1.15; }
    .rij .naam small { display: block; color: #7a5a30; font-size: 14px; }
    .stepper { display: flex; align-items: center; gap: 4px; }
    .stepper button { width: 44px; height: 44px; border-radius: 50%; border: 1px solid #b59a64; background: #fffaf0; font-size: 24px; line-height: 1; cursor: pointer; }
    .stepper input { width: 64px; text-align: center; font-size: 22px; padding: 6px 4px; font-variant-numeric: tabular-nums; }
    .stepper .ok { width: 18px; font-size: 15px; color: #4a6b3c; }
    .stepper .ok.bezig { color: #b59a64; }
    .stepper .ok.mis { color: var(--rood); }
    details { margin-top: 22px; background: #ead7ab; border-radius: 8px; padding: 10px 14px; }
    summary { cursor: pointer; font-weight: 600; min-height: 32px; }
    .form { display: grid; gap: 10px; margin-top: 10px; }
    .form .w { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .form .naam3 { display: grid; grid-template-columns: auto 1fr 1fr; gap: 8px; }
    .form .naamvb { font-family: "Maximilian", serif; font-size: 1.35rem; color: #a2302a; min-height: 1.4em; }
    .form .voorbeeld { display: flex; gap: 12px; align-items: center; }
    .form .voorbeeld svg { width: 60px; height: 72px; }
    .verwijder { background: none; border: 0; color: var(--rood); text-decoration: underline; cursor: pointer; padding: 10px 0; }
    .leeg { color: #7a5a30; padding: 20px 0; }
    .voet { font-size: 14px; color: #7a5a30; margin-top: 18px; }
    .quiz { display: grid; gap: 10px; margin-top: 10px; }
    .quiz p { margin: 0; }
    .quiz .knop { min-height: 56px; font-size: 20px; }
    .qnr { font-variant-caps: small-caps; letter-spacing: .06em; color: var(--rood); font-weight: 600; }
    .qvraag { font-size: 20px; line-height: 1.25; }
    .qjuist { background: #fffaf0; border-radius: 6px; padding: 6px 10px; }
    .qtijd { font-family: "Maximilian", serif; font-size: 34px; }
    .qwie { font-size: 16px; color: #7a5a30; }
    .qklein { display: flex; gap: 18px; }
  </style>
</head>
<body>
  <header><h1>De heraut</h1><p>Tussenstand voor het scherm in de zaal</p></header>
  <div class="demo" id="demo" hidden>Demomodus: nog geen database gekoppeld. Wijzigingen blijven op dit toestel (pincode 1403). Open <a href="feestje-tv" style="color:#fff3df">/feestje-tv</a> in een ander tabblad om mee te kijken.</div>
  <main id="app"></main>

  <script src="feestje-config.js"></script>
  <script src="feestje-wapen.js"></script>
  <script src="feestje-quiz-vragen.js"></script>
  <script src="feestje-db.js"></script>
  <script>
  'use strict';
  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const app = $('#app');
  // titels voor de riddernaam (er wordt er één geloot; kies gerust een andere)
  const TITELS = ['Heer', 'Vrouwe', 'Ridder', 'Jonker', 'Jonkvrouw', 'Broeder', 'Zuster', 'Meester', 'Ritmeester', 'Burggraaf', 'Burggravin',
    'Baljuw', 'Hofdame', 'Schildknaap', 'Kanselier', 'Pelgrim'];
  if (!Db.live) $('#demo').hidden = false;

  let pin = sessionStorage.getItem('feestje.pin') || localStorage.getItem('feestje.pin') || '';
  let stand = null, spel = null;
  const wapenSvg = (w, uid) => {
    const ok = w && TINCT[w.t1] && TINCT[w.t2] && TINCT[w.c] && w.div in DIVS && w.ch in ALLE_STUKKEN;
    return `<svg viewBox="0 0 200 240" aria-hidden="true">${shieldMarkup(ok ? w : { t1: 'argent', t2: 'argent', div: 'plain', ch: 'none', c: 'or' }, uid, false, '', false)}</svg>`;
  };
  const willekeurigWapen = () => {
    const p = a => a[Math.floor(Math.random() * a.length)];
    const metaal = ['or', 'argent'], kleur = Object.keys(TINCT).filter(k => !metaal.includes(k));
    // heraldische regel: geen kleur op kleur, geen metaal op metaal
    const t1 = p(kleur), t2 = p(metaal);
    return { t1, t2, div: p(Object.keys(DIVS)), ch: p(Object.keys(CHARGES).filter(k => k !== 'none')), c: p(metaal) };
  };

  /* ---------- 1. pincode ---------- */
  async function inloggen() {
    if (pin && await Db.pinOk(pin).catch(() => false)) return start();
    app.innerHTML = `<form class="pin" id="pinform"><label for="pinin">Pincode van de heraut</label>
      <input id="pinin" type="password" autocomplete="current-password" ${Db.live ? '' : 'value="1403"'} required>
      <label style="font-size:16px"><input type="checkbox" id="onthoud" checked style="width:auto;min-height:0"> Onthoud op deze gsm</label>
      <button class="knop">Open het register</button><div class="fout" id="pinfout" role="alert"></div></form>`;
    $('#pinform').addEventListener('submit', async e => {
      e.preventDefault(); const p = $('#pinin').value.trim(); $('#pinfout').textContent = 'Even controleren…';
      let ok = false; try { ok = await Db.pinOk(p); } catch (err) { $('#pinfout').textContent = 'Geen verbinding: ' + err.message; return; }
      if (!ok) { $('#pinfout').textContent = 'Dat is niet de juiste pincode.'; return; }
      pin = p; sessionStorage.setItem('feestje.pin', p); if ($('#onthoud').checked) localStorage.setItem('feestje.pin', p);
      start();
    });
  }

  /* ---------- 2. het register ---------- */
  function start() {
    app.innerHTML = `<nav class="spelen" id="spelen" aria-label="Spel"></nav><div id="ridders"></div>
      <details id="nieuw"><summary>Ridder inschrijven</summary><form class="form" id="rform">
        <div class="naam3">
          <select id="rtitel" aria-label="Titel">${TITELS.map(t => `<option>${t}</option>`).join('')}</select>
          <input type="text" id="rvoor" placeholder="Voornaam" maxlength="20" required autocomplete="off" autocapitalize="words">
          <input type="text" id="rstad" placeholder="Geboortestad" maxlength="26" required autocomplete="off" autocapitalize="words">
        </div>
        <div class="naamvb" id="rnaam" aria-live="polite"></div>
        ${kiezerHtml('r')}
        <button class="knop">Inschrijven</button><div class="fout" id="rfout" role="alert"></div></form></details>
      <details><summary>Spel toevoegen</summary><form class="form" id="sform"><input type="text" id="snaam" placeholder="bv. Armworstelen" maxlength="30" required autocomplete="off">
        <button class="knop">Toevoegen</button><div class="fout" id="sfout" role="alert"></div></form></details>
      <details id="quiz"><summary>Quiz leiden</summary><div id="qbox" class="quiz"></div><div class="fout" id="qfout" role="alert"></div></details>
      <p class="voet">Punten worden bewaard zodra u stopt met tikken. Het scherm in de zaal ververst binnen enkele seconden.
        ${Db.live ? '' : '<br><button type="button" class="verwijder" id="reset">Demo terugzetten</button>'}
        <br><button type="button" class="verwijder" id="uit">Afmelden op deze gsm</button></p>
      <details id="pinwissel"${pin === 'VERANDER-MIJ' ? ' open' : ''}><summary>Pincode wijzigen</summary>
        ${pin === 'VERANDER-MIJ' ? '<p class="fout">U gebruikt nog de tijdelijke pincode. Kies nu uw eigen.</p>' : ''}
        <form class="form" id="pform"><input type="password" id="pn1" placeholder="Nieuwe pincode (minstens 6 tekens)" autocomplete="new-password" minlength="6" required>
        <input type="password" id="pn2" placeholder="Nogmaals" autocomplete="new-password" minlength="6" required>
        <button class="knop">Wijzigen</button><div class="fout" id="pfout" role="alert"></div></form></details>`;
    const { lees: leesWapen, zet: zetWapen } = kiezer('r');
    zetWapen(willekeurigWapen());
    // de naam: titel + voornaam + "van" + geboortestad, bv. "Jonker Han van Leuven"
    const lotTitel = () => { $('#rtitel').value = TITELS[Math.floor(Math.random() * TITELS.length)]; };
    const riddernaam = () => { const v = $('#rvoor').value.trim(), st = $('#rstad').value.trim(); return v && st ? `${$('#rtitel').value} ${v} van ${st}` : ''; };
    const toonNaam = () => { $('#rnaam').textContent = riddernaam() || `${$('#rtitel').value} … van …`; };
    lotTitel(); toonNaam();
    ['#rtitel', '#rvoor', '#rstad'].forEach(k => $(k).addEventListener('input', toonNaam));
    $('#rform').addEventListener('submit', async e => {
      e.preventDefault(); const naam = riddernaam(); if (!naam) return;
      try { await Db.voegRidder(pin, naam, leesWapen()); $('#rvoor').value = $('#rstad').value = ''; lotTitel(); toonNaam(); zetWapen(willekeurigWapen()); $('#rfout').textContent = ''; ververs(); }
      catch (err) { $('#rfout').textContent = err.message; }
    });
    $('#sform').addEventListener('submit', async e => {
      e.preventDefault(); const naam = $('#snaam').value.trim(); if (!naam) return;
      try { const id = await Db.voegSpel(pin, naam); $('#snaam').value = ''; spel = id; $('#sfout').textContent = ''; ververs(); }
      catch (err) { $('#sfout').textContent = err.message; }
    });
    $('#reset')?.addEventListener('click', () => { if (confirm('De demo-stand terugzetten?')) { Db.demoReset(); ververs(); } });
    $('#pform').addEventListener('submit', async e => {
      e.preventDefault(); const n1 = $('#pn1').value, n2 = $('#pn2').value;
      if (n1 !== n2) { $('#pfout').textContent = 'De twee pincodes zijn niet gelijk.'; return; }
      try {
        await Db.wijzigPin(pin, n1);
        pin = n1; sessionStorage.setItem('feestje.pin', n1); if (localStorage.getItem('feestje.pin')) localStorage.setItem('feestje.pin', n1);
        $('#pfout').style.color = '#4a6b3c'; $('#pfout').textContent = 'Gewijzigd. Gebruik voortaan uw nieuwe pincode.'; $('#pform').reset();
      } catch (err) { $('#pfout').style.color = ''; $('#pfout').textContent = err.message; }
    });
    $('#uit').addEventListener('click', () => { localStorage.removeItem('feestje.pin'); sessionStorage.removeItem('feestje.pin'); pin = ''; location.reload(); });
    Db.volg((s, fout) => { if (s) { stand = s; teken(); } }, 5000);
    // de quiz: alleen opvragen zolang dit deel open staat
    let qt = null;
    $('#quiz').addEventListener('toggle', () => { clearInterval(qt); if ($('#quiz').open) { quiz(); qt = setInterval(quiz, 1500); } });
  }

  /* ---------- 4. de quiz leiden ----------
     uit → (vragen laden) → start → per vraag: wacht (vraag op de tv) → open (antwoorden, 30 s) → sluit → toon (antwoord + punten) → volgende */
  const LETTERS = ['A', 'B', 'C', 'D'];
  const romeinsK = n => { let o = ''; for (const [v, r] of [[100, 'c'], [90, 'xc'], [50, 'l'], [40, 'xl'], [10, 'x'], [9, 'ix'], [5, 'v'], [4, 'iv'], [1, 'i']]) while (n >= v) { o += r; n -= v; } return o; };
  let qStaat = '';
  async function quiz(actie) {
    const box = $('#qbox'); if (!box) return;
    let m;
    try {
      if (actie === 'laad') { const n = await Db.quizLaad(pin, Db.quizVoorbereid(QUIZ_VRAGEN)); $('#qfout').textContent = `${n} vragen geladen.`; }
      m = actie && actie !== 'laad' ? await Db.quizStap(pin, actie) : await Db.quizMeester(pin);
      if (actie && actie !== 'laad') $('#qfout').textContent = '';
    } catch (e) { $('#qfout').textContent = e.message; return; }
    const naamVan = id => esc(stand?.ridders.find(r => r.id === id)?.naam.split(' van ')[0] || '?');
    const staat = JSON.stringify([m.fase, m.nr, m.totaal, m.antwoorden_van, m.fase === 'open' ? Math.floor(m.verstreken || 0) : 0]);
    if (staat === qStaat && !actie) return; qStaat = staat;
    const k = (a, label, extra = '') => `<button type="button" class="knop ${extra}" data-a="${a}">${label}</button>`;
    const juist = m.soort === 'keuze' ? `${LETTERS[m.juist]}. ${esc(m.antwoorden?.[m.juist])}` : esc(m.juist);
    const vraag = m.nr ? `<p class="qnr">Vraag ${romeinsK(m.nr)} van ${romeinsK(m.totaal)} · ${m.soort === 'keuze' ? 'meerkeuze' : m.soort === 'woord' ? 'woord' : 'schatting'}</p>
      <p class="qvraag">${esc(m.vraag)}</p><p class="qjuist">Juist: <b>${juist}</b></p>` : '';
    const wie = m.antwoorden_van?.length ? `<p class="qwie">${m.antwoorden_van.length} van ${m.ridders} geantwoord: ${m.antwoorden_van.map(naamVan).join(', ')}</p>` : `<p class="qwie">Nog niemand geantwoord (${m.ridders} ridders).</p>`;
    let knoppen = '';
    if (m.fase === 'uit' && !m.nr) knoppen = `<p>${m.totaal ? `${m.totaal} vragen klaar.` : 'Nog geen vragen geladen.'} Spelers gaan naar <b>resonantxp.com/feestje-quiz</b> (QR-code op de tv).</p>
      ${k('laad', `Vragen laden (${QUIZ_VRAGEN.length} uit feestje-quiz-vragen.js)`, 'licht')}${m.totaal ? k('start', 'Start de quiz') : ''}`;
    else if (m.fase === 'uit') knoppen = `<p>De quiz is gedaan. De punten staan in de tussenstand onder Quiz.</p>${k('reset', 'Alles wissen en opnieuw', 'licht')}`;
    else if (m.fase === 'wacht') knoppen = `${vraag}<p>De vraag staat op de tv. Open hem als iedereen hem gelezen heeft.</p>${k('open', 'Open de vraag')}`;
    else if (m.fase === 'open') knoppen = `${vraag}<p class="qtijd">${Math.floor(m.verstreken || 0)} s</p>${wie}${k('sluit', 'Sluit de vraag', 'licht')}${k('toon', 'Toon het antwoord')}`;
    else if (m.fase === 'dicht') knoppen = `${vraag}${wie}${k('toon', 'Toon het antwoord')}`;
    else if (m.fase === 'uitslag') knoppen = `${vraag}${wie}${k('volgende', m.nr < m.totaal ? 'Volgende vraag' : 'Einde: eindstand op de tv')}`;
    if (m.fase !== 'uit') knoppen += `<div class="qklein"><button type="button" class="verwijder" data-a="stop">Quiz stoppen</button> <button type="button" class="verwijder" data-a="reset">Alles wissen</button></div>`;
    box.innerHTML = knoppen;
    box.querySelectorAll('[data-a]').forEach(b => b.addEventListener('click', () => {
      const a = b.dataset.a;
      if (a === 'reset' && !confirm('Alle antwoorden en quizpunten wissen?')) return;
      if (a === 'laad' && m.totaal && !confirm('De vragen opnieuw laden? Dit wist ook de antwoorden.')) return;
      if (a === 'stop' && !confirm('De quiz stoppen? (Antwoorden blijven bewaard.)')) return;
      box.querySelectorAll('button').forEach(x => x.disabled = true); quiz(a);
    }));
  }
  const ververs = async () => { try { stand = await Db.stand(); teken(); } catch {} };

  /* ---------- 3. tekenen (zonder het veld waarin u typt te overschrijven) ---------- */
  function teken() {
    if (!stand) return;
    if (!stand.spelen.some(s => s.id === spel)) spel = stand.spelen[0]?.id ?? null;
    $('#spelen').innerHTML = stand.spelen.map(s => `<button type="button" data-id="${s.id}" aria-pressed="${s.id === spel}">${esc(s.naam)}</button>`).join('');
    $('#spelen').querySelectorAll('button').forEach(b => b.addEventListener('click', () => { spel = +b.dataset.id; teken(); }));
    const actief = document.activeElement?.dataset?.r;
    const rows = ranglijst(stand).sort((a, b) => a.naam.localeCompare(b.naam, 'nl'));
    const box = $('#ridders');
    if (!rows.length) { box.innerHTML = '<p class="leeg">Nog geen ridders. Schrijf ze hieronder in.</p>'; return; }
    // bestaande rijen bijwerken in plaats van alles opnieuw te bouwen (zo blijft het toetsenbord open)
    const sleutel = rows.map(r => r.id).join(',') + '|' + spel;
    if (box.dataset.k !== sleutel) {
      box.dataset.k = sleutel;
      box.innerHTML = rows.map(r => `<div class="rij" data-r="${r.id}"><button type="button" class="bew" aria-label="${esc(r.naam)} bewerken">${wapenSvg(r.wapen, 'b' + r.id)}<span aria-hidden="true">✎</span></button>
        <div class="naam">${esc(r.naam)}<small></small></div>
        <div class="stepper"><button type="button" data-d="-1" aria-label="Eén punt minder voor ${esc(r.naam)}">−</button>
          <input inputmode="numeric" pattern="-?[0-9]*" data-r="${r.id}" aria-label="Punten voor ${esc(r.naam)}">
          <button type="button" data-d="1" aria-label="Eén punt meer voor ${esc(r.naam)}">+</button><span class="ok" aria-hidden="true"></span></div></div>`).join('');
      box.querySelectorAll('.rij').forEach(rij => {
        const id = +rij.dataset.r, inp = rij.querySelector('input');
        rij.querySelectorAll('[data-d]').forEach(b => b.addEventListener('click', () => { inp.value = String((parseInt(inp.value, 10) || 0) + +b.dataset.d); bewaar(id, inp); }));
        inp.addEventListener('input', () => bewaar(id, inp));
        rij.querySelector('.bew').addEventListener('click', () => beheerRidder(id));
      });
    }
    for (const r of rows) {
      const rij = box.querySelector(`.rij[data-r="${r.id}"]`); if (!rij) continue;
      const inp = rij.querySelector('input'), v = r.per(spel);
      if (String(actief) !== String(r.id) && !inp.dataset.wacht) inp.value = v == null ? '' : v;
      rij.querySelector('small').textContent = `totaal ${r.totaal} · plaats ${r.plaats}`;
    }
  }

  // bewaren met een korte pauze (debounce): pas na 700 ms zonder tikken gaat het naar de database
  const timers = new Map();
  function bewaar(id, inp) {
    const ok = inp.parentElement.querySelector('.ok');
    inp.dataset.wacht = 1; ok.textContent = '…'; ok.className = 'ok bezig';
    clearTimeout(timers.get(id));
    timers.set(id, setTimeout(async () => {
      const v = parseInt(inp.value, 10);
      try {
        await Db.zetPunten(pin, id, spel, isNaN(v) ? 0 : v);
        ok.textContent = '✓'; ok.className = 'ok';
        delete inp.dataset.wacht; ververs();
      } catch (err) { ok.textContent = '!'; ok.className = 'ok mis'; ok.title = err.message; delete inp.dataset.wacht; }
    }, 700));
  }

  /* de wapenkiezer (inschrijven én bewerken): veld, deling, tweede kleur, stuk, kleur van het stuk + voorbeeld */
  const WK = ['t1', 'div', 't2', 'ch', 'c'];
  function kiezerHtml(p) {
    const opt = (o, f) => Object.entries(o).map(([k, v]) => `<option value="${k}">${f(v)}</option>`).join('');
    return `<div class="voorbeeld"><span id="${p}voorbeeld"></span><button type="button" class="knop licht" id="${p}lot">⚄ Ander wapen</button></div>
      <div class="w">
        <select id="${p}-t1" aria-label="Veld">${opt(TINCT, v => 'Veld: ' + v[0])}</select>
        <select id="${p}-div" aria-label="Deling">${opt(DIVS, v => v)}</select>
        <select id="${p}-t2" aria-label="Tweede kleur">${opt(TINCT, v => '2e kleur: ' + v[0])}</select>
        <select id="${p}-ch" aria-label="Stuk">${opt(ALLE_STUKKEN, v => 'Stuk: ' + v)}</select>
        <select id="${p}-c" aria-label="Kleur van het stuk">${opt(TINCT, v => 'Stuk in ' + v[0].toLowerCase())}</select>
      </div>`;
  }
  function kiezer(p) {
    const lees = () => Object.fromEntries(WK.map(k => [k, $(`#${p}-${k}`).value]));
    const zet = w => { WK.forEach(k => { if (w[k] != null) $(`#${p}-${k}`).value = w[k]; }); $(`#${p}voorbeeld`).innerHTML = wapenSvg(lees(), p + 'vb'); };
    WK.forEach(k => $(`#${p}-${k}`).addEventListener('change', () => zet(lees())));
    $(`#${p}lot`).addEventListener('click', () => zet(willekeurigWapen()));
    return { lees, zet };
  }

  // een ridder bewerken (✎ naast de naam): naam en wapen aanpassen, of uitschrijven
  async function beheerRidder(id) {
    const r = stand.ridders.find(x => x.id === id); if (!r) return;
    const dlg = document.createElement('dialog'); dlg.className = 'bewerk';
    dlg.innerHTML = `<form method="dialog" class="form" id="eform"><h2>Ridder bewerken</h2>
      <input type="text" id="enaam" maxlength="60" required autocomplete="off" aria-label="Naam">
      ${kiezerHtml('e')}
      <div class="knoppen"><button class="knop" value="ok">Bewaren</button><button class="knop licht" value="" formnovalidate>Annuleren</button></div>
      <button type="button" class="verwijder" id="eweg">Uitschrijven…</button><div class="fout" id="efout" role="alert"></div></form>`;
    document.body.appendChild(dlg);
    const k = kiezer('e'); $('#enaam').value = r.naam; k.zet({ ...r.wapen });
    $('#eweg').addEventListener('click', async () => {
      if (!confirm(`${r.naam} uitschrijven, met al zijn punten?`)) return;
      try { await Db.verwijderRidder(pin, id); dlg.close(); ververs(); } catch (err) { $('#efout').textContent = err.message; }
    });
    $('#eform').addEventListener('submit', async e => {
      if (e.submitter?.value !== 'ok') return;
      e.preventDefault();
      try { await Db.wijzigRidder(pin, id, $('#enaam').value.trim(), { ...r.wapen, ...k.lees() }); dlg.close(); ververs(); }
      catch (err) { $('#efout').textContent = err.message; }
    });
    dlg.addEventListener('close', () => dlg.remove());
    dlg.showModal();
  }

  inloggen();
  </script>
</body>
